    <title>รายงานสินค้าเข้า</title>

    <!-- Bootstrap Import -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.6/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.1.1/css/all.css" integrity="sha384-O8whS3fhG2OnA5Kas0Y9l3cfpmYjapjI0E4theH4iuMD+pLhbf6JI0jIMfYcK3yZ"
        crossorigin="anonymous">

    <!-- QRcode -->
    <script type="text/javascript" src="js/qrcode.min.js"></script>
    <script type="text/javascript" src="js/jQuery.print.js"></script>

    <!-- Super cool dialog-->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.0/jquery-confirm.min.js"></script>

    <!-- Loading -->

    <!-- Font -->

    <style>
    body{color: var(--text-primary);}
    .ipt-odd, .ipt-even{
      padding-top: 14px; padding-bottom: 14px; color: var(--text-primary); margin-bottom: 8px; cursor: pointer;
      background-color: #ffffff !important; border: 1px solid var(--border-light); border-radius: var(--radius-sm);
      box-shadow: var(--shadow-sm); transition: all 0.15s ease;
    }
    .ipt-odd:hover, .ipt-even:hover{
      border-color: var(--color-dark) !important; background-color: #f8fafc !important; box-shadow: var(--shadow-md); transform: translateY(-1px);
    }
    .ipt-odd h5, .ipt-even h5{
      color: var(--color-black) !important; font-weight: 600; font-size: 1rem;
    }
    h5{
      letter-spacing: 2px;
    }
    ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }
    div[id^="detail"]{
        margin-bottom: 0.8em;
    }
    .items{
        font-size: 120%;
    }
    div[id^="item-"]{
        margin-top: 0.5em;
    }
  </style>
  <script>
    var start = start_s = 0;
    var bool = bool_s = false;
    var tempdate, no = 1;

    $(document).ready(function(){
      if(!localStorage.user_id){
        window.location = 'web_login.html';
        return;
      }
      get_import();
      
      window.addEventListener('scroll', () => { 
        const scrollPosition = window.scrollY + window.innerHeight; 
        const documentHeight = document.documentElement.scrollHeight; 
    
        if (scrollPosition >= documentHeight - 1) { 
          if(!$("#myUL").prop('hidden')){
            if(bool){
              return 0;
            }
            get_import();           
          }else if(!$("#myS").prop('hidden')){
            if(bool_s){
              return 0;
            }
            get_import_s();
          }
        } 
      });
    });
    
    $(document).keydown(function(objEvent) {
      if (objEvent.keyCode == 13) {  //enter pressed
        objEvent.preventDefault();           
        search();        
      }         
    });

    function get_import(){
      $.ajax({
        type: "POST",
        url:"php/get_transfer.php",
        data: {'start': start},       
        beforeSend: function(){
          EasyLoading.show({ text: "กำลังโหลด" });
        },                       
        success: function(data){ 
          EasyLoading.hide();
          var obj = (typeof data === 'string') ? JSON.parse(data) : data;
          if(obj[0] == "last"){
            bool = true;
          }                        
          $.each(obj, function(i, field){
            if(i > 0){
              var txt = field.date_time.split(" ");
              var txt2 = txt[0].split("-");
              var date = txt2[2] + "/" + txt2[1] + "/" + txt2[0].substr(2);
              if(tempdate != date){
                  tempdate = date;
                  no = 1;
              }
              var supName = field.supplier_name || field.source_from;
              var sourceTxt = supName && supName.trim() !== ''
                ? '<span class="badge badge-primary font-weight-bold px-2 py-1" style="font-size: 0.88rem;"><i class="fas fa-store mr-1"></i>' + supName + '</span>'
                : '<span class="text-muted" style="font-size: 0.88rem;">-</span>';
              if (field.ref_invoice && field.ref_invoice.trim() !== '') {
                sourceTxt += '<div class="text-muted font-weight-normal mt-1" style="font-size: 0.8rem;"><i class="fas fa-file-invoice mr-1 text-success"></i>' + field.ref_invoice + '</div>';
              }

              $('#myUL').append('<li id="ipt-'+field.tran_id+'">' +
              '<div class="row justify-content-center ipt-even align-items-center" data-toggle="collapse" href="#detail-'+field.tran_id+'" role="button" aria-expanded="false" aria-controls="detail-'+field.tran_id+'" onclick="appendCollapse('+field.tran_id+');">'+
                  '<div class="col-1 text-center"><h5>'+no+'</h5></div>' +  
                  '<div class="col-3 text-center"><h5>'+field.tran_number+'</h5></div>' +
                  '<div class="col-3 text-center"><h5>'+date+'</h5></div>' +
                  '<div class="col-3 text-center"><h5>'+field.shop_name+'</h5></div>' +
                  '<div class="col-2 text-center"><h5>'+sourceTxt+'</h5></div>' +
              '</div>' +
            '</li>');
            no++;
            }                                               
          });                                          
        },
        error: function(){
          EasyLoading.hide();
        }
      });
      start += 30;
    }   

    var val;
    function search(){
      if($('#input-search').val() == ""){
        return 0;
      }     
      val = $('#input-search').val();
      start_s = 0;
      bool_s = false;
      $("#myS").prop('hidden', false);
      $("#myUL").prop('hidden', true);     
      $("#myS").empty();
      tempdate = "";
      no = 1;
      get_import_s();
    }

    function get_import_s(){
      $.ajax({
        type: "POST",
        url:"php/get_transfer.php",
        data: {'start': start_s, 'value' : val},
        beforeSend: function(){
          EasyLoading.show({ text: "กำลังโหลด" });
        },                       
        success: function(data){ 
          EasyLoading.hide();
          var obj = (typeof data === 'string') ? JSON.parse(data) : data;
          if(obj[0] == "last"){
            bool_s = true;
          }                        
          $.each(obj, function(i, field){
            if(i > 0){
              var txt = field.date_time.split(" ");
              var txt2 = txt[0].split("-");
              var date = txt2[2] + "/" + txt2[1] + "/" + txt2[0].substr(2);
              if(tempdate != date){
                  tempdate = date;
                  no = 1;
              }
              var supName = field.supplier_name || field.source_from;
              var sourceTxt = supName && supName.trim() !== ''
                ? '<span class="badge badge-primary font-weight-bold px-2 py-1" style="font-size: 0.88rem;"><i class="fas fa-store mr-1"></i>' + supName + '</span>'
                : '<span class="text-muted" style="font-size: 0.88rem;">-</span>';
              if (field.ref_invoice && field.ref_invoice.trim() !== '') {
                sourceTxt += '<div class="text-muted font-weight-normal mt-1" style="font-size: 0.8rem;"><i class="fas fa-file-invoice mr-1 text-success"></i>' + field.ref_invoice + '</div>';
              }

              $('#myS').append('<li id="ipts-'+field.tran_id+'">' +
              '<div class="row justify-content-center ipt-even align-items-center" data-toggle="collapse" href="#details-'+field.tran_id+'" role="button" aria-expanded="false" aria-controls="details-'+field.tran_id+'" onclick="appendCollapses('+field.tran_id+');">'+
                '<div class="col-1 text-center"><h5>'+no+'</h5></div>' +  
                '<div class="col-3 text-center"><h5>'+field.tran_number+'</h5></div>' +
                '<div class="col-3 text-center"><h5>'+date+'</h5></div>' +
                '<div class="col-3 text-center"><h5>'+field.shop_name+'</h5></div>' +
                '<div class="col-2 text-center"><h5>'+sourceTxt+'</h5></div>' +
              '</div>' +
            '</li>');
            no++;
            }                                                
          });                                         
        },
        error: function(){
          EasyLoading.hide();
        }
      });
      start_s += 30;
    }

    function delete_bill(im_id, shop_id){
      if(localStorage.user_role !== "แอดมิน" && localStorage.user_role !== "เจ้าของร้าน"){
        alert("เฉพาะแอดมินและเจ้าของร้านเท่านั้นที่มีสิทธิ์ลบรายการ");
        return;
      }
      $.confirm({
        title: 'ลบรายการ',
        content: 'ต้องการลบรายการนี้หรือไม่?',
        backgroundDismiss: true,
        buttons: { 
          formSubmit: {
            text: 'ตกลง',
            btnClass: 'btn-danger',
            action: function () {
              // delete bill
              $.ajax({
                type: "POST",
                url:"php/delete_transfer.php",         
                data:{'imp_id' : im_id,'ware_id' : shop_id},
                beforeSend: function(){
                  EasyLoading.show({                           
                    text: "กำลังโหลด"
                  });
                },                       
                success: function(data){ 
                  EasyLoading.hide();
                  if(data == "success"){                    
                    $('#ipt-'+im_id).remove()
                    $('#ipts-'+im_id).remove()
                  }else{
                    $.confirm({
                      title: 'พบข้อผิดพลาด',
                      content: 'ลองอีกครั้ง',
                      backgroundDismiss: true,
                      buttons: {
                        formSubmit: {
                        text: 'ตกลง',
                        btnClass: 'btn-regis',
                        action: function () {
                        }
                        }
                      }
                    });
                  }                         
                }               
              });      
            }
          },ยกเลิก: function () {}, 
        }  
      });
    }
  
    function appendCollapse(index){
        if($("#detail-"+index).length){
            //
        }else{
          arr_data = [];
          var text = ""
          $.ajax({
            type: "POST",
            url:"php/get_transfer_info.php",    
            data:{'imp_id' : index},
            async:false,                          
            beforeSend: function(){
              EasyLoading.show({                           
                text: "กำลังโหลด"
              });
            },             
            success: function(data){  
              EasyLoading.hide();
              var obj = (typeof data === 'string') ? JSON.parse(data) : data; 
              var supHeader = (obj[0].supplier_name || obj[0].source_from || '-');
              var refHeader = obj[0].ref_invoice ? (' | บิลร้าน: <b class="text-success">' + obj[0].ref_invoice + '</b>') : '';
              text = text + '<div class="collapse" id="detail-'+index+'">'+
                '<div class="card card-body">'+
                  '<div class="row justify-content-center mb-2">'+
                      '<h5 class="text-secondary"><i class="fas fa-store text-primary mr-1"></i> ร้านค้า: <strong class="text-dark">' + supHeader + '</strong>' + refHeader + '</h5>'+
                  '</div>'             
              $.each(obj, function(i, field){
                var canViewCost = (localStorage.user_role === "แอดมิน" || localStorage.user_role === "เจ้าของร้าน");
                var cost = canViewCost ? field.tran_cost : "-";
                var itemTotalCost = canViewCost ? (field.amount * field.tran_cost) : "-";
                var skuBadge = field.supplier_sku && field.supplier_sku.trim() !== ''
                  ? ' <span class="badge badge-light border text-info ml-1" style="font-size: 0.76rem;"><i class="fas fa-tag mr-1"></i>SKU: ' + field.supplier_sku + '</span>'
                  : '';
                text = text + '<div id="item-'+field.item_id+'" class="row justify-content-center">'+
                  '<div class="col-1 text-center items">'+(i+1)+'</div>'+
                  '<div class="col-1 text-center items">'+field.amount+'</div>'+
                  '<div class="col-6 text-center items"><span class="hover-prod-preview" data-prod-id="'+field.prod_id+'" data-prod-code="'+(field.prod_code||'')+'">'+field.prod_name+'</span>' + skuBadge + '</div>'+
                  '<div class="col-2 text-center items">'+cost+'</div>'+
                  '<div class="col-2 text-center items">'+itemTotalCost+'</div>'+
                '</div>'
                
                item = {}
                item ["qr"] =  field.prod_code
                item ["name"] =  field.prod_name
                item ["amt"] =  field.amount
                item ["price"] = field.prod_price
                arr_data.push(item);
              });
              text = text + '<hr style="width: 50%; margin: auto; margin-top: 1em;">'+
                  '<div class="row" style="margin-top: 1em;">'+
                      '<div class="col-4 text-right"><h4>รวม</h4></div>'+
                      '<div class="col-4 text-right"><h4>'+(canViewCost ? obj[0].total_tran : "-")+'</h4></div>'+
                  '</div>'+
                  '<div class="row">'+
                      '<div class="col-4 text-right"><h4>ผู้ทำรายการ</h4></div>'+
                      '<div class="col-4 text-right"><h4>'+obj[0].user_name+'</h4></div>'+
                  '</div>'+
                  '<div class="row justify-content-center" style="margin-top: 1em;">'+
                  '<div class="col-4 text-right">'+                   
                    '<button onclick="print.apply(this,arr_data)" class="btn btn-lg btn-warning" style="color: white;">พิมพ์รายการ  <i class="fas fa-print"></i></button>'+
                  '</div>'+
                  '<div class="col-4 text-left">'+
                      '<button class="btn btn-lg btn-danger" style="color: white;" onclick="delete_bill('+index+','+obj[0].shop_id+')">ลบรายการ <i class="fas fa-trash"></i></button>'+
                  '</div>'+        
                '</div>'+                
            '</div>'+
              '</div>';                   
            }               
          });

          $("#ipt-"+index).append(text);
        }
        $('html, body').animate({
              scrollTop: $("#ipt-"+index).offset().top
          }, 1100);
    }

          $("#ipts-"+index).append(text);
        }
        $('html, body').animate({

          }, 1100);

    function print(...arr_data){
      $('#show_qr').empty();
      var qrcode;
      var sum = 0;
			var index_qr = 1;
			$.each(arr_data, function(i, field){				
				for(var j = 0 ; j < arr_data[i].amt; j++){					
					if(index_qr % 2 != 0){						
						$('#show_qr').append('<div id="ctn'+index_qr+'" class="ctn">' +
						'<div class="left">' +
							'<div class="name">'+arr_data[i].name+'</div>' +
							'<div style="display: inline-block; float: left; margin-left: 5%;">'+
								'<div class="qr-l" id="qrcode'+index_qr+'"></div>' +
								'<div class="code-l">'+arr_data[i].qr+'</div>'+
							'</div>'+
							'<div class="price-l">ราคา '+arr_data[i].price+' บาท</div>' +
						'</div>' +						
						'</div>');		
					}else{						
						$('#ctn'+(index_qr-1)).append('<div class="right">' +
							'<div class="name">'+arr_data[i].name+'</div>' +
							'<div style="display: inline-block; float: left; margin-left: 5%;">'+
								'<div class="qr-l" id="qrcode'+index_qr+'"></div>' +
								'<div class="code-l">'+arr_data[i].qr+'</div>'+
							'</div>'+
							'<div class="price-l">ราคา '+arr_data[i].price+' บาท</div>' +
						'</div>');
					}											
					qrcode = new QRCode("qrcode"+index_qr,{width: 57, height: 57});
					qrcode.makeCode(arr_data[i].qr);
					index_qr++;
				}				                                                           
			});	

			var WinPrint  = window.open();
			window.setTimeout(function() {
				var ele =  document.getElementById('show_qr').innerHTML;			
				WinPrint.document.write("<html><head><link href='https://fonts.googleapis.com/css?family=Maitree' rel='stylesheet'></head><body>");
				WinPrint.document.write("<style>@media print {body {-webkit-print-color-adjust: exact;}} @page {size: auto; margin: 0mm;} .name{line-height: 1.2; font-size: 0.9em; word-wrap:break-word; height: 3.5em; margin-top: 0%;}.ctn{width: 10.1cm; height: 3.79cm; margin-top: -2.1mm; margin-left: 0mm;} .left{float: left; width: 5.05cm; height: 3.97cm; text-align: center;} .right{float: left; width: 5.05cm; height: 3.97cm; text-align: center;} .qr-r{width: 15mm; height: 15mm; margin-right: 2%; float: right; background-color: black; color: white;} .code-r{margin-right: 8%; margin-top: 3%;font-size: 0.7em} .price-r{margin-top: 8%;font-size: 1em;} .qr-l{width: 15mm; height: 15mm; margin-right: 2%; float: left; background-color: black; color: white;} .code-l{margin-right: 8%; margin-top: 3%;font-size: 0.7em} .price-l{margin-top: 8%;font-size: 1em;} </style>" +
					ele);
				WinPrint.document.write('</body></html>');
				WinPrint.document.close();
				WinPrint.focus();
				window.setTimeout(function() {
					WinPrint.print();
					WinPrint.close();
					//cancel();		
				}, 250);
			}, 500);
    }

    function logout(){
			localStorage.clear();
