<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
  <title>เลือกโฟลเดอร์สินค้า - DDCAR</title>
  <!-- Local Assets -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/svg-with-js.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/jquery-confirm.css">
  <link rel="stylesheet" href="css/loading.css">

  <script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
  <script type="text/javascript" src="js/jquery-ui.min.js"></script>
  <script type="text/javascript" src="js/jquery.easing.1.3.min.js"></script>
  <script type="text/javascript" src="js/jquery-confirm.js"></script>
  <script type="text/javascript" src="js/popper.min.js"></script>
  <script type="text/javascript" src="js/bootstrap.min.js"></script>
  <script defer src="js/fontawesome-all.js"></script>
  <script type="text/javascript" src="js/config.js"></script>
  <script type="text/javascript" src="js/capacitor-bridge.js"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css?family=Prompt" rel="stylesheet">

  <style>
    h5 {
      color: #515151;
      letter-spacing: 1px;
    }

    .six{
      color: #94a3b8;
    }

    .checked{
      color: #16a34a;
    }

    .folder-item-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      transition: all 0.15s ease;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .folder-item-card:active {
      background: #f8fafc;
      transform: scale(0.99);
    }
    .admin-action-col {
      display: none;
      gap: 6px;
      margin-right: 10px;
    }
    .action-mini-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-row-del {
      background: #fee2e2;
      color: #dc2626;
    }
    .btn-row-edit {
      background: #e0f2fe;
      color: #0284c7;
    }
    .multi-select-col {
      display: none;
      margin-right: 12px;
      font-size: 20px;
      cursor: pointer;
    }
    .folder-main-tap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
    }
    .nav-bottom-item.active .menu,
    .nav-bottom-item.active svg {
      color: var(--dd-red, #da251c) !important;
      fill: var(--dd-red, #da251c) !important;
      background: var(--dd-red-light, #fee2e2) !important;
    }
  </style>

  <script>
    var parent;
    var index;
    var last_node = 0;
    var from;
    $(document).ready(function() {
      // url = new URL(window.location.href);
      // folder = url.searchParams.get("folder");  
      // from = url.searchParams.get("from");      
      folder = QueryString.folder;
      from = QueryString.from;
      
      if(folder){
        $("#h5-title").text(folder);
        parent = folder;
      }else{        
        parent = "car";
      }
      if(parent == "car"){
        $("#h5-title").text("หมวดหมู่");
      }

      if(localStorage.stack_folder){
        var retrievedObject = localStorage.getItem('stack_folder');
        var arr_data = JSON.parse(retrievedObject);   
      }else{
        var arr_data = [];       
      }
      arr_data.push(parent); 
      localStorage.setItem('stack_folder', JSON.stringify(arr_data));   

      $.ajax({
        type: "POST",
        url:localStorage.pathServer + "php/get_folder.php",
        crossDomain: true,
        data: {'parent' : parent},  
        beforeSend: function(){
          $(".overlay").prop('hidden', false);
        },             
        success: function(data){  
            $(".overlay").prop('hidden', true);            
            if(data == "last node"){
              // case no node 
              if(from == "add"){ 
                var isOwnerOrAdmin = (localStorage.user_role == "แอดมิน" || localStorage.user_role == "เจ้าของร้าน");
                if (isOwnerOrAdmin) {
                  $("#add-ctn").prop('hidden', false);
                  $("#big-ctn").prop('hidden', true);
                  if(parent == "car"){
                    $("#add-prod").prop('hidden', true);
                  }
                }
              }           
            }else{           
              var obj;
              try {
                obj = (typeof data === "object") ? data : jQuery.parseJSON(data);
              } catch(e) {
                console.error("Parse JSON error in select_folder:", e, data);
                obj = null;
              }
              if(!obj || obj.length === 0){
                last_node = 2;
                return;
              }
              var isLastNode = (obj[obj.length-1] === "last node");
              var isOwnerOrAdmin = (localStorage.user_role == "แอดมิน" || localStorage.user_role == "เจ้าของร้าน");
              if(isLastNode){
                obj.pop();
                // case last node have product                    
                  if(from == "add"){
                    if(isOwnerOrAdmin){
                      $("#navs-bttm").prop("hidden", false);
                    }
                  }else{                
                    $("#show-box").prop('hidden',false); 
                    if(from == "stock" || from == "thre"){
                      $("#show-box").prop('hidden',true); 
                    }                                      
                  } 
                  obj.sort(function(a,b) {
                    var codeA = (a && a.prod_code) ? String(a.prod_code) : "";
                    var codeB = (b && b.prod_code) ? String(b.prod_code) : "";
                    return codeA.localeCompare(codeB, undefined, { numeric: true });
                  });			
                  var isEditActive = $("#i-edit").hasClass('active');
                  var isDelActive = $("#i-del").hasClass('active');
                  var canShowAdmin = (from == "add" && isOwnerOrAdmin && (isEditActive || isDelActive));
                  var adminColDisplay = canShowAdmin ? 'flex' : 'none';
                  var multiDisplay = isMultiSelectMode ? 'flex' : 'none';

                  $.each(obj, function(i, field){
                      var codeBadge = field.prod_code ? ('<span class="badge badge-light border mr-2" style="font-size: 12px; font-weight: 700; color: #1e293b;">' + field.prod_code + '</span>') : '';
                      var adminButtons = '';
                      if (from == "add" && isOwnerOrAdmin) {
                        adminButtons = "<div class='admin-action-col' style='display: " + adminColDisplay + ";'>" +
                          "<button class='action-mini-btn btn-row-del' onclick='event.stopPropagation(); remove(" + i + ");' style='display: " + (isDelActive ? "inline-flex" : "none") + ";'><i class='fa fa-trash-alt'></i></button>" +
                          "<button class='action-mini-btn btn-row-edit' onclick='event.stopPropagation(); edit(" + i + ");' style='display: " + (isEditActive ? "inline-flex" : "none") + ";'><i class='fa fa-edit'></i></button>" +
                        "</div>";
                      }
                      text_html = "<div id='row-title-"+i+"' class='folder-item-card' onclick='cardClick(\"" + obj[i].prod_id + "\", " + i + ")'>" +
                        "<span id='span-"+i+"' hidden>" + obj[i].prod_id + "</span>" +
                        "<div class='multi-select-col' style='display: " + multiDisplay + ";' onclick='event.stopPropagation(); check(" + i + ")'>" +
                          "<i id='box-"+i+"' class='far fa-square six box'></i>" +
                        "</div>" +
                        adminButtons +
                        "<div class='folder-main-tap'>" +
                          "<div style='flex: 1; min-width: 0;'>" + codeBadge + "<span id='title-"+i+"' style='font-weight: 600; color: #0f172a; font-size: 14px;'>" + obj[i].prod_name + "</span></div>" +
                          "<div style='color: #cbd5e1; padding-left: 6px;'><i class='fas fa-chevron-right fa-sm'></i></div>" +
                        "</div>" +
                        "</div>";
                      $("#in-ctn").append(text_html);
                      index = i;
                  });
                  last_node = 1;                                                 
              }else{
                // case have folder 
                if(from == "add" && isOwnerOrAdmin){
                  $("#navs-bttm").prop("hidden", false).show();
                }
                obj.sort(function(a, b) {
                  var titleA = (a && a.title) ? String(a.title).trim() : "";
                  var titleB = (b && b.title) ? String(b.title).trim() : "";
                  return titleA.localeCompare(titleB, 'en', { numeric: true, sensitivity: 'base' });
                });                
                var isEditActive = $("#btn-nav-edit").hasClass('active') || $("#i-edit").hasClass('active');
                var isDelActive = $("#btn-nav-del").hasClass('active') || $("#i-del").hasClass('active');
                var canShowAdmin = (from == "add" && isOwnerOrAdmin && (isEditActive || isDelActive));
                var adminColDisplay = canShowAdmin ? 'flex' : 'none';

                $.each(obj, function(i, field){
                  var safeTitle = String(obj[i].title || '').replace(/'/g, "\\'").replace(/"/g, "&quot;");
                  var adminButtons = '';
                  if (from == "add" && isOwnerOrAdmin) {
                    adminButtons = "<div class='admin-action-col' style='display: " + adminColDisplay + ";'>" +
                      "<button class='action-mini-btn btn-row-del' onclick='event.stopPropagation(); remove(" + i + ");' style='display: " + (isDelActive ? "inline-flex" : "none") + ";'><i class='fa fa-trash-alt'></i></button>" +
                      "<button class='action-mini-btn btn-row-edit' onclick='event.stopPropagation(); edit(" + i + ");' style='display: " + (isEditActive ? "inline-flex" : "none") + ";'><i class='fa fa-edit'></i></button>" +
                    "</div>";
                  }
                  text_html = "<div id='row-title-"+i+"' class='folder-item-card' onclick='cardClick(\"" + safeTitle + "\", " + i + ")'>" +
                    "<span id='span-"+i+"' hidden>" + obj[i].title + "</span>" +
                    adminButtons +
                    "<div class='folder-main-tap'>" +
                      "<div style='flex: 1; min-width: 0; display: flex; align-items: center;'><i class='fas fa-folder text-warning fa-lg' style='margin-right: 12px;'></i><span id='title-"+i+"' style='font-weight: 600; color: #0f172a; font-size: 15px;'>" + obj[i].title + "</span></div>" +
                      "<div style='color: #cbd5e1; padding-left: 6px;'><i class='fas fa-chevron-right fa-sm'></i></div>" +
                    "</div>" +
                    "</div>";
                  $("#in-ctn").append(text_html);
                  index = i;
                });               
              }                               
            }                          
        },
        error: function(xhr, status, error) {
          $(".overlay").prop('hidden', true);
          console.error("select_folder error:", status, error);
        }               
      });
        // index = i;
    });   
    
    var QueryString = function () {
      // This function is anonymous, is executed immediately and
      // the return value is assigned to QueryString!
      var query_string = {};
      var query = window.location.search.substring(1);
      var vars = query.split("&");
      for (var i=0;i<vars.length;i++) {
          var pair = vars[i].split("=");
              // If first entry with this name
          if (typeof query_string[pair[0]] === "undefined") {
          query_string[pair[0]] = decodeURIComponent(pair[1]);
              // If second entry with this name
          } else if (typeof query_string[pair[0]] === "string") {
          var arr = [ query_string[pair[0]],decodeURIComponent(pair[1]) ];
          query_string[pair[0]] = arr;
              // If third or later entry with this name
          } else {
          query_string[pair[0]].push(decodeURIComponent(pair[1]));
          }
      } 
      return query_string;
    }();

    var isMultiSelectMode = false;
    function show_box(e){
      if(e) e.stopPropagation();
      isMultiSelectMode = !isMultiSelectMode;
      if (isMultiSelectMode) {
          $(".multi-select-col").css('display', 'flex');
          $("#show-box").addClass('text-danger');
      } else {
          $(".multi-select-col").hide();
          $("#show-box").removeClass('text-danger');
          $("#show-box-go").prop('hidden', true);
      }
    }

    arr_prod = [];
    function check(arg){
      //console.log('row ' + arg + ' checked');
      $("#box-"+arg).removeClass('six'); 
      $("#box-"+arg).removeClass('far'); 
      $("#box-"+arg).addClass('checked'); 
      $("#box-"+arg).addClass('fa');
      $("#box-"+arg).attr('onclick', 'uncheck('+arg+')'); 

      $("#show-box-go").prop('hidden',false);
      $("#show-box").prop('hidden',true);
      var ch = false;
      for(var i = 0 ; i < arr_prod.length ; i++){
          if(arr_prod[i].arg == arg){
            arr_prod[i].prod_id = $('#span-'+arg).text();
            ch = true;
            break;
          }
      }
      if(!ch){          
          item = {};   
          item ["arg"] = arg;        
          item ["prod_id"] = $('#span-'+arg).text();         
          arr_prod.push(item);          
      }     
    }

    function uncheck(arg){
      //console.log('row ' + arg + ' unchecked');
      $("#box-"+arg).removeClass('checked'); 
      $("#box-"+arg).removeClass('fa'); 
      $("#box-"+arg).addClass('six'); 
      $("#box-"+arg).addClass('far'); 
      $("#box-"+arg).attr('onclick', 'check('+arg+')');

      for(var i = 0 ; i < arr_prod.length ; i++){
        if(arr_prod[i].arg == arg){
            arr_prod[i].prod_id = 0;
            break;
        }
      } 

      var ch = 0;
      for(var i=0 ; i <= index;i++){
        if($('#box-'+i).hasClass('six')){
          ch++;
        }
      }
      if(ch-1 == index){
        $("#show-box-go").prop('hidden',true);
        $("#show-box").prop('hidden',false);
      }
    }

    function nextselect(){
      json = [];
      for(var i = 0 ; i < arr_prod.length ; i++){
        if(arr_prod[i].prod_id != 0){
            item = {}
            item["prod_id"] = arr_prod[i].prod_id;           
            json.push(item);               
        }
      }
      if(from == "import"){
          localStorage.setItem('arr_prod_i', JSON.stringify(json)); 
          goto = "import.html";
        }else if(from == "tran_in"){
          localStorage.setItem('arr_prod_t', JSON.stringify(json)); 
          goto = "transfer_in.html";
        }else if(from == "export"){
          localStorage.setItem('arr_prod_e', JSON.stringify(json)); 
          goto = "export.html";
        }else if(from == "sale"){
          localStorage.setItem('arr_prod_s', JSON.stringify(json)); 
          goto = "sale.html";
        } 
      
      window.location = goto;    
    }

    function cardClick(val, i) {
      if ($("#btn-nav-edit").hasClass('active') || $("#i-edit").hasClass('active')) {
        edit(i);
        return;
      }
      if ($("#btn-nav-del").hasClass('active') || $("#i-del").hasClass('active')) {
        remove(i);
        return;
      }
      getIn(val, i);
    }

    function menu(arg) {
      if (arg == "home") {
        window.location = 'index.html';
        return;
      }

      if (arg == "add" || arg == "edit" || arg == "del") {
        var isOwnerOrAdmin = (localStorage.user_role == "แอดมิน" || localStorage.user_role == "เจ้าของร้าน");
        if (!isOwnerOrAdmin) {
          $.confirm({
            title: 'แจ้งเตือน',
            content: 'เฉพาะแอดมินและเจ้าของร้านเท่านั้นที่สามารถเพิ่ม แก้ไข หรือลบรายการได้',
            backgroundDismiss: true,
            buttons: {
              ตกลง: function() {}
            }
          });
          return;
        }
      }

      if (arg == "add") {
        $("#btn-nav-edit, #btn-nav-del, #i-edit, #i-del").removeClass('active');
        $(".admin-action-col").hide();
        $(".btn-row-del").hide();
        $(".btn-row-edit").hide();

        if (last_node == 1) {
          add_prod();
          return;
        }

        $("style").append(".jconfirm .jconfirm-box{margin-bottom:70%;}");
        $.confirm({
          title: "เพิ่มหมวดหมู่",
          content: '<div class="row" style="margin-top: 2%; margin-bottom: 2%;"><div class="col-1"></div><div class="col-10"><input id="edt-name" type="text" class="input-cf" autofocus style="text-transform: uppercase;"></div><div class="col-1"></div></div>',
          backgroundDismiss: true,
          buttons: {
            ยกเลิก: function () {},
            formSubmit: {
              text: 'ตกลง',
              btnClass: 'btn-danger',
              action: function () {
                var newname = $("#edt-name").val().toUpperCase();
                add(newname);                   
              }
            }
          }
        });
      } else if (arg == "edit") {
        var isCurrentlyActive = $("#btn-nav-edit").hasClass('active') || $("#i-edit").hasClass('active');
        $("#btn-nav-edit, #btn-nav-del, #i-edit, #i-del").removeClass('active');

        if (!isCurrentlyActive) {
          $("#btn-nav-edit, #i-edit").addClass('active');
          $(".admin-action-col").css('display', 'flex');
          $(".btn-row-del").hide();
          $(".btn-row-edit").css('display', 'inline-flex');
        } else {
          $(".admin-action-col").hide();
          $(".btn-row-edit").hide();
          $(".btn-row-del").hide();
        }
      } else if (arg == "del") {
        var isCurrentlyActive = $("#btn-nav-del").hasClass('active') || $("#i-del").hasClass('active');
        $("#btn-nav-edit, #btn-nav-del, #i-edit, #i-del").removeClass('active');

        if (!isCurrentlyActive) {
          $("#btn-nav-del, #i-del").addClass('active');
          $(".admin-action-col").css('display', 'flex');
          $(".btn-row-edit").hide();
          $(".btn-row-del").css('display', 'inline-flex');
        } else {
          $(".admin-action-col").hide();
          $(".btn-row-del").hide();
          $(".btn-row-edit").hide();
        }
      }
    }

    function getIn(arg, arg2){
      if(last_node == 0){
        goto = "select_folder.html?from="+ encodeURIComponent(from || "") + "&folder=" + encodeURIComponent(arg);
      }else if(last_node == 1){ 
        if(isMultiSelectMode){
          if($("#box-"+arg2).hasClass('six')) check(arg2);
          else if($("#box-"+arg2).hasClass('checked')) uncheck(arg2);
          return;         
        }else if(from == "import"){
          goto = "import.html?product="+ encodeURIComponent(arg);
        }else if(from == "tran_in"){
          goto = "transfer_in.html?product="+ encodeURIComponent(arg);
        }else if(from == "export"){
          goto = "export.html?product="+ encodeURIComponent(arg);
        }else if(from == "sale"){
          goto = "sale.html?product="+ encodeURIComponent(arg);
        }else if(from == "stock"){
          goto = "stock.html?product="+ encodeURIComponent(arg);
        }else if(from == "thre"){
          goto = "set_threshold.html?product="+ encodeURIComponent(arg);
        }else if(from == "add"){
          try {
            var retrievedObject = localStorage.getItem('stack_folder');
            var arr_data = JSON.parse(retrievedObject || '[]');      
            if (arr_data.length > 0) arr_data.splice(arr_data.length-1,1);
            localStorage.setItem('stack_folder', JSON.stringify(arr_data));
          } catch(e) {}
          goto = "show_prod.html?prod_id="+ encodeURIComponent(arg) +"&folder="+ encodeURIComponent(parent || '');        
        } else {
          goto = "stock.html?product=" + encodeURIComponent(arg);
        }
      }     
      
      if (goto) {
        window.location = goto;
      }
    }

    function add(arg){
      var isEditActive = $("#btn-nav-edit").hasClass('active') || $("#i-edit").hasClass('active');
      var isDelActive = $("#btn-nav-del").hasClass('active') || $("#i-del").hasClass('active');
      var adminColDisplay = (isEditActive || isDelActive) ? 'flex' : 'none';

      // First State
      if(!$("#big-ctn").is(":visible")){
        input = $("#first-add").val().toUpperCase();
        if(input != ""){
          $.ajax({
            type: "POST",
            url: localStorage.pathServer + "php/add_folder.php",
            data: {
              'title': input,
              'parent': parent
            },
            beforeSend: function(){
              $(".overlay").prop('hidden', false);
            },             
            success: function(data){  
              $(".overlay").prop('hidden', true);
              if (data == "success") {
                index++;
                var safeInput = String(input).replace(/'/g, "\\'").replace(/"/g, "&quot;");
                text_html = "<div id='row-title-"+index+"' class='folder-item-card' onclick='cardClick(\"" + safeInput + "\", " + index + ")'>" +
                  "<span id='span-"+index+"' hidden>" + input + "</span>" +
                  "<div class='admin-action-col' style='display: " + adminColDisplay + ";'>" +
                    "<button class='action-mini-btn btn-row-del' onclick='event.stopPropagation(); remove(" + index + ");' style='display: " + (isDelActive ? "inline-flex" : "none") + ";'><i class='fa fa-trash-alt'></i></button>" +
                    "<button class='action-mini-btn btn-row-edit' onclick='event.stopPropagation(); edit(" + index + ");' style='display: " + (isEditActive ? "inline-flex" : "none") + ";'><i class='fa fa-edit'></i></button>" +
                  "</div>" +
                  "<div class='folder-main-tap'>" +
                    "<div style='flex: 1; min-width: 0; display: flex; align-items: center;'><i class='fas fa-folder text-warning fa-lg' style='margin-right: 12px;'></i><span id='title-"+index+"' style='font-weight: 600; color: #0f172a; font-size: 15px;'>" + input + "</span></div>" +
                    "<div style='color: #cbd5e1; padding-left: 6px;'><i class='fas fa-chevron-right fa-sm'></i></div>" +
                  "</div>" +
                  "</div>";

                $("#big-ctn").prop('hidden', false);
                $("#add-ctn").prop('hidden', true);
                $("#navs-bttm").prop("hidden", false).show();
                $("#in-ctn").append(text_html);
              } else {
                $.confirm({
                  title: 'พบข้อผิดพลาด',
                  content: 'ลองอีกครั้ง',
                  backgroundDismiss: true,
                  buttons: {
                    formSubmit: {
                      text: 'ตกลง',
                      btnClass: 'btn-regis',
                      action: function () {
                      }
                    }
                  }
                });
              }
            }
          });
        }else{
          $.confirm({
            title: 'พบข้อผิดพลาด',
            content: 'กรอกหมวดหมู่ก่อนเพิ่ม',
            backgroundDismiss: true,
            buttons: {
              formSubmit: {
                text: 'ตกลง',
                btnClass: 'btn-regis',
                action: function () {
                }
              }
            }
          });         
        }
      }else{
        input = arg;
        if(input != "") {
          $.ajax({
            type: "POST",
            url: localStorage.pathServer + "php/add_folder.php",
            data: {
              'title': input,
              'parent': parent
            },
            success: function (data) {
              if(data == "success"){
                index++;
                var safeInput = String(input).replace(/'/g, "\\'").replace(/"/g, "&quot;");
                text_html = "<div id='row-title-"+index+"' class='folder-item-card' onclick='cardClick(\"" + safeInput + "\", " + index + ")'>" +
                  "<span id='span-"+index+"' hidden>" + input + "</span>" +
                  "<div class='admin-action-col' style='display: " + adminColDisplay + ";'>" +
                    "<button class='action-mini-btn btn-row-del' onclick='event.stopPropagation(); remove(" + index + ");' style='display: " + (isDelActive ? "inline-flex" : "none") + ";'><i class='fa fa-trash-alt'></i></button>" +

    function edit(arg){
      if(last_node == 0){
        name = $("#title-"+arg).text();
        $("style").append(".jconfirm .jconfirm-box{margin-bottom:70%;}");
        $.confirm({
          title: "แก้ไข",
          content: '<div class="row" style="margin-top: 2%; margin-bottom: 2%;"><div class="col-1"></div><div class="col-10"><input id="edt-name" type="text" class="input-cf" autofocus placeholder="'+name+'" style="text-transform: uppercase"></div><div class="col-1"></div></div>',
          backgroundDismiss: true,
          buttons: {
            ยกเลิก: function () {
                //$(".jconfirm .jconfirm-box").css('margin-bottom', '5%');
              },
            formSubmit: {
              text: 'ตกลง',
              btnClass: 'btn-danger',
              action: function () {
                newname = $("#edt-name").val().toUpperCase();;
                rename(arg, newname);                   
              }
            }
          }
        }); 
      }else if(last_node == 1){
        var retrievedObject = localStorage.getItem('stack_folder');
        var arr_data = JSON.parse(retrievedObject);      
        arr_data.splice(arr_data.length-1,1);
        localStorage.setItem('stack_folder', JSON.stringify(arr_data));  
        prod_id = $("#span-"+arg).text();
        goto = "edit_prod.html?prod_id="+prod_id+"&folder="+parent;         
        
        window.location = goto;
      }      
    }

    function rename(arg, name){
      old_name = $("#title-"+arg).text();

      // input hidden false
      // h5 hidden true
      $.ajax({
        type: "POST",
        url:localStorage.pathServer + "php/rename_folder.php",           
        data: {'old_name' : old_name,
               'name' : name},               
        beforeSend: function(){
          $(".overlay").prop('hidden', false);
        },             
        success: function(data){ 
            if(data == "success"){
              $(".overlay").prop('hidden', true);                             
              $("#title-" + arg).text(name); 
              $("#span-" + arg).text(name);
              var safeNewName = String(name).replace(/'/g, "\\'").replace(/"/g, "&quot;");
              $("#row-title-" + arg).attr("onclick", "cardClick(\"" + safeNewName + "\", " + arg + ")");
            }else{
              $.confirm({
                title: 'พบข้อผิดพลาด',
                content: 'ลองอีกครั้ง',
                backgroundDismiss: true,
                buttons: {
                  formSubmit: {
                    text: 'ตกลง',
                    btnClass: 'btn-regis',
                    action: function () {
                    }
                  }
                }
              });
            }             
            //$("#row-title-" + arg).prop('hidden', false);
            //$("#row-edit-" + arg).prop('hidden', true);          
        }               
      });
    }

    function remove(arg){
      var title = $("#title-" + arg).text();
      if(last_node == 0){        
        $("style").append('.jconfirm .jconfirm-box{margin-bottom: 5%;}');
        $.confirm({
          title: 'ลบรายการ',
          content: 'ต้องการลบ '+title+' หรือไม่',
          backgroundDismiss: true,
          buttons: { 
            formSubmit: {
              text: 'ตกลง',
              btnClass: 'btn-danger',
              action: function () {
                $.ajax({
                  type: "POST",
                  url:localStorage.pathServer + "php/delete_folder.php",           
                  data: {'title' : title},               
                  beforeSend: function(){
                      $(".overlay").prop('hidden', false);
                  },             
                  success: function(data){  
                    $(".overlay").prop('hidden', true);                             
                    if(data == "success"){
                      $("#hr-"+arg).remove();
                      $("#row-title-" + arg).remove();
                      //$("#row-edit-" + arg).remove();
                      if($("#in-ctn").children().length == 0){
                        // no child
                        $("#add-ctn").prop('hidden', false);
                        $("#big-ctn").prop('hidden', true);
                        $("#navs-bttm").prop("hidden", true);
                        if(parent == "car"){
                          $("#add-prod").prop('hidden', true);
                        } 
                        disac('del');
                      }           
                    }else{
                      $.confirm({
                        title: 'พบข้อผิดพลาด',
                        content: 'ลองอีกครั้ง',
                        backgroundDismiss: true,
                        buttons: {
                          formSubmit: {
                            text: 'ตกลง',
                            btnClass: 'btn-regis',
                            action: function () {
                            }
                          }
                        }
                      });
                    }                               
                  }               
                });
              }
            },ยกเลิก: function () {}
          }  
        });
      }else if(last_node == 1){
        var prod_id = $("#span-" + arg).text();        
        $("style").append('.jconfirm .jconfirm-box{margin-bottom: 5%;}');
        $.confirm({
          title: 'ลบรายการ',
          content: 'ต้องการลบ '+title+' หรือไม่',
          backgroundDismiss: true,
          buttons: {  
            formSubmit: {
              text: 'ตกลง',
              btnClass: 'btn-danger',
              action: function () {
                $.ajax({
                  type: "POST",
                  url:localStorage.pathServer + "php/delete_prod.php",           
                  data: {'title' : prod_id},               
                  beforeSend: function(){
                      $(".overlay").prop('hidden', false);
                  },             
                  success: function(data){  
                    $(".overlay").prop('hidden', true);                             
                    if(data == "success"){
                      $("#hr-"+arg).remove();
                      $("#row-title-" + arg).remove();
                      //$("#row-edit-" + arg).remove();
                      if($("#in-ctn").children().length == 0){
                        // no child
                        $("#add-ctn").prop('hidden', false);
                        $("#big-ctn").prop('hidden', true);
                        $("#navs-bttm").prop("hidden", true);
                        disac('del');
                      }           
                    }else{
                      $.confirm({
                        title: 'พบข้อผิดพลาด',
                        content: 'ลองอีกครั้ง',
                        backgroundDismiss: true,
                        buttons: {
                          formSubmit: {
                            text: 'ตกลง',
                            btnClass: 'btn-regis',
                            action: function () {
                            }
                          }
                        }
                      });
                    }           
                  }               
                });
              }
            },ยกเลิก: function () {}
          }  
        });
      }      
    }

    function add_prod(){  
      var retrievedObject = localStorage.getItem('stack_folder');
      var arr_data = JSON.parse(retrievedObject);      
      arr_data.splice(arr_data.length-1,1);
      localStorage.setItem('stack_folder', JSON.stringify(arr_data));  
      goto = "add_prod.html?folder="+ encodeURIComponent(parent);         
      
      window.location = goto;
    }

    function page_back(){
      if(parent == "car"){
        localStorage.stack_folder = "";
        var goto = "index.html";
        if(from == "add"){
          goto = "index.html";
        }else if(from == "import"){
          goto = "import.html";
        }else if(from == "tran_in"){
          goto = "transfer_in.html";
        }else if(from == "export"){
          goto = "export.html";
        }else if(from == "sale"){
          goto = "sale.html";
        }else if(from == "stock"){
          goto = "stock.html";
        }else if(from == "thre"){
          goto = "set_threshold.html";
        }
        window.location = goto;
        return;
      }
      try {
        var retrievedObject = localStorage.getItem('stack_folder');
        var arr_data = JSON.parse(retrievedObject || '[]');   
        if (arr_data && arr_data.length >= 2) {
          var data = arr_data[arr_data.length - 2];
          arr_data.splice(arr_data.length - 2, 2);
          localStorage.setItem('stack_folder', JSON.stringify(arr_data));  
          window.location = "select_folder.html?from=" + encodeURIComponent(from || "") + "&folder=" + encodeURIComponent(data);
          return;
        }
      } catch(e) {}
      localStorage.stack_folder = "";
      window.location = (from == "add") ? "index.html" : ("select_folder.html?from=" + encodeURIComponent(from || ""));
    }   
  </script>
