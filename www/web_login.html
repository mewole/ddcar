<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>เข้าสู่ระบบ - DD MOTOR SPORT</title>
    
    <!-- Bootstrap Import -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.6/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.1.1/css/all.css" crossorigin="anonymous">

    <!-- Super cool dialog-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.0/jquery-confirm.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.0/jquery-confirm.min.js"></script>
    
    <!-- Loading -->
    <link rel="stylesheet" href="css/easy-loading.css">
    <script src="js/easy-loading.js"></script>
   
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css?family=Prompt:300,400,500,600,700" rel="stylesheet">
    <!-- Main -->
    <link href="css/untitled.css" rel="stylesheet">
    <script type="text/javascript" src="js/config.js"></script>

    <style>
        body {
            background-color: var(--bg-page) !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 12px;
        }
        .login-card {
            background: #ffffff;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 440px;
            padding: 36px 30px;
            text-align: center;
        }
        .login-logo {
            max-height: 90px;
            max-width: 180px;
            object-fit: contain;
            margin-bottom: 16px;
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-black);
            margin-bottom: 4px;
        }
        .login-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        .form-group-custom {
            text-align: left;
            margin-bottom: 18px;
        }
        .form-label-custom {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
            display: block;
        }
        .form-input-custom {
            width: 100% !important;
            height: 48px;
            font-size: 1rem;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            background: #ffffff;
            color: var(--text-primary);
            transition: all 0.15s ease;
        }
        .form-input-custom:focus {
            border-color: var(--color-dark);
            box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.12);
            outline: none;
        }
        .btn-login {
            width: 100%;
            height: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            background-color: var(--color-dark) !important;
            border-color: var(--color-dark) !important;
            color: #ffffff !important;
            border-radius: var(--radius-sm);
            margin-top: 10px;
            transition: all 0.15s ease;
        }
        .btn-login:hover {
            background-color: var(--color-dark-hover) !important;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .login-footer {
            margin-top: 24px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img id="id_img" class="login-logo" alt="DD MOTOR SPORT">
        <h2 class="login-title">เข้าสู่ระบบ</h2>
        <div class="login-subtitle">ระบบบริหารจัดการ DD MOTOR SPORT</div>

        <div class="form-group-custom">
            <label class="form-label-custom" for="name"><i class="fa fa-user mr-1 text-muted"></i> ชื่อผู้ใช้</label>
            <input id="name" type="text" class="form-input-custom" placeholder="กรอกชื่อผู้ใช้..." autofocus data-index="1">
        </div>

        <div class="form-group-custom">
            <label class="form-label-custom" for="password"><i class="fa fa-lock mr-1 text-muted"></i> รหัสผ่าน</label>
            <input id="password" type="password" class="form-input-custom" placeholder="กรอกรหัสผ่าน..." data-index="2">
        </div>

        <button class="btn btn-login" onclick="login()"><i class="fa fa-sign-in-alt mr-2"></i> เข้าสู่ระบบ</button>

        <div class="login-footer">
            DD MOTOR SPORT © 2018–2026 | All Rights Reserved
        </div>
    </div>

    <script>
        $(document).ready(function () {      
            getConfig();
            $('#id_img').attr('src', imgPath);
        });

        $(document).keydown(function(objEvent) {
            if (objEvent.keyCode == 13) {  // enter pressed
                objEvent.preventDefault();           
                var $this = $(objEvent.target);
                var i_enter = parseFloat($this.attr('data-index'));                      
                if(i_enter == 2){
                    login();
                }else{
                    $('[data-index="' + (i_enter+1).toString() + '"]').focus();
                }              
            }         
        });

        function login(){
            var name = $('#name').val();
            var pass = $('#password').val();
            if(name && pass){
                $.ajax({
                    type: "POST",
                    url: "php/login.php",
                    data: {'name': name, 'pass': pass},    
                    beforeSend: function(){
                        EasyLoading.show({ text: "กำลังเข้าสู่ระบบ..." });
                    },                         
                    success: function(data){
                        EasyLoading.hide();
                        if(data == "fail"){
                            $.confirm({
                                title: 'เข้าสู่ระบบไม่สำเร็จ',
                                content: 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง',
                                backgroundDismiss: true,
                                buttons: {
                                    formSubmit: {
                                        text: 'ตกลง',
                                        btnClass: 'btn-danger',
                                        action: function () {}
                                    }
                                }
                            });
                        } else if(typeof data === 'string' && data.startsWith('locked:')){
                            var mins = data.split(':')[1] || '15';
                            $.confirm({
                                title: 'ระงับการเข้าสู่ระบบชั่วคราว',
                                content: 'คุณกรอกรหัสผ่านผิดเกิน 5 ครั้ง เพื่อความปลอดภัยระบบได้ระงับการเข้าสู่ระบบไว้ชั่วคราว กรุณารออีกประมาณ <b>' + mins + ' นาที</b> แล้วลองใหม่อีกครั้ง',
                                type: 'orange',
                                backgroundDismiss: true,
                                buttons: {
                                    formSubmit: {
                                        text: 'ตกลง',
                                        btnClass: 'btn-warning',
                                        action: function () {}
                                    }
                                }
                            });
                        } else {
                            var obj = (typeof data === 'object') ? data : (typeof data === 'string' ? JSON.parse(data) : data);
                            $.each(obj, function(i, field){
                                localStorage.user_name = field.user_name || name;
                                localStorage.user_id = field.user_id;
                                localStorage.user_role = field.user_role;
                                window.location = 'web_sale.html';
                            });                      
                        }
                    },
                    error: function () {
                        EasyLoading.hide();
                        alert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
                    }
                });  
            } else {
                alert('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
            }            
        }
    </script>
</body>
</html>
