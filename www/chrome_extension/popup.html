<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>DDCar Sync Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .header h2 {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-safe {
      background-color: #dcfce7;
      color: #15803d;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 12px;
      border: 1px solid #bbf7d0;
    }
    .platform-indicator {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      font-size: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      color: #0f172a;
      outline: none;
      transition: border-color 0.15s ease;
    }
    select:focus, input[type="text"]:focus {
      border-color: #3b82f6;
    }
    .schedule-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: #1e40af;
      margin-bottom: 12px;
    }
    .schedule-box div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }
    .schedule-box div:last-child {
      margin-bottom: 0;
    }
    .btn-sync {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: background 0.15s ease;
    }
    .btn-sync:hover {
      background: #1d4ed8;
    }
    .btn-sync:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .btn-goto {
      width: 100%;
      background: #fffbeb;
      color: #b45309;
      border: 1px solid #fde68a;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      text-align: center;
      display: none;
      transition: background 0.15s;
    }
    .btn-goto:hover {
      background: #fef3c7;
    }
    .btn-link {
      width: 100%;
      background: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-top: 8px;
      text-decoration: none;
      display: block;
    }
    .btn-link:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .status-msg {
      margin-top: 8px;
      font-size: 11px;
      text-align: center;
      line-height: 1.4;
      padding: 6px 8px;
      border-radius: 6px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
    }
    .footer-note {
      margin-top: 10px;
      font-size: 10px;
      color: #94a3b8;
      text-align: center;
      border-top: 1px solid #f1f5f9;
      padding-top: 8px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>🚗 DDCar Sync</h2>
    <span class="badge-safe">🛡️ 0% Ban Risk</span>
  </div>

  <div class="platform-indicator" id="platform-indicator">
    <span>แท็บปัจจุบัน:</span>
    <strong id="active-platform-name" style="color: #475569;">กำลังตรวจสอบ...</strong>
  </div>

  <div class="form-group">
    <label for="sel-channel">🏢 บัญชีร้านค้า:</label>
    <select id="sel-channel">
      <option value="shopee_kingkong">🟠 Shopee (KingKong)</option>
      <option value="shopee_taengraberd">🔴 Shopee (แต่งระเบิด)</option>
      <option value="lazada_main">🔵 Lazada Main</option>
      <option value="tiktok_main">⚫ TikTok Shop</option>
    </select>
  </div>

  <div class="form-group">
    <label for="txt-server">🌐 ที่อยู่เซิร์ฟเวอร์ DDCar:</label>
    <input type="text" id="txt-server" value="http://100.77.57.16:8083/dd-shop/">
  </div>

  <div class="schedule-box">
    <div><strong>⏰ รอบเช้า:</strong> <span>เปิดคอม & ร้านค้า</span></div>
    <div><strong>⏰ รอบเย็น:</strong> <strong style="color: #b91c1c;">17:00 น. (ก่อนปิดร้าน)</strong></div>
  </div>

  <button id="btn-sync-now" class="btn-sync">
    🔄 ซิงค์ออเดอร์เดี๋ยวนี้
  </button>

  <button id="btn-sync-catalog" class="btn-sync" style="background: #0284c7; margin-top: 6px;">
    📦 ซิงค์แคตตาล็อกสินค้า (รูป + ลิงก์ตรง + ชื่อเต็ม)
  </button>

  <button id="btn-goto-orders" class="btn-goto">
    👉 คลิกเพื่อเปิดหน้า "จัดการคำสั่งซื้อ" ทันที
  </button>

  <div id="status-text" class="status-msg">พร้อมทำงาน</div>

  <a id="btn-open-ddcar" href="http://100.77.57.16:8083/dd-shop/web_platform_mapping.html" target="_blank" class="btn-link">
    📊 เปิดหน้าตรวจกระทบยอดใน DDCar ↗
  </a>

  <div class="footer-note">
    รองรับ Shopee, Lazada และ TikTok Shop ในตัวเดียว
  </div>

  <script src="popup.js"></script>
</body>
</html>
