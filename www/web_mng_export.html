  <script>
    var start = start_s = 0;
    var bool = bool_s = false;
    $(document).ready(function(){
      if(!localStorage.user_id){
				window.location = 'web_login.html';
			}
      get_export();     
         
      window.addEventListener('scroll', () => { 
        // Calculate the scroll position 
        const scrollPosition = window.scrollY + window.innerHeight; 
        const documentHeight = document.documentElement.scrollHeight; 
    
        // Check if the user has scrolled to the bottom 
        if (scrollPosition >= documentHeight - 1) { 
          if(!$("#myUL").prop('hidden')){              
              if(bool){
                return 0;
              }
              get_export();           
            }else if(!$("#myS").prop('hidden')){
              if(bool_s){
                return 0;
              }
              get_export_s();
            }
        } 
      });
    });
    
    $(document).keydown(function(objEvent) {
      if (objEvent.keyCode == 13) {  //enter pressed
        objEvent.preventDefault();           
        search();        
      }         
    })
   
    var tempdate,no = 1
    function get_export(){
      $.ajax({
        type: "POST",
        url:"php/get_export.php",
        data: {'start': start},       
        beforeSend: function(){
          EasyLoading.show({                           
						text: "กำลังโหลด"
					});
        },                       
        success: function(data){ 
          EasyLoading.hide();
          var obj = jQuery.parseJSON(data);
          if(obj[0] == "last"){
            bool = true
          }                        
          $.each(obj, function(i, field){
            if(i > 0){
              var txt = field.date_time.split(" ");
              var txt2 = txt[0].split("-");
              var date = txt2[2] + "/" + txt2[1] + "/" + txt2[0].substr(2);
              if(tempdate != date){
                  tempdate = date
                  no = 1
              }
              $('#myUL').append('<li id="ipt-'+field.stock_out_id+'">' +
              '<div class="row justify-content-center ipt-even" data-toggle="collapse" href="#detail-'+field.stock_out_id+'" role="button" aria-expanded="false" aria-controls="detail-'+field.stock_out_id+'" onclick="appendCollapse('+field.stock_out_id+');">'+
                  '<div class="col-2 text-center"><h5>'+no+'</h5></div>' +  
                  '<div class="col-4 text-center"><h5>'+field.stock_out_number+'</h5></div>' +
                  '<div class="col-3 text-center"><h5>'+date+'</h5></div>' +
                  '<div class="col-3 text-center"><h5>'+field.ware_name+'</h5></div>' +
              '</div>' +
            '</li>');
            no++   
            }                                               
          });                                          
        }               
      });
      start += 30;
    }   

    var val;
    function search(){
      if($('#input-search').val() == ""){
        return 0;
      }     
      val = $('#input-search').val()
      start_s = 0;
      bool_s = false;
      $("#myS").prop('hidden', false);
      $("#myUL").prop('hidden', true);     
      $("#myS").empty();
      tempdate = ""
      no = 1
      get_export_s();
    }

    function get_export_s(){
      $.ajax({
        type: "POST",
        url:"php/get_export.php",
        data: {'start': start_s, 'value' : val},
        beforeSend: function(){
          EasyLoading.show({                           
						text: "กำลังโหลด"
					});
        },                       
        success: function(data){ 
          EasyLoading.hide();
          var obj = jQuery.parseJSON(data);
          if(obj[0] == "last"){
            bool_s = true
          }                        
          $.each(obj, function(i, field){
            if(i > 0){
              var txt = field.date_time.split(" ");
              var txt2 = txt[0].split("-");
              var date = txt2[2] + "/" + txt2[1] + "/" + txt2[0].substr(2);
              if(tempdate != date){
                  tempdate = date
                  no = 1
              }
              $('#myS').append('<li id="ipts-'+field.stock_out_id+'">' +
              '<div class="row justify-content-center ipt-even" data-toggle="collapse" href="#details-'+field.stock_out_id+'" role="button" aria-expanded="false" aria-controls="details-'+field.stock_out_id+'" onclick="appendCollapses('+field.stock_out_id+');">'+
                  '<div class="col-2 text-center"><h5>'+no+'</h5></div>' +  
                  '<div class="col-4 text-center"><h5>'+field.stock_out_number+'</h5></div>' +
                  '<div class="col-3 text-center"><h5>'+date+'</h5></div>' +
                  '<div class="col-3 text-center"><h5>'+field.ware_name+'</h5></div>' +
              '</div>' +
            '</li>');
            no++
            }                                                
          });                                         
        }               
      });
      start_s += 30;
    }
    
    function delete_bill(exp_id,ware_id){
      $.confirm({
        title: 'ลบรายการ',
        content: 'ต้องการลบรายการนี้หรือไม่?',
        backgroundDismiss: true,
        buttons: { 
          formSubmit: {
            text: 'ตกลง',
            btnClass: 'btn-danger',
            action: function () {
              // delete bill
              $.ajax({
                type: "POST",
                url:"php/delete_export.php",         
                data:{'exp_id' : exp_id,'ware_id' : ware_id},
                beforeSend: function(){
                  EasyLoading.show({                           
                    text: "กำลังโหลด"
                  });
                },                       
                success: function(data){ 
                  EasyLoading.hide();
                  if(data == "success"){                    
                    $('#ipt-'+exp_id).remove()
                    $('#ipts-'+exp_id).remove()
                  }else{
                    $.confirm({
                      title: 'พบข้อผิดพลาด',
                      content: 'ลองอีกครั้ง',
                      backgroundDismiss: true,
                      buttons: {
                        formSubmit: {
                        text: 'ตกลง',
                        btnClass: 'btn-regis',
                        action: function () {
                        }
                        }
                      }
                    });
                  }                         
                }               
              });      
            }
          },ยกเลิก: function () {}, 
        }  
      });
    }

    var dt,username,warename,stock_num
    function appendCollapse(index){
        if($("#detail-"+index).length){
            //
        }else{    
          arr_data = [];
          var text = ""
          $.ajax({
            type: "POST",
            url:"php/get_export_info.php",    
            data:{'exp_id' : index},
            async:false,                          
            beforeSend: function(){
              EasyLoading.show({                           
                text: "กำลังโหลด"
              });
            },             
            success: function(data){  
              EasyLoading.hide();
              var obj = jQuery.parseJSON(data); 
              text = text + '<div class="collapse" id="detail-'+index+'">'+
                '<div class="card card-body">'+
                  '<div class="row justify-content-center">'+
                      '<h3 style="text-decoration: underline;">รายการ</h3>'+
                  '</div>'             
              $.each(obj, function(i, field){
                var canViewCost = (localStorage.user_role === "แอดมิน" || localStorage.user_role === "เจ้าของร้าน");
                var cost = canViewCost ? field.stock_out_cost : "-";
                var itemTotalCost = canViewCost ? (field.amount * field.stock_out_cost) : "-"; 
                text = text + '<div id="item-'+field.item_id+'" class="row justify-content-center">'+
                  '<div class="col-1 text-center items">'+(i+1)+'</div>'+
                  '<div class="col-1 text-center items">'+field.amount+'</div>'+
                  '<div class="col-6 text-center items"><span class="hover-prod-preview" data-prod-id="'+field.prod_id+'" data-prod-code="'+(field.prod_code||'')+'">'+field.prod_name+'</span></div>'+
                  '<div class="col-2 text-center items">'+cost+'</div>'+
                  '<div class="col-2 text-center items">'+itemTotalCost+'</div>'+
                '</div>'

                item = {}
                item ["prod_id"] =  field.prod_id
                item ["qr"] =  field.prod_code
                item ["name"] =  field.prod_name
                item ["amt"] =  field.amount
                item ["cost"] =  field.stock_out_cost
                stock_num = field.stock_out_number
                dt = field.date_time
                username = field.user_name
                warename = field.ware_name
                arr_data.push(item);
              });
              text = text + '<hr style="width: 50%; margin: auto; margin-top: 1em;">'+
                  '<div class="row" style="margin-top: 1em;">'+
                    '<div class="col-4 text-right"><h4>ผู้ทำรายการ</h4></div>'+
                      '<div class="col-4 text-right"><h4>'+obj[0].user_name+'</h4></div>'+ 
                  '</div>'+
                  '<div class="row justify-content-center" style="margin-top: 1em;">'+
                  '<div class="col-4 text-right">'+                   
                    '<button onclick="print.apply(this,arr_data)" class="btn btn-lg btn-warning" style="color: white;">พิมพ์รายการ  <i class="fas fa-print"></i></button>'+
                  '</div>'+
                  (canViewCost ? '<div class="col-4 text-left"><button class="btn btn-lg btn-danger" style="color: white;" onclick="delete_bill('+index+','+obj[0].ware_id+')">ลบรายการ <i class="fas fa-trash"></i></button></div>' : '')+        
                '</div>'+  
                  '</div>'+
                '</div>';                   
            }               
          });

          $("#ipt-"+index).append(text);
        }
        $('html, body').animate({
              scrollTop: $("#ipt-"+index).offset().top
          }, 1100);
    }
