<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Home</title>
    <!-- Local Assets -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/svg-with-js.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/jquery-confirm.css">
    <link rel="stylesheet" href="css/loading.css">

    <script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
    <script type="text/javascript" src="js/jquery-ui.min.js"></script>
    <script type="text/javascript" src="js/jquery.easing.1.3.min.js"></script>
    <script type="text/javascript" src="js/jquery-confirm.js"></script>
    <script type="text/javascript" src="js/popper.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.min.js"></script>    
    <script defer src="js/fontawesome-all.js"></script>
    <script type="text/javascript" src="js/config.js"></script>
    <script type="text/javascript" src="js/capacitor-bridge.js"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css?family=Prompt" rel="stylesheet">

  <style>
    #title {
      color: #666666;
      letter-spacing: 1px;
      font-weight: bold;
    }
  </style>

  <script>
    $(document).keydown(function(objEvent) {
      if (objEvent.keyCode == 13) {  //enter pressed
        objEvent.preventDefault();
        var $this = $(objEvent.target);
        var i_enter = parseFloat($this.attr('data-index'));                      
        if(i_enter == 3){
          $this.blur();
        }else{          
          $('[data-index="' + (i_enter+1).toString() + '"]').focus();
        }                       
      }         
    })

    function add_cus(){
      var name = $('#name').val();  
      var phone = $('#phone').val();  
      var addr = $('#addr').val();          
      var type = $('#type').val();          

      if(name == "" || type == ""){ 
        $.confirm({
          title: 'พบข้อผิดพลาด',
          content: 'กรุณากรอกข้อมูลให้ครบ',
          backgroundDismiss: true,
          buttons: {
            formSubmit: {
              text: 'ตกลง',
              btnClass: 'btn-regis',
              action: function () {
              }
            }
          }
        }); 
        return 0;
      }
      $.ajax({
          type: "POST",
          url:localStorage.pathServer + "php/add_cus.php",           
          data: {'cus_name':name,
              'phone':phone,
              'addr':addr,
              'type' : type},               
          beforeSend: function(){
              $(".overlay").prop('hidden', false);
          },     
          success: function(data){    
            $(".overlay").prop('hidden', true);         
            if(data == "success"){                        
              $.confirm({
                    title: 'เสร็จสิ้น',
                    content: 'เพิ่มลูกค้า '+name+' เสร็จสิ้น',
                    backgroundDismiss: true,
                    buttons: {
                      formSubmit: {
                        text: 'ตกลง',
                        btnClass: 'btn-regis',
                        action: function () { 
                          clear();
                        }
                      }
                    }
                });
                clear();
            }else{
              $.confirm({
                title: 'พบข้อผิดพลาด',
                content: 'ลองอีกครั้ง',
                backgroundDismiss: true,
                buttons: {
                  formSubmit: {
                    text: 'ตกลง',
                    btnClass: 'btn-regis',
                    action: function () {
                    }
                  }
                }
              });
            }
          }               
      });    
    }

    function setrole(arg){
      $("#type").val(arg);
    }

    function clear(){
      $('#name').val("");  
      $('#phone').val("");  
      $('#addr').val("");          
      $('#type').val("");        
    }

  </script>
</head>

<body>
  <!-- Loading -->
  <div class="overlay" hidden><div class="loading"></div></div> 

  <div id="big-ctn" class="container-fullwidth justify-content-center">
    <!-- Nav menu top -->
    <div class="row navs align-items-center mgem1o5 fixed-top">
      <div class="col-2 text-center" onclick="window.location = 'customer.html';">
        <i id="i-back" class="fas fa-angle-left"></i>
      </div>
      <div class="col-8 text-center">
        <h5 id="h5-title">เพิ่มลูกค้า</h5>
      </div>
    </div>
    <div id="in-ctn" class="container-fullwidth" style="height: calc(100vh - 80px);">
      <div class="row justify-content-center mgem1o5">
        <div class="col-8 text-center ">
          <label for="name">ชื่อ</label>
          <input id="name" type="text" class="w3-input" autofocus data-index="1">
        </div>
      </div>
      <div class="row justify-content-center mgem1o5">
        <div class="col-8 text-center ">
          <label for="addr">ที่อยู่</label>
          <input id="addr" type="text" class="w3-input" data-index="2">
        </div>
      </div>
      <div class="row justify-content-center mgem1o5">
        <div class="col-8 text-center ">
          <label for="phone">เบอร์โทร</label>
          <input id="phone" type="tel" class="w3-input" data-index="3">
        </div>
      </div>
      <div class="row justify-content-center mgem2">
        <div class="col-8 text-center ">
          <label for="type">ประเภท</label>
          <input id="type" type="text" class="w3-input" data-toggle="dropdown" readonly>
        </div>
      </div>
      <div class="row justify-content-center mgem1o5">
        <div class="col-7 text-center">
          <button class="mbtn" onclick="add_cus();">เพิ่ม</button>
        </div>
      </div>
    </div>
  </div>
  <!-- End big container -->
  <script>
      $("#type").click(function(event) {
        $.confirm({
            title: 'บทบาท',
            content: '<hr style="width: 80%; margin-bottom: 0;">',
            backgroundDismiss: true,
            buttons: {
              form1: {
                text: 'ขายส่ง',
                btnClass: 'btn-choice',
                action: function () {
                  setrole('ขายส่ง');
                }
              },
              form2: {
                text: 'ขายส่ง(1)',
                btnClass: 'btn-choice',
                action: function () {
                  setrole('ขายส่ง(1)');
                }
              },
              form3: {
                text: 'ขายส่ง(2)',
                btnClass: 'btn-choice',
                action: function () {
                  setrole('ขายส่ง(2)');
                }
              },
              form4: {
                text: 'ขายส่ง(3)',
                btnClass: 'btn-choice',
                action: function () {
                  setrole('ขายส่ง(3)');
                }
              },
              form5: {
                text: 'ขายปลีก',
                btnClass: 'btn-choice',
                action: function () {
                  setrole('ขายปลีก');
                }
              }
            }
        });
      });
      //Touch animation
    $(".mbtn").on("touchstart", function() {
      $(this).addClass('mbtn-touch');
    });
    $(".mbtn").on("touchend", function() {
      $(this).removeClass('mbtn-touch');
    });
    </script>
</body>

</html>
