    body{color: var(--text-primary);}

  <script>
    var start = start_s = 0;
    var bool = bool_s = false;
    $(document).ready(function(){
      if(!localStorage.user_id){
				window.location = 'web_login.html';
			}
      get_import();

      window.addEventListener('scroll', () => { 
        // Calculate the scroll position 
        const scrollPosition = window.scrollY + window.innerHeight; 
        const documentHeight = document.documentElement.scrollHeight; 
    
        // Check if the user has scrolled to the bottom 
        if (scrollPosition >= documentHeight - 1) { 
          if(!$("#myUL").prop('hidden')){
              if(bool){
                return 0;
              }
              get_import();           
            }else if(!$("#myS").prop('hidden')){
              if(bool_s){
                return 0;
              }
              get_import_s();
            }
        } 
      });          
    });
    
    $(document).keydown(function(objEvent) {
      if (objEvent.keyCode == 13) {  //enter pressed
        objEvent.preventDefault();           
        search();        
      }         
    })
    var tempdate,no = 1
    function get_import(){
      $.ajax({
        type: "POST",
        url:"php/get_transfer_to.php",
        data: {'start': start},       
        beforeSend: function(){
          EasyLoading.show({                           
						text: "กำลังโหลด"
					});
        },                       
        success: function(data){ 
          EasyLoading.hide();
          var obj = (typeof data === 'string') ? JSON.parse(data) : data;
          if(obj[0] == "last"){
            bool = true
          }                        
          $.each(obj, function(i, field){
            if(i > 0){
              var txt = field.date_time.split(" ");
              var txt2 = txt[0].split("-");
              var timeStr = txt[1] ? (' <span class="text-muted" style="font-size: 0.85rem;">' + txt[1].substr(0, 5) + '</span>') : '';
              var date = txt2[2] + "/" + txt2[1] + "/" + txt2[0].substr(2);
              if(tempdate != date){
                  tempdate = date;
                  no = 1;
              }
              var statusBadge = '';
              if (field.status === 'pending') {
                statusBadge = '<span class="badge badge-warning px-2 py-1"><i class="fa fa-clock mr-1"></i>รอตรวจรับ</span>';
              } else if (field.status === 'rejected') {
                statusBadge = '<span class="badge badge-danger px-2 py-1"><i class="fa fa-times-circle mr-1"></i>ส่งคืน/ปฏิเสธ</span>';
              } else {
                var recvInfo = field.receiver_name ? ('<br><span class="text-success" style="font-size: 0.82rem;"><i class="fa fa-user-check mr-1"></i>' + field.receiver_name + '</span>') : '';
                statusBadge = '<span class="badge badge-success px-2 py-1"><i class="fa fa-check-circle mr-1"></i>เข้าสต๊อกแล้ว</span>' + recvInfo;
              }
              var tfNo = field.tf_number ? field.tf_number : ('#' + no);
              var routeIcon = field.direction === 'ware_to_shop' ? '📦 ➜ 🏪' : '🏪 ➜ 📦';
              var routeStr = '<span class="text-secondary mr-1">' + routeIcon + '</span> ' + (field.source_name || 'โกดัง') + ' ➜ ' + (field.dest_name || 'หน้าร้าน');

              $('#myUL').append('<li id="ipt-'+field.tf_id+'">' +
              '<div class="row justify-content-center ipt-even align-items-center" data-toggle="collapse" href="#detail-'+field.tf_id+'" role="button" aria-expanded="false" aria-controls="detail-'+field.tf_id+'" onclick="appendCollapse('+field.tf_id+');">'+
                  '<div class="col-3 text-center"><h5>'+tfNo+'</h5></div>' +                   
                  '<div class="col-3 text-center"><h5>'+date + ' ' + timeStr +'</h5></div>' +
                  '<div class="col-3 text-center"><h5 class="text-primary font-weight-bold" style="font-size: 0.95rem;">'+routeStr+'</h5></div>' +
                  '<div class="col-3 text-center"><h5>'+statusBadge+'</h5></div>' +
              '</div>' +
            '</li>');
            no++;
            }                                               
          });
        },
        error: function(){
          EasyLoading.hide();
        }               
      });
      start += 30;
    }   

    var val;
    function search(){
      if($('#input-search').val() == ""){
        return 0;
      }     
      val = $('#input-search').val()
      start_s = 0;
      bool_s = false;
      $("#myS").prop('hidden', false);
      $("#myUL").prop('hidden', true);     
      $("#myS").empty();
      tempdate = ""
      no = 1
      get_import_s();
    }

    function get_import_s(){
      $.ajax({

        url:"php/get_transfer_to.php",
        data: {'start': start_s, 'value' : val},
        beforeSend: function(){
          EasyLoading.show({                           
						text: "กำลังโหลด"
					});
        },

          if(obj[0] == "last"){

            if(i > 0){

              } else {
                var recvInfo = field.receiver_name ? ('<br><span class="text-success" style="font-size: 0.82rem;"><i class="fa fa-user-check mr-1"></i>' + field.receiver_name + '</span>') : '';
                statusBadge = '<span class="badge badge-success px-2 py-1"><i class="fa fa-check-circle mr-1"></i>เข้าสต๊อกแล้ว</span>' + recvInfo;
              }
              var tfNo = field.tf_number ? field.tf_number : ('#' + no);
              var routeIcon = field.direction === 'ware_to_shop' ? '📦 ➜ 🏪' : '🏪 ➜ 📦';
              var routeStr = '<span class="text-secondary mr-1">' + routeIcon + '</span> ' + (field.source_name || 'โกดัง') + ' ➜ ' + (field.dest_name || 'หน้าร้าน');

              $('#myS').append('<li id="ipts-'+field.tf_id+'">' +

              '</div>' +

            no++;
            }                                                
          });                                         
        },
        error: function(){
          EasyLoading.hide();
        }               
      });
      start_s += 30;
    }
  
    function delete_bill(tf_id,ware_id,shop_id){
      $.confirm({
        title: 'ลบรายการ',
        content: 'ต้องการลบรายการนี้หรือไม่?',
        backgroundDismiss: true,
        buttons: { 
          formSubmit: {
            text: 'ตกลง',
            btnClass: 'btn-danger',
            action: function () {
              // delete bill
              $.ajax({
                type: "POST",
                url:"php/delete_transfer_to.php",         
                data:{'imp_id' : tf_id,'ware_id' : ware_id, 'shop_id' : shop_id},
                beforeSend: function(){
                  EasyLoading.show({                           
                    text: "กำลังโหลด"
                  });
                },                       
                success: function(data){ 
                  EasyLoading.hide();
                  if(data == "success"){                    
                    $('#ipt-'+tf_id).remove()
                    $('#ipts-'+tf_id).remove()
                  }else{
                    $.confirm({
                      title: 'พบข้อผิดพลาด',
                      content: 'ลองอีกครั้ง',
                      backgroundDismiss: true,
                      buttons: {
                        formSubmit: {
                        text: 'ตกลง',
                        btnClass: 'btn-regis',
                        action: function () {
                        }
                        }
                      }
                    });
                  }                         
                }               
              });      
            }
          },ยกเลิก: function () {}, 
        }  
      });
    }

    var dt,username,totalA,wareName,tfID
    function appendCollapse(index){
        if($("#detail-"+index).length){
            //
        }else{
          arr_data = [];
          var text = ""
          $.ajax({
            type: "POST",
            url:"php/get_transfer_to_info.php",    
            data:{'imp_id' : index},
            async:false,
            beforeSend: function(){
              EasyLoading.show({                           
                text: "กำลังโหลด"
              });
            },             
            success: function(data){  
              EasyLoading.hide();
              var obj = (typeof data === 'string') ? JSON.parse(data) : data; 
              text = text + '<div class="collapse" id="detail-'+index+'">'+
                '<div class="card card-body">'+
                  '<div class="row justify-content-center">'+
                      '<h3 style="text-decoration: underline;">รายการ</h3>'+
                  '</div>'             
              $.each(obj, function(i, field){
                cost = ""
                if(localStorage.user_role != "พนักงาน"){
                  cost = field.prod_price
                }
                text = text + '<div id="item-'+field.item_id+'" class="row justify-content-center">'+
                  '<div class="col-1 text-center items">'+(i+1)+'</div>'+
                  '<div class="col-1 text-center items">'+field.prod_amount+'</div>'+
                  '<div class="col-6 text-center items">'+field.prod_name+'</div>'+
                  '<div class="col-2 text-center items">'+cost+'</div>'+
                  '<div class="col-2 text-center items">'+field.prod_amount*field.prod_price+'</div>'+
                '</div>'
                
                item = {}
                item ["qr"] =  field.prod_code
                item ["name"] =  field.prod_name
                item ["amt"] =  field.prod_amount
                item ["price"] = field.prod_price
                dt = field.date_time
                username = field.user_name
                totalA = obj[0].total
                wareName = field.ware_name
                tfID = field.tf_id
                arr_data.push(item);
              });
              text = text + '<hr style="width: 50%; margin: auto; margin-top: 1em;">';
              var receiverTxt = obj[0].receiver_name ? (obj[0].receiver_name + ' (เมื่อ ' + (obj[0].receive_time || '-') + ')') : '<span class="text-muted">-</span>';
              var stBadge = obj[0].status === 'pending' ? '<span class="badge badge-warning">รอตรวจรับ</span>' : (obj[0].status === 'rejected' ? '<span class="badge badge-danger">ปฏิเสธรับ/ส่งคืน</span>' : '<span class="badge badge-success">ตรวจรับเข้าสต๊อกแล้ว</span>');
              
              var routeStr = (obj[0].source_name || 'โกดัง') + ' ➜ ' + (obj[0].dest_name || 'หน้าร้าน');
              var successBanner = '';
              if (obj[0].status === 'received') {
                successBanner = '<div class="alert alert-success text-center font-weight-bold py-2 my-2"><i class="fa fa-check-circle fa-lg mr-2"></i> สินค้าได้เข้าสต๊อก ' + (obj[0].dest_name || 'ปลายทาง') + ' เรียบร้อยแล้ว (ตรวจรับเมื่อ ' + (obj[0].receive_time || '-') + ')</div>';
              }

              text = text + '<div class="container" style="max-width: 600px;">' + successBanner +
                  '<div class="row justify-content-center" style="margin-top: 0.5em;">'+
                      '<div class="col-5 text-right font-weight-bold">สถานะ:</div>'+
                      '<div class="col-7 text-left">'+stBadge+'</div>'+
                  '</div>'+
                  '<div class="row justify-content-center">'+
                      '<div class="col-5 text-right font-weight-bold">เส้นทางการโอน:</div>'+
                      '<div class="col-7 text-left font-weight-bold text-primary">'+routeStr+'</div>'+
                  '</div>'+
                  '<div class="row justify-content-center">'+
                      '<div class="col-5 text-right font-weight-bold">รวมจำนวนสินค้า:</div>'+
                      '<div class="col-7 text-left font-weight-bold">'+obj[0].total+' ชิ้น</div>'+
                  '</div>'+
                  '<div class="row justify-content-center">'+
                      '<div class="col-5 text-right font-weight-bold">ผู้ส่งสินค้า:</div>'+
                      '<div class="col-7 text-left">'+(obj[0].sender_name || obj[0].user_name)+'</div>'+
                  '</div>'+
                  '<div class="row justify-content-center">'+
                      '<div class="col-5 text-right font-weight-bold">ผู้ตรวจรับเข้าสต๊อก:</div>'+
                      '<div class="col-7 text-left text-success font-weight-bold">'+receiverTxt+'</div>'+
                  '</div>'+
                  (obj[0].reject_reason ? ('<div class="row justify-content-center text-danger"><div class="col-5 text-right font-weight-bold">เหตุผลที่ส่งคืน:</div><div class="col-7 text-left">'+obj[0].reject_reason+'</div></div>') : '') +
                  '</div>';

              var cancelBtn = '';
              if (obj[0].status === 'pending') {
                cancelBtn = '<button class="btn btn-lg btn-danger font-weight-bold" style="color: white;" onclick="delete_bill('+index+','+obj[0].branch_id+','+obj[0].shop_id+')"><i class="fas fa-trash mr-1"></i> ยกเลิกใบโอน</button>';
              } else if (obj[0].status === 'received') {
                cancelBtn = '<span class="badge badge-success p-2" style="font-size: 0.9rem;"><i class="fa fa-lock mr-1"></i> เข้าสต๊อกแล้วสมบูรณ์</span>';
              }

              text = text + '<div class="row justify-content-center align-items-center" style="margin-top: 1.5em;">'+
                  '<div class="col-5 text-right">'+                   
                    '<button onclick="print.apply(this,arr_data)" class="btn btn-lg btn-warning font-weight-bold" style="color: white;"><i class="fas fa-print mr-1"></i> พิมพ์ใบโอน</button>'+
                  '</div>'+
                  '<div class="col-5 text-left">'+ cancelBtn +
                  '</div>'+         
                '</div>'+                
            '</div>'+
              '</div>';                   
            }               
          });

          $("#ipt-"+index).append(text);
        }
        $('html, body').animate({
              scrollTop: $("#ipt-"+index).offset().top
          }, 1100);
    }
