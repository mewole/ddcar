  <script>
    var imp_id,ware_id_o;
    var currentImportObj = null;
    arr = [];
    $(document).ready(function(){
      url = new URL(window.location.href);
      imp_id = url.searchParams.get("id"); 

      $.ajax({
        type: "POST",
        url:localStorage.pathServer + "php/get_import_info.php",    
        data:{'imp_id' : imp_id},                            
        beforeSend: function(){
            $(".overlay").prop('hidden', false);
        },             
        success: function(data){  
          $(".overlay").prop('hidden', true);
          var obj = (typeof data === 'string') ? JSON.parse(data) : data;
          currentImportObj = obj;
          $('#h5-title').text(obj[0].stock_number);
          $('#warehouse').text(obj[0].ware_name);
          var txt = obj[0].date_time.split(" ");
          var txt2 = txt[0].split("-");
          var date = txt2[2] + "/" + txt2[1] + "/" + txt2[0].substr(2) + " " + txt[1].substr(0,5);
          $('#date').text(date);
          
          ware_id_o = obj[0].ware_id;
          ware_id = obj[0].ware_id;
          $.each(obj, function(i, field){
            $('#in-ctn').append('<div id="prod-'+field.item_id+'" class="row mgemo5">'+
              '<div class="col-1 text-center">' +
                '<p id="amt-'+field.item_id+'" class="amount">'+field.amount+'</p>' +
              '</div>' +
              '<div class="col-7 text-center no-pd">' +
              '<p id="name-'+field.item_id+'">'+field.prod_name+'</p>' +
              '</div>' +
              '<div class="col-2 col-@">' +
                '<p id="cost-'+field.item_id+'">'+field.stock_cost+'</p>' +
              '</div>' +
              '<div class="col-2 text-right no-pd">' +
                '<p id="total-'+field.item_id+'">'+field.amount*field.stock_cost+'</p>' +
              '</div>' +
            '</div>');
            arr.push(field.amount);
          });                      
            $('#in-ctn').append('<div class="row"><hr style="width: 100%;">'+
            '<div class="col-4 text-center" style="padding-left: 0;"><h5 class="bold">รวม</h5></div>'+
            '<div class="col-7 text-right" style="padding-right: 0;"><h5 id="sum" class="bold"></h5></div>'+
            '</div><hr style="margin-top: 1em;">'+
            '<div class="row justify-content-center mb-3">'+
              '<div class="col-12 text-center">'+
                '<button onclick="printBillSlip()" class="btn btn-primary px-3 py-2 mr-2 font-weight-bold"><i class="fas fa-receipt mr-1"></i> พิมพ์บิล (สลิป 80mm)</button>'+

              '</div>'+
            '</div>'+
            '<div id="btm-row" class="row" style="margin-bottom: 4.5em;">'+
            '<div class="col-12 text-center">'+
                '<h5 id="user">ชื่อผู้บันทึก</h5>'+
            '</div>'+
          '</div>');

            $('#user').text("ผู้ทำรายการ: " + obj[0].user_name);

    function printBillSlip(){
      if(!currentImportObj || currentImportObj.length === 0) return;
      var obj = currentImportObj;
      var dt = (obj[0].date_time || '').split(" ");
      var time = (dt[1] || '').substr(0, 5);
      var d = (dt[0] || '').split("-");

      var ref = obj[0].ref_invoice ? obj[0].ref_invoice : '';

      var totalCost = 0;

        var qty = parseInt(item.amount) || 0;
        var cost = parseFloat(item.stock_cost) || 0;

        totalCost += (qty * cost);
        var skuText = item.supplier_sku && item.supplier_sku.trim() !== '' ? ('<br><span style="font-size: 10px; color: #555;">[SKU: ' + item.supplier_sku + ']</span>') : '';

          "<td style='text-align: left; vertical-align: top; padding: 4px 4px;'>" + codeText + item.prod_name + skuText + "</td>" +
          "<td style='text-align: right; vertical-align: top; padding: 4px 0; font-weight: bold;'>" + qty + "</td>" +
          (canViewCost ? ("<td style='text-align: right; vertical-align: top; padding: 4px 0;'>" + cost.toLocaleString('th-TH', {minimumFractionDigits: 2}) + "</td>") : "") +
        "</tr>";
      });

        "<title>ใบรายการนำเข้าสินค้า - " + obj[0].stock_number + "</title>" +
        "<link href='https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Maitree:wght@400;600&display=swap' rel='stylesheet'>" +
        "<style>" +

        "table.items-table td { font-size: 12px; } " +

        "<div class='bill-wrap'>" +
        "<div class='text-center font-bold' style='font-size: 16px;'>DD MOTOR SPORT</div>" +
        "<div class='text-center' style='font-size: 11px;'>B-24, B-28 อาคารศรีวรจักร ถ.หลวงป้อมปราบศัตรูพ่าย</div>" +

        "<div class='line-dashed'></div>" +
        "<div class='row-info'><div class='lbl'>เลขที่นำเข้า :</div><div class='val font-bold'>" + obj[0].stock_number + "</div></div>" +
        "<div class='row-info'><div class='lbl'>วันที่ :</div><div class='val'>" + date + " " + time + "</div></div>" +
        "<div class='row-info'><div class='lbl'>ร้านค้า/ผู้ส่ง :</div><div class='val font-bold'>" + sup + "</div></div>" +
        (ref ? ("<div class='row-info'><div class='lbl'>บิลร้าน :</div><div class='val font-bold'>" + ref + "</div></div>") : "") +
        "<div class='row-info'><div class='lbl'>สถานที่ :</div><div class='val'>" + wareName + "</div></div>" +
        "<div class='row-info'><div class='lbl'>ผู้บันทึก :</div><div class='val'>" + (obj[0].user_name || '-') + "</div></div>" +
        "<div class='line-dashed'></div>" +
        "<table class='items-table'>" +
        "<thead><tr>" +
        "<th style='width: 8%; text-align: center;'>#</th>" +
        "<th style='width: " + (canViewCost ? "54%" : "72%") + "; text-align: left;'>รายการ</th>" +
        "<th style='width: " + (canViewCost ? "18%" : "20%") + "; text-align: right;'>จำนวน</th>" +
        (canViewCost ? "<th style='width: 20%; text-align: right;'>ทุน</th>" : "") +
        "</tr></thead>" +
        "<tbody>" + rowsHtml + "</tbody>" +
        "</table>" +
        "<div class='line-dashed'></div>" +
        "<div class='row-summary total'><div>รวมจำนวนทั้งหมด :</div><div>" + totalQty + " ชิ้น</div></div>" +
        (canViewCost ? ("<div class='row-summary total'><div>รวมต้นทุน :</div><div>" + totalCost.toLocaleString('th-TH', {minimumFractionDigits: 2}) + " บาท</div></div>") : "") +
        "<div class='line-dashed'></div>" +
        "<div class='sign-box'>" +
        "<div>ผู้เช็คสินค้า : ........................................</div>" +
        "<div style='margin-top: 10px;'>ผู้นำสินค้าเข้า : ........................................</div>" +
        "</div>" +
        "</div></body></html>";

      var WinPrint = window.open('', '', 'left=0,top=0,width=800,height=900,toolbar=0,scrollbars=0,status=0');
      WinPrint.document.write(billHtml);
      WinPrint.document.close();
      WinPrint.focus();
      setTimeout(function() { WinPrint.print(); WinPrint.close(); }, 350);
    }

        rowsHtml += "<tr>" +

          "<td class='text-center font-weight-bold'>" + (item.prod_code || '-') + "</td>" +
          "<td class='text-left'>" + item.prod_name + skuBadge + "</td>" +
          "<td class='text-center font-weight-bold'>" + qty + "</td>" +
          (canViewCost ? ("<td class='text-right'>" + cost.toLocaleString('th-TH', {minimumFractionDigits: 2}) + "</td><td class='text-right font-weight-bold'>" + itemTotal.toLocaleString('th-TH', {minimumFractionDigits: 2}) + "</td>") : "") +

        "<title>ใบรับสินค้าเข้า - " + obj[0].stock_number + "</title>" +
        "<link href='https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap' rel='stylesheet'>" +
        "<link rel='stylesheet' href='https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css'>" +
        "<style>" +
        "@page { size: A4 portrait; margin: 10mm 12mm; } " +
        "body { font-family: 'Prompt', Tahoma, sans-serif; font-size: 13px; color: #000; background: #fff; } " +
        ".table-doc th, .table-doc td { border: 1px solid #333 !important; padding: 6px 8px !important; } " +
        ".table-doc thead th { background-color: #f2f2f2 !important; font-weight: bold; } " +
        ".sign-box { border: 1px solid #888; border-radius: 4px; padding: 12px; min-height: 80px; text-align: center; } " +
        "</style></head><body>" +
        "<div class='container-fluid p-2'>" +
          "<div class='row pb-2 mb-2 border-bottom align-items-center'>" +
            "<div class='col-7'>" +
              "<h4 class='font-weight-bold mb-0'>DD MOTOR SPORT</h4>" +
              "<div class='small text-muted'>B-24, B-28 อาคารศรีวรจักร ถ.หลวงป้อมปราบศัตรูพ่าย โทร. 02-2265280, 02-2222437</div>" +
            "</div>" +
            "<div class='col-5 text-right'>" +
              "<h4 class='font-weight-bold text-dark mb-0'>ใบรับสินค้าเข้า</h4>" +
              "<div class='small text-muted'>GOODS RECEIPT SLIP</div>" +
            "</div>" +
          "</div>" +
          "<div class='row mb-3'>" +
            "<div class='col-6'>" +
              "<div><b>เลขที่รับเข้า:</b> " + obj[0].stock_number + "</div>" +
              "<div><b>ร้านค้า/ผู้จำหน่าย:</b> " + sup + "</div>" +
              "<div><b>เลขที่บิลร้าน:</b> " + ref + "</div>" +

              "<div><b>วันที่:</b> " + date + " " + time + "</div>" +
              "<div><b>สถานที่รับ:</b> " + wareName + "</div>" +
              "<div><b>ผู้ทำรายการ:</b> " + (obj[0].user_name || '-') + "</div>" +
            "</div>" +
          "</div>" +

                "<th class='text-center' style='width: 18%;'>รหัสสินค้า</th>" +
                "<th class='text-left' style='width: " + (canViewCost ? "44%" : "66%") + ";'>ชื่อสินค้า</th>" +
                "<th class='text-center' style='width: 10%;'>จำนวน</th>" +
                (canViewCost ? "<th class='text-right' style='width: 11%;'>ราคาทุน</th><th class='text-right' style='width: 11%;'>รวม (บาท)</th>" : "") +
              "</tr>" +
            "</thead>" +
            "<tbody>" + rowsHtml + "</tbody>" +
            "<tfoot>" +
              "<tr>" +
                "<th colspan='3' class='text-right font-weight-bold'>รวมจำนวนชิ้นทั้งหมด:</th>" +
                "<th class='text-center font-weight-bold'>" + totalQty + "</th>" +
                (canViewCost ? ("<th class='text-right font-weight-bold'>รวมมูลค่า:</th><th class='text-right font-weight-bold'>" + totalCost.toLocaleString('th-TH', {minimumFractionDigits: 2}) + "</th>") : "") +
              "</tr>" +
            "</tfoot>" +
          "</table>" +
          "<div class='row mt-4'>" +
            "<div class='col-4'><div class='sign-box'><div class='small text-muted mb-4'>ผู้ส่งสินค้า</div>........................................<div class='small text-muted mt-1'>(วันที่ ......./......./.......)</div></div></div>" +
            "<div class='col-4'><div class='sign-box'><div class='small text-muted mb-4'>ผู้ตรวจรับสินค้า</div>........................................<div class='small text-muted mt-1'>(วันที่ ......./......./.......)</div></div></div>" +
            "<div class='col-4'><div class='sign-box'><div class='small text-muted mb-4'>ผู้บันทึกข้อมูลเข้าสต๊อก</div>........................................<div class='small text-muted mt-1'>(" + (obj[0].user_name || '-') + ")</div></div></div>" +

    function disactive(arg) {
        nav_menu = ['home', 'add', 'edit', 'del'];
        for (i = 0; i < 4; i++) {
            if (nav_menu[i] != arg) {
                if ($("#i-" + nav_menu[i]).hasClass('active')) $("#i-" + nav_menu[i]).removeClass('active');
            }
        }
    }

    function menu(arg) {
      // Animate
        disactive(arg);
        if($("#i-"+arg).hasClass('active')){
            //console.log("i-"+arg+"hasClass('active')");
            $("#i-"+arg).removeClass('active');
          }else{
            $("#i-" + arg).fadeOut(150).fadeIn(100, function() {
              $("#i-" + arg).addClass('active');
            });
        }
        if (arg == "add") {
            //goto = "sale.html";
            
        } else if(arg == "edit"){
            // show edit all
            if ($(".amount").hasClass('underline')) {
              $(".i-del").attr('hidden', true);
              $(".amount").removeClass('underline');            
              $("#warehouse").removeClass('underline');            
              $("#warehouse").attr('onclick', '');            
              $("#i-save").attr('onclick', '');
              $("#i-save").css('color', "#e57f7f");
              // if has 3 prod then index = 3
              for(i = 1; i <= 3; i++){ $("#amt-"+i).attr('onclick', ''); }
            } else {
              $(".i-del").attr('hidden', true);
              $(".amount").addClass('underline');
              $("#warehouse").addClass('underline');
              $("#warehouse").attr('onclick', 'edit_warehouse()');
              $("#i-save").attr('onclick', 'save()');
              $("#i-save").css('color', "#fff");
              for(i = 1; i <= 3; i++){ $("#amt-"+i).attr('onclick', 'edit_amount('+i+')'); }
            }
        } else if (arg == "del") {
            // show trash all 
            $("style").append(".jconfirm .jconfirm-box{margin-bottom: 5%;}");
            $.confirm({
                title: 'ลบรายการ',
                content: 'ต้องการลบบิล '+$("#h5-title").text()+' หรือไม่',
                backgroundDismiss: true,
                buttons: { 
                  formSubmit: {
                    text: 'ตกลง',
                    btnClass: 'btn-danger',
                    action: function () {
                        // delete bill
                        $.ajax({
                          type: "POST",
                          url:localStorage.pathServer + "php/delete_import.php",         
                          data:{'imp_id' : imp_id,'ware_id' : ware_id_o},
                          beforeSend: function(){
                            $(".overlay").prop('hidden', false);
                          },                       
                          success: function(data){ 
                            $(".overlay").prop('hidden', true);                     
                            if(data == "success"){                    
                              
                              window.location = 'manage_import.html';
                            }else{
                              $.confirm({
                                title: 'พบข้อผิดพลาด',
                                content: 'ลองอีกครั้ง',
                                backgroundDismiss: true,
                                buttons: {
                                  formSubmit: {
                                  text: 'ตกลง',
                                  btnClass: 'btn-regis',
                                  action: function () {
                                  }
                                  }
                                }
                              });
                            }                         
                          }               
                        }); 
                    }
                  },ยกเลิก: function () {}, 
                }  
            });
        }
    } 

    function edit_amount(arg){
      $("style").append(".jconfirm .jconfirm-box{margin-bottom:60%;}");
      $.confirm({
        title: $("#name-"+arg).text(),
        content: '<div class="row" style="margin-top: 2%; margin-bottom: 2%;"><div class="col-12 text-center" style="font-size: 110%; font-weight: bold;">จำนวน</div></div><div class="row"><div class="col-3"></div><div class="col-6 text-center"><input id="edt-amt" type="number" class="input-cf" value="'+$("#amt-"+arg).text()+'"></div><div class="col-3"></div></div>',
        backgroundDismiss: true,
        onContentReady: function () {
          var temp = $('#edt-amt').val();
          $("#edt-amt").focus().val("").val(temp);
        },
        buttons: {
          formSubmit: {
            text: 'ตกลง',
            btnClass: 'btn-danger',
            action: function () {
              var amt = $('#edt-amt').val();
              if(amt == $("#amt-"+arg).text()){
                return 0;
              }
              var sum = $('#sum').text();
              var sum_o = $('#cost-'+arg).text()*$("#amt-"+arg).text();
              var sum_n = $('#cost-'+arg).text()*amt;
              var sumsum = (sum-sum_o)+sum_n;            
              $('#total-'+arg).text(sum_n);
              $('#sum').text(sumsum);             
              $("#amt-"+arg).text(amt);   
            }
          },ยกเลิก: function () {
              //$(".jconfirm .jconfirm-box").css('margin-bottom', '5%');
            }
        }
      });
    }

    function edit_warehouse(){
      $("style").append('.jconfirm .jconfirm-box{max-height: 420px;}');
        $.confirm({
          title: 'โกดัง',
          content: '<hr style="width: 80%; margin-bottom: 0;">',
          backgroundDismiss: true,
          onOpenBefore: function () {
            $(".jconfirm-buttons .btn-default").remove();
            //ajax and apeend
            $.ajax({
              type: "GET",
              url:localStorage.pathServer + "php/get_ware.php",                            
              beforeSend: function(){
                  $(".overlay").prop('hidden', false);
              },             
              success: function(data){  
                $(".overlay").prop('hidden', true);
                var obj = jQuery.parseJSON(data); 
                if(obj){
                  $.each(obj, function(i, field){
                    $(".jconfirm-buttons").append('<button id="li-ware-'+i+'" type="button" onclick="setware('+i+')" class="btn btn-choice">'+obj[i].ware_name+'</button>' +
                      '<span id="id-ware-'+i+'" hidden>'+obj[i].ware_id+'</span>');
                  }); 
                }else{
                  $(".jconfirm-buttons").append("กรุณาเพิ่มโกดังก่อนทำรายการ");;  
                }
              }               
            });              
          },
          onDestroy: function () {
            $("style").append('.jconfirm .jconfirm-box{margin-bottom: 5%;}');
            $("style").append('.jconfirm .jconfirm-box{max-height: 100%;}');
          }             
        });
    }

    var ware_id;
    function setware(arg) {
      $("#warehouse").text($("#li-ware-" + arg).text());    
      ware_id = $("#id-ware-" + arg).text();
      document.elementFromPoint(0, 0).click();
    }

    function save(){
      arr_data = [];
      var f = false;
      if(ware_id == ware_id_o){        
        f = true;       
      }
      var ch = 0;
      for(var i = 0;i < arr.length;i++){       
        if($("#amt-"+(i+1)).text() == arr[i]){
          ch++;
          item = {}            
          item ["item_id"] = i+1;
          item ["amt"] =  $("#amt-"+(i+1)).text();
          item ["ch"] = 0;
          arr_data.push(item); 
        }else{
          item = {}            
          item ["item_id"] = i+1;
          item ["amt"] =  $("#amt-"+(i+1)).text();
          item ["ch"] = 1;
          arr_data.push(item); 
        }         
      }        
      if(ch == arr.length && f){
        return 0;
      }      
      var json_string = JSON.stringify(arr_data); 
      var dataString =  "JSON=" + json_string + "&imp_id=" + imp_id + "&ware_id=" + ware_id + "&sum=" + $('#sum').text();     
      //alert(dataString);
      $.ajax({
        type: "POST",
        url:localStorage.pathServer + "php/rename_import.php",         
        data: dataString,
        beforeSend: function(){

        },

                  }
                  }

            });
