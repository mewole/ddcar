<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
  <title>รายละเอียดการรับสินค้า - DDCAR</title>
  <!-- Local Assets -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/svg-with-js.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/jquery-confirm.css">
  <link rel="stylesheet" href="css/loading.css">

  <script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
  <script type="text/javascript" src="js/jquery-ui.min.js"></script>
  <script type="text/javascript" src="js/jquery.easing.1.3.min.js"></script>
  <script type="text/javascript" src="js/jquery-confirm.js"></script>
  <script type="text/javascript" src="js/popper.min.js"></script>
  <script type="text/javascript" src="js/bootstrap.min.js"></script>
  <script defer src="js/fontawesome-all.js"></script>
  <script type="text/javascript" src="js/config.js"></script>
  <script type="text/javascript" src="js/capacitor-bridge.js"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css?family=Prompt" rel="stylesheet">

  <!-- DatePicker -->
  <link rel="stylesheet" href="css/duDatepicker.css">
  <script src="js/duDatepicker.js"></script>

  <style>
    hr{
      margin-top: 0;
      width: 80%;
    }
    .pdr{
      padding-right: 10%;
    }
    .pdl{
      padding-left: 10%;
    }

    .nopd{
      padding-left: 0;
      padding-right: 0;
    }

    .bold{
      font-weight: bold;
    }

    .underline{
      text-decoration: underline #666;
    }    
  </style>

  <script>
    var imp_id,ware_id_o;
    var arr = [];
    var originalImportData = null;
    var isEditMode = false;

    $(document).ready(function(){
      url = new URL(window.location.href);
      imp_id = url.searchParams.get("id"); 

      $.ajax({
        type: "POST",
        url:localStorage.pathServer + "php/get_import_info.php",    
        data:{'imp_id' : imp_id},                            
        beforeSend: function(){
            $(".overlay").prop('hidden', false);
        },             
        success: function(data){  
          $(".overlay").prop('hidden', true);
          var obj = (window.safeParseJSON ? window.safeParseJSON(data) : null) || (function(){ try { return JSON.parse(data); } catch(e){ return null; } })(); 
          if (!obj || !Array.isArray(obj) || obj.length === 0) {
            $('#h5-title').text('ไม่พบข้อมูลรายการ');
            return;
          }
          originalImportData = JSON.parse(JSON.stringify(obj));

          $('#h5-title').text(obj[0].stock_number || '');
          $('#warehouse').text(obj[0].ware_name || '');
          var dt = obj[0].date_time || '';
          if (dt && dt.indexOf(' ') !== -1) {
            var txt = dt.split(" ");
            var txt2 = txt[0].split("-");
            var date = txt2[2] + "/" + txt2[1] + "/" + txt2[0].substr(2) + " " + txt[1].substr(0,5);
            $('#date').text(date);
          }
          
          ware_id_o = obj[0].ware_id;
          ware_id = obj[0].ware_id;
          arr = [];
          var hasItems = false;
          $.each(obj, function(i, field){
            if (field.item_id && field.item_id !== '0' && field.item_id !== 0 && field.prod_name) {
              hasItems = true;
              var idx = arr.length + 1;
              var pName = field.prod_name || 'สินค้า (ลบแล้ว)';
              var pAmt = parseFloat(field.amount) || 0;
              var pCost = parseFloat(field.stock_cost) || 0;
              $('#in-ctn').append('<div id="prod-'+idx+'" class="row mgemo5">'+
                '<div class="col-1 text-center">' +
                  '<p id="amt-'+idx+'" class="amount">'+pAmt+'</p>' +
                '</div>' +
                '<div class="col-7 text-center no-pd">' +
                '<p id="name-'+idx+'">'+pName+'</p>' +
                '</div>' +
                '<div class="col-2 col-@">' +
                '<p id="cost-'+idx+'">'+pCost+'</p>' +
                '</div>' +
                '<div class="col-2 text-right no-pd">' +
                '<p id="total-'+idx+'">'+(pAmt*pCost)+'</p>' +
                '</div>' +
              '</div>');
              arr.push(pAmt);
            }
          });                      
          if (!hasItems) {
            $('#in-ctn').append('<div class="row my-4"><div class="col-12 text-center text-muted font-italic"><p>(ไม่มีรายการสินค้า หรือสินค้าถูกยกเลิก/ลบแล้ว)</p></div></div>');
          }
          $('#in-ctn').append('<div class="row"><hr style="width 100%;">'+
            '<div class="col-4 text-center" style="padding-left: 0;"><h5 class="bold">รวม</h5></div>'+
            '<div class="col-7 text-right" style="padding-right: 0;"><h5 id="sum" class="bold"></h5></div>'+
            '</div><hr style="margin-top: 1em;">'+
            '<div id="btm-row" class="row" style="margin-bottom: 4.5em;">'+
            '<div class="col-12 text-center">'+
                '<h5 id="user">ชื่อผู้บันทึก</h5>'+
            '</div>'+
          '</div>');   
              
          $('#sum').text(obj[0].total_stock || '0');
          $('#user').text("ผู้ทำรายการ: " + (obj[0].user_name || '-'));                       
        },
        error: function(xhr, status, error) {
          $(".overlay").prop('hidden', true);
          $('#h5-title').text('เกิดข้อผิดพลาด');
          $('#in-ctn').append('<div class="row my-4"><div class="col-12 text-center text-danger"><p>ไม่สามารถดึงข้อมูลรายการได้ (' + (error || status) + ')</p></div></div>');
        }               
      });  
    });   

    function cancelEdit() {
      isEditMode = false;
      $("#i-edit").removeClass('active');
      $("#i-save").attr('onclick', '').css({'color': '#e57f7f', 'opacity': '0.5', 'cursor': 'default'});
      $(".amount").removeClass('underline').css('cursor', 'default');
      $("#warehouse").removeClass('underline').attr('onclick', '').css('cursor', 'default');
      for(var i = 1; i <= arr.length; i++){
        $("#amt-"+i).attr('onclick', '').css('cursor', 'default');
      }

      // Revert values to original loaded data
      if (originalImportData && originalImportData.length > 0) {
        ware_id = ware_id_o;
        $("#warehouse").text(originalImportData[0].ware_name);
        $('#sum').text(originalImportData[0].total_stock);
        for (var b = 0; b < originalImportData.length; b++) {
          var idx = b + 1;
          var it = originalImportData[b];
          $('#amt-' + idx).text(it.amount);
          $('#total-' + idx).text(it.amount * it.stock_cost);
        }
      }
    }

    function enterEditMode() {
      isEditMode = true;
      var nav_menu = ['home', 'add', 'del'];
      for (var i = 0; i < nav_menu.length; i++) {
        $("#i-" + nav_menu[i]).removeClass('active');
      }
      $("#i-edit").addClass('active');

      $(".amount").addClass('underline').css('cursor', 'pointer');
      $("#warehouse").addClass('underline').css('cursor', 'pointer');
      $("#warehouse").attr('onclick', 'edit_warehouse()');
      $("#i-save").attr('onclick', 'save()').css({'color': '#fff', 'opacity': '1', 'cursor': 'pointer'});
      for(var i = 1; i <= arr.length; i++){
        $("#amt-"+i).attr('onclick', 'edit_amount('+i+')').css('cursor', 'pointer');
      }
    }

    function menu(arg) {
      if (arg == "edit") {
        if (isEditMode) {
          cancelEdit();
        } else {
          enterEditMode();
        }
      } else {
        if (isEditMode) {
          cancelEdit();
        }
        if (arg == "del") {
            // show trash all 
            $("style").append(".jconfirm .jconfirm-box{margin-bottom: 5%;}");
            $.confirm({
                title: 'ลบรายการ',
                content: 'ต้องการลบบิล '+$("#h5-title").text()+' หรือไม่',
                backgroundDismiss: true,
                buttons: { 
                  formSubmit: {
                    text: 'ตกลง',
                    btnClass: 'btn-danger',
                    action: function () {
                        // delete bill
                        $.ajax({
                          type: "POST",
                          url:localStorage.pathServer + "php/delete_import.php",         
                          data:{'imp_id' : imp_id,'ware_id' : ware_id_o},
                          beforeSend: function(){
                            $(".overlay").prop('hidden', false);
                          },                       
                          success: function(data){ 
                            $(".overlay").prop('hidden', true);                     
                            if(data == "success"){                    
                              
                              window.location = 'manage_import.html';
                            }else{
                              $.confirm({
                                title: 'พบข้อผิดพลาด',
                                content: 'ลองอีกครั้ง',
                                backgroundDismiss: true,
                                buttons: {
                                  formSubmit: {
                                  text: 'ตกลง',
                                  btnClass: 'btn-regis',
                                  action: function () {
                                  }
                                  }
                                }
                              });
                            }                         
                          }               
                        }); 
                    }
                  },ยกเลิก: function () {}, 
                }  
            });
        }
    } 

    function edit_amount(arg){
      $("style").append(".jconfirm .jconfirm-box{margin-bottom:60%;}");
      $.confirm({
        title: $("#name-"+arg).text(),
        content: '<div class="row" style="margin-top: 2%; margin-bottom: 2%;"><div class="col-12 text-center" style="font-size: 110%; font-weight: bold;">จำนวน</div></div><div class="row"><div class="col-3"></div><div class="col-6 text-center"><input id="edt-amt" type="number" class="input-cf" value="'+$("#amt-"+arg).text()+'"></div><div class="col-3"></div></div>',
        backgroundDismiss: true,
        onContentReady: function () {
          var temp = $('#edt-amt').val();
          $("#edt-amt").focus().val("").val(temp);
        },
        buttons: {
          formSubmit: {
            text: 'ตกลง',
            btnClass: 'btn-danger',
            action: function () {
              var amt = $('#edt-amt').val();
              if(amt == $("#amt-"+arg).text()){
                return 0;
              }
              var sum = $('#sum').text();
              var sum_o = $('#cost-'+arg).text()*$("#amt-"+arg).text();
              var sum_n = $('#cost-'+arg).text()*amt;
              var sumsum = (sum-sum_o)+sum_n;            
              $('#total-'+arg).text(sum_n);
              $('#sum').text(sumsum);             
              $("#amt-"+arg).text(amt);   
            }
          },ยกเลิก: function () {
              //$(".jconfirm .jconfirm-box").css('margin-bottom', '5%');
            }
        }
      });
    }

    function edit_warehouse(){
      $("style").append('.jconfirm .jconfirm-box{max-height: 420px;}');
        $.confirm({
          title: 'โกดัง',
          content: '<hr style="width: 80%; margin-bottom: 0;">',
          backgroundDismiss: true,
          onOpenBefore: function () {
            $(".jconfirm-buttons .btn-default").remove();
            //ajax and apeend
            $.ajax({
              type: "GET",
              url:localStorage.pathServer + "php/get_ware.php",                            
              beforeSend: function(){
                  $(".overlay").prop('hidden', false);
              },             
              success: function(data){  
                $(".overlay").prop('hidden', true);
                var obj = jQuery.parseJSON(data); 
                if(obj){
                  $.each(obj, function(i, field){
                    $(".jconfirm-buttons").append('<button id="li-ware-'+i+'" type="button" onclick="setware('+i+')" class="btn btn-choice">'+obj[i].ware_name+'</button>' +
                      '<span id="id-ware-'+i+'" hidden>'+obj[i].ware_id+'</span>');
                  }); 
                }else{
                  $(".jconfirm-buttons").append("กรุณาเพิ่มโกดังก่อนทำรายการ");;  
                }
              }               
            });              
          },
          onDestroy: function () {
            $("style").append('.jconfirm .jconfirm-box{margin-bottom: 5%;}');
            $("style").append('.jconfirm .jconfirm-box{max-height: 100%;}');
          }             
        });
    }

    var ware_id;
    function setware(arg) {
      $("#warehouse").text($("#li-ware-" + arg).text());    
      ware_id = $("#id-ware-" + arg).text();
      document.elementFromPoint(0, 0).click();
    }

    function save(){
      arr_data = [];
      var f = false;
      if(ware_id == ware_id_o){        
        f = true;       
      }
      var ch = 0;
      for(var i = 0;i < arr.length;i++){       
        if($("#amt-"+(i+1)).text() == arr[i]){
          ch++;
          item = {}            
          item ["item_id"] = i+1;
          item ["amt"] =  $("#amt-"+(i+1)).text();
          item ["ch"] = 0;
          arr_data.push(item); 
        }else{
          item = {}            
          item ["item_id"] = i+1;
          item ["amt"] =  $("#amt-"+(i+1)).text();
          item ["ch"] = 1;
          arr_data.push(item); 
        }         
      }        
      if(ch == arr.length && f){
        return 0;
      }      
      var json_string = JSON.stringify(arr_data); 
      var dataString =  "JSON=" + json_string + "&imp_id=" + imp_id + "&ware_id=" + ware_id + "&sum=" + $('#sum').text();     
      //alert(dataString);
      $.ajax({
        type: "POST",
        url:localStorage.pathServer + "php/rename_import.php",         
        data: dataString,
        beforeSend: function(){
          $(".overlay").prop('hidden', false);
        },                       
        success: function(data){ 
          $(".overlay").prop('hidden', true);                     
          if(data == "success"){                    
            location.reload();
          }else{
            $.confirm({
              title: 'พบข้อผิดพลาด',
              content: 'ลองอีกครั้ง',
              backgroundDismiss: true,
              buttons: {
                  formSubmit: {
                  text: 'ตกลง',
                  btnClass: 'btn-regis',
                  action: function () {
                  }
                  }
              }
            });
          }                         
        }               
      });
    }

  </script>
</head>

<body>
  <!-- Loading -->
  <div class="overlay" hidden><div class="loading"></div></div> 

  <!-- big container -->
  <div id="big-ctn" class="container justify-content-center">
    <!-- Nav menu top -->
    <div class="row navs align-items-center fixed-top justify-content-center">
      <div id="col-back" class="col-2 text-center" onclick="window.location = 'manage_import.html';">
        <i id="i-back" class="fas fa-angle-left"></i>
      </div>
      <div class="col-8 text-center">
        <h5 id="h5-title">S18-00001</h5>
      </div>
      <div class="col-2 text-right" style="cursor: pointer;">
        <i id="i-save" class="fa fa-save" style="font-size: 20px; color: #ffffff; margin-top: 3px;"></i>
      </div>
    </div>


    <div class="row fixed-top" style="margin-top: 4.5em;">
      <div class="col-12 text-center"><h5 id="warehouse">-</h5></div>
      <div class="col-12 text-center"><h5 id="date">-</h5></div>
      <hr>
      <div class="col-12 text-center"><h5 class="underline">รายการ</h5></div>
    </div>

    <div id="in-ctn" class="container-fullwidth" style="height: calc(100vh - (12em+120px)) !important; margin-top: 12em !important;">
    </div>
  </div>
  <!-- End big container -->

  <!-- Nav menu bottom -->
  <div class="fixed-bottom">
    <div class="nav-bottom-item" onclick="window.location = 'index.html';">
      <i id="i-home" class="fas fa-home menu"></i>
    </div>
    <div class="nav-bottom-item" onclick="menu('edit')">
      <i id="i-edit" class="fas fa-edit menu"></i>
    </div>
    <div class="nav-bottom-item" onclick="menu('del')">
      <i id="i-del" class="fa fa-trash-alt menu"></i>
    </div>
  </div>
  <!-- End Nav menu bottom -->
  <script>
    //Touch animation
    $(".mbtn").on("touchstart", function() {
      $(this).addClass('mbtn-touch');
    });
    $(".mbtn").on("touchend", function() {
      $(this).removeClass('mbtn-touch');
    });
    $(".mbtn-green").on("touchstart", function() {
      $(this).addClass('mbtn-green-touch');
    });
    $(".mbtn-green").on("touchend", function() {
      $(this).removeClass('mbtn-green-touch');
    });
    $(".select_folder").on("touchstart", function() {
      $(this).addClass('select_folder-touch');
    });
    $(".select_folder").on("touchend", function() {
      $(this).removeClass('select_folder-touch');
    });

      var viewer = ImageViewer();
      $('#img').click(function () {
          alert("click");
          var imgSrc = this.src;
          viewer.show(imgSrc);
      });
    });*/
  </script>
</body>
