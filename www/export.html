<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
    <title>เบิกสินค้าออกโกดัง - DDCAR</title>
    <!-- Local Assets -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/svg-with-js.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/jquery-confirm.css">
    <link rel="stylesheet" href="css/loading.css">

    <script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
    <script type="text/javascript" src="js/jquery-ui.min.js"></script>
    <script type="text/javascript" src="js/jquery.easing.1.3.min.js"></script>
    <script type="text/javascript" src="js/jquery-confirm.js"></script>
    <script type="text/javascript" src="js/popper.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.min.js"></script>
    <script defer src="js/fontawesome-all.js"></script>
    <script type="text/javascript" src="js/scanqr.js"></script>

    <!-- Font -->

    <style>
        #title {
            color: #666666;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .pdlr {
            padding-left: 10%;
            padding-right: 10%;
        }
        .fade {
            animation-duration: 1.25s;
            animation-name: fade;
            animation-direction: alternate-reverse;
            animation-iteration-count: infinite;
        }
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }     
    
        @-webkit-keyframes fade {
            from {opacity: 0.55; } 
            to {opacity: 1;}
        }

        #search-ctn{
            overflow: hidden; overflow-x: hidden !important; height: 100%;
        }

    <script>
        var prod_id;     
        var img,min; 
        var bool = true;   
        $(document).ready(function () { 
            url = new URL(window.location.href);
            prod_id = url.searchParams.get("product");  

            if(localStorage.user_role == "พนักงาน"){				
				$("#div-cost").prop('hidden', true);
            }

            if(localStorage.ware_id_ex){
                $("#h5-title").removeClass('fade'); 
                $("#h5-title").css('padding-left', '15%');
                $("#h5-title").removeClass('text-right');
                $("#h5-title").addClass('text-center');             
                $("#h5-title").text(localStorage.ware_name_ex);
            }
            if(localStorage.arr_ex){
                var retrievedObject = localStorage.getItem('arr_ex');
                var arr_data = JSON.parse(retrievedObject);             
                $('#check-export').text(arr_data.length);   
                $("#h5-title").prop('onclick',"");    
            }
            if(prod_id){
                get_prod(prod_id);
            } 
            if(localStorage.arr_prod_e){
                $("#btn-folder").attr('disabled',true);           
                $("#btn-addpic").attr('disabled',true);
                $("#name").attr('disabled',true);
                var retrievedObject = localStorage.getItem('arr_prod_e');
                var arr_data = JSON.parse(retrievedObject); 
                prod_id = arr_data[0].prod_id;            
                get_prod(prod_id);
            }  
            if(localStorage.bell){
                $('.dot').prop('hidden',false);
            }

            // Live autocomplete input listener (requires at least 2 characters)
            var exportSearchTimer = null;
            $('#search_prod').on('input', function() {
                var q = $(this).val().trim();
                if (exportSearchTimer) clearTimeout(exportSearchTimer);
                if (q.length >= 2) {
                    exportSearchTimer = setTimeout(function() {
                        search_prod_instant(q);
                    }, 350);
                } else {
                    $('#myUL').empty();
                }
            });
        });

        $(document).keydown(function(objEvent) {
            if (objEvent.keyCode == 13) {  //enter pressed
                objEvent.preventDefault();
                var $this = $(objEvent.target);
                var i_enter = parseFloat($this.attr('data-index'));                      
                if(i_enter == 1){
                    search_prod();
                }else if(i_enter == 2){
                    add_export();
                }                        
            }         
        })

        function get_prod(id){
            prod_id = id;
            bool = true;
            if(localStorage.arr_ex){
                var retrievedObject = localStorage.getItem('arr_ex');
                var arr_data = JSON.parse(retrievedObject);                 
                for(var b = 0; b < arr_data.length; b++){
                    if(prod_id == arr_data[b].prod_id){
                        $.confirm({
                            title: 'เตือน',
                            content: 'มีการเพิ่มสินค้า ' + arr_data[b].name + ' กรุณาแก้ไขที่จำนวนของสินค้าที่ได้เพิ่มแล้ว',
                            backgroundDismiss: true,
                            buttons: {
                                formSubmit: {
                                text: 'ตกลง',
                                btnClass: 'btn-regis',
                                action: function () {
                                }
                                }
                            }
                        });  
                        bool = false;                               
                        break;           
                    }
                }                 
            }
            if(bool){
                $.ajax({
                    type: "POST",
                    url:localStorage.pathServer + "php/get_prod_bk.php",    
                    data:{'prod_id' : id, 'ware_id' : localStorage.ware_id_ex},
                    //async: false,                       
                    beforeSend: function(){
                        $(".overlay").prop('hidden', false);
                    },             
                    success: function(data){  
                        $(".overlay").prop('hidden', true);
                        var obj = jQuery.parseJSON(data);                                         
                        $.each(obj, function(i, field){
                            $('#name').val(obj[i].prod_name);
                            $('#barcode').val(obj[i].prod_code); 
                            $('#cost').val(obj[i].prod_cost);                       
                            img = obj[i].img;    
                            min = obj[i].min_amount;
                            if(min <= 0){
                                $.confirm({
                                    title: 'เตือน',
                                    content: 'สินค้าไม่มีใน' + $('#h5-title').text(),
                                    backgroundDismiss: true,
                                    buttons: {
                                        formSubmit: {
                                        text: 'ตกลง',
                                        btnClass: 'btn-regis',
                                        action: function () {
                                        }
                                        }
                                    }
                                });  
                                set_default();
                                if(localStorage.arr_prod_e){
                                    bool = false;                       
                                    add_export('dup');
                                }  
                            }	                           
                        });
                        show();                                        
                    }               
                }); 
            }else{
                add_export('dup');
            }                        
        }

        async function scanqr() {
            if ($("#h5-title").text() == "เลือกโกดัง(ออก)") {
                $.confirm({
                    title: 'เตือน',
                    content: 'กรุณาเลือกโกดัง',
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                            text: 'ตกลง',
                            btnClass: 'btn-regis',
                            action: function () {}
                        }
                    }
                });  
                return 0;
            }
            const CapacitorBarcodeScanner = window.Capacitor?.Plugins?.CapacitorBarcodeScanner || window.CapacitorBarcodeScanner;
            try {
                // เรียกใช้ Capacitor Barcode Scanner แทน Cordova
                const result = await CapacitorBarcodeScanner.scanBarcode({
                    hint: 0, // 0 หมายถึง QR_CODE (ตาม Enum Html5QrcodeSupportedFormats.QR_CODE)
                    scanInstructions: "วางคิวอาโค้ดภายในสี่เหลี่ยมผืนผ้าที่ช่องมองภาพเพื่อแสกน"
                });

            // เช็กว่ามีค่า ScanResult ส่งกลับมาหรือไม่ (ถ้าผู้ใช้ยกเลิก ScanResult จะเป็นค่าว่างหรือ undefined)
            if (result && result.ScanResult) {
                var value = result.ScanResult; // ข้อความ/เนื้อหาที่สแกนได้จาก QR Code
                
                var bool = true;
                if (localStorage.arr_ex) {
                    var retrievedObject = localStorage.getItem('arr_ex');
                    var arr_data = JSON.parse(retrievedObject);
                    for (var b = 0; b < arr_data.length; b++) {
                        if (value == arr_data[b].qr) {
                            $.confirm({
                                title: 'เตือน',
                                content: 'มีการเพิ่มสินค้า ' + arr_data[b].name + ' กรุณาแก้ไขที่จำนวนของสินค้าที่ได้เพิ่มแล้ว',
                                backgroundDismiss: true,
                                buttons: {
                                    formSubmit: {
                                        text: 'ตกลง',
                                        btnClass: 'btn-regis',
                                        action: function () {}
                                    }
                                }
                            });  
                            bool = false;                               
                            break;           
                        }
                    }                 
                }  

                if (bool) {                    
                    $.ajax({
                        type: "POST",
                        url: localStorage.pathServer + "php/get_prod_bk.php",                
                        data: { 'qr': value, 'ware_id': localStorage.ware_id_ex },             
                        beforeSend: function() {
                            $(".overlay").prop('hidden', false);
                        },             
                        success: function(data) {  
                            $(".overlay").prop('hidden', true);                             
                            var obj = jQuery.parseJSON(data); 
                            $.each(obj, function(i, field) {                                           
                                $('#name').val(obj[i].prod_name);
                                $('#barcode').val(obj[i].prod_code); 
                                $('#cost').val(obj[i].prod_cost);                       
                                img = obj[i].img;                                             
                                prod_id = obj[i].prod_id;      
                                min = obj[i].min_amount;
                                if (min <= 0) {
                                    $.confirm({
                                        title: 'เตือน',
                                        content: 'สินค้าไม่มีใน' + $('#h5-title').text(),
                                        backgroundDismiss: true,
                                        buttons: {
                                            formSubmit: {
                                                text: 'ตกลง',
                                                btnClass: 'btn-regis',
                                                action: function () {}
                                            }
                                        }
                                    });  
                                    set_default();                                                
                                }	 
                            });                                                                                      
                        }               
                    });
                }

                var temp = $('#amount').val();           
                $("#amount").focus().val("").val(temp);
            } else {
                // กรณีผู้ใช้กดปิด/ยกเลิกการสแกน
                // alert("The user has dismissed the scan");
            }

            } catch (error) {
                // จัดการกรณีเกิด Error หรือผู้ใช้ปฏิเสธสิทธิ์การเข้าถึงกล้อง
                $.confirm({
                    title: 'พบข้อผิดพลาด',
                    content: 'กรุณากรอกข้อมูลให้ครบ หรือตรวจสอบการอนุญาตเข้าถึงกล้อง',
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                            text: 'ตกลง',
                            btnClass: 'btn-regis',
                            action: function () {}
                        }
                    }
                });
            }
        }

        function edit_amt(){
			var amt = parseInt($('#amount').val());
			if(amt > parseInt(min)){
				$.confirm({
					title: 'เตือน',
					content: 'สินค้ามีจำนวนไม่พอใน' + $('#h5-title').text() + ' สินค้ามีจำนวน ' + min,
					backgroundDismiss: true,
					buttons: {
						formSubmit: {
						text: 'ตกลง',
						btnClass: 'btn-regis',
						action: function () {
						}
						}
					}
				});  
				$("#btn-add").attr('disabled',true);
			}else{
				$("#btn-add").attr('disabled',false);
			}	
		}

        function add_export(arg){
            var code = $('#barcode').val();
            var cost = $('#cost').val(); 
            var name  = $('#name').val();
            var amt = $('#amount').val();      
            if(arg != 'dup'){
                if(name == "" || amt == "" || code == "" || cost == "" || $("#h5-title").text() == "เลือกโกดัง(ออก)"){
                    $.confirm({
                    title: 'พบข้อผิดพลาด',
                    content: 'กรุณากรอกข้อมูลให้ครบ',
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                        text: 'ตกลง',
                        btnClass: 'btn-regis',
                        action: function () {
                        }
                        }
                    }
                    });
                    return 0;
                }                 
                if(localStorage.arr_ex){
                    var retrievedObject = localStorage.getItem('arr_ex');
                    var arr_data = JSON.parse(retrievedObject);               
                }else{
                    var arr_data = [];              
                }           
                item = {}            
                item ["qr"] =  code;
                item ["prod_id"] =  prod_id;
                item ["name"] =  name;
                item ["cost"] =  cost;               
                item ["amt"] =  amt;
                item ["img"] =  img;  
                item ["min"] =  min;   

                arr_data.push(item); 
                localStorage.setItem('arr_ex', JSON.stringify(arr_data));         
            
                $('#check-export').text(arr_data.length);    
                $("#h5-title").prop('onclick',"");   
            } 
            $('#barcode').val("");
            $('#name').val("");
            $('#cost').val("");                
            $('#amount').val("1"); 
            if(localStorage.arr_prod_e){
                var retrievedObject = localStorage.getItem('arr_prod_e');
                var arr_data2 = JSON.parse(retrievedObject);
                arr_data2.splice(0,1); 
                localStorage.setItem('arr_prod_e', JSON.stringify(arr_data2));  
                if(arr_data2.length == 0){
                    localStorage.arr_prod_e = "";  
                }                                 
            }  
            if(localStorage.arr_prod_e){                    
                var retrievedObject = localStorage.getItem('arr_prod_e');
                var arr_data2 = JSON.parse(retrievedObject);                                   
                prod_id = arr_data2[0].prod_id;            
                get_prod(prod_id);            
            }else{                   
                $("#btn-folder").removeAttr('disabled');           
                $("#btn-addpic").removeAttr('disabled');
                $("#name").removeAttr('disabled');
            }                
        }

            nav_menu = ['home', 'bell', 'qrcode', 'bars'];
            for (i = 0; i < 4; i++) {

        function selectfolder() {
            if($("#h5-title").text() == "เลือกโกดัง(ออก)"){
                $.confirm({
                    title: 'เตือน',
                    content: 'กรุณาเลือกโกดัง',
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                        text: 'ตกลง',
                        btnClass: 'btn-regis',
                        action: function () {
                        }
                        }
                    }
                });  
                return 0;
            }
            goto = "select_folder.html?from=export";
            
            window.location = goto;
        }

        function check() {
            goto = "export_check.html";
            
            window.location = goto;
        }
        
        function setware(arg) {
            $("#h5-title").removeClass('fade');
            $("#h5-title").css('padding-left', '15%');
            $("#h5-title").removeClass('text-right');
            $("#h5-title").addClass('text-center');
            localStorage.ware_name_ex = $("#li-ware-" + arg).text();
            $("#h5-title").text(localStorage.ware_name_ex);
            //$("#ware").val(ware);
            localStorage.ware_id_ex = $("#id-ware-" + arg).text();
            document.elementFromPoint(0, 0).click();
            if($('#name').val() != ""){
                $.ajax({
                    type: "POST",
                    url:localStorage.pathServer + "php/get_prod_bk.php",    
                    data:{'prod_id' : prod_id, 'ware_id' : localStorage.ware_id_ex},
                    //async: false,                       
                    beforeSend: function(){
                        $(".overlay").prop('hidden', false);
                    },             
                    success: function(data){  
                        $(".overlay").prop('hidden', true);
                        var obj = jQuery.parseJSON(data);                                         
                        $.each(obj, function(i, field){                      
                            min = obj[i].min_amount;
                            if(min == 0){
                                $.confirm({
                                    title: 'เตือน',
                                    content: 'สินค้าไม่มีใน' + $('#h5-title').text(),
                                    backgroundDismiss: true,
                                    buttons: {
                                        formSubmit: {
                                        text: 'ตกลง',
                                        btnClass: 'btn-regis',
                                        action: function () {
                                        }
                                        }
                                    }
                                });                            
                                if(localStorage.arr_prod_e){
                                    add_export('dup');
                                }else{
                                    set_default();
                                }
                            }	                           
                        });
                        show();                                        
                    }               
                });   
            }           
        }

        function showware(){
            $("style").append('.jconfirm .jconfirm-box{max-height: 420px;}');
            var text_html = "";
            $.ajax({
                type: "GET",
                url:localStorage.pathServer + "php/get_ware.php",                            
                beforeSend: function(){
                    $(".overlay").prop('hidden', false);
                },             
                success: function(data){  
                $(".overlay").prop('hidden', true);
                var obj = jQuery.parseJSON(data);  
                if(obj){
                    $.each(obj, function(i, field){
                        text_html = text_html + '<button id="li-ware-'+i+'" type="button" onclick="setware('+i+')" class="btn btn-choice">'+obj[i].ware_name+'</button>' +
                        '<span id="id-ware-'+i+'" hidden>'+obj[i].ware_id+'</span>';                             
                    }); 
                }else{
                    text_html = "กรุณาเพิ่มโกดังก่อนทำรายการ";  
                }     
                $.confirm({
                    title: 'โกดัง',
                    content: '<hr style="width: 80%; margin-bottom: 0;">',
                    backgroundDismiss: true,
                    onOpenBefore: function () {
                    $(".jconfirm-buttons .btn-default").remove();
                    $(".jconfirm-buttons").append(text_html);
                    //ajax and apeend
                                    
                    },
                    onDestroy: function () {
                    $("style").append('.jconfirm .jconfirm-box{margin-bottom: 5%;}');
                    $("style").append('.jconfirm .jconfirm-box{max-height: 100%;}');
                    }              
                });                                       
                }               
            });  
        }

        function search_prod(){
            var val = $('#search_prod').val().trim();
            if(val == "") return 0;
            $('#search_prod').blur();
            search_prod_instant(val);
        }

        function search_prod_instant(val){
            if(!val || val.trim() === ""){
                $('#myUL').empty();
                return;
            }       
            $.ajax({
                type: "POST",
                url: localStorage.pathServer + "php/search_prod.php",
                data: {'phrase' : val},
                cache: false,
                success: function(data){  
                    var obj = window.safeParseJSON(data);
                    $('#myUL').empty();
                    if(obj && obj.length > 0){
                        $.each(obj, function(i, field){ 
                            var codeDisplay = field.prod_code ? field.prod_code : '-';
                            $('#myUL').append(
                                '<li style="padding: 10px 4px; border-bottom: 1px solid #f1f5f9;">' +
                                  '<div class="row align-items-center" onclick="get_prod('+field.prod_id+')" style="cursor: pointer;">' +
                                    '<div class="col-4 text-center">' +
                                      '<span class="badge badge-light border" style="font-size: 0.85rem; font-weight: 700; color: #1e293b;">'+codeDisplay+'</span>' +
                                    '</div>' +
                                    '<div class="col-8 text-left">' +
                                      '<div style="font-weight: 600; color: #0f172a; font-size: 0.95rem;">'+field.prod_name+'</div>' +
                                    '</div>' +
                                  '</div>' +
                                '</li>'
                            );        
                        }); 
                    } else {
                        $('#myUL').append('<li class="text-center p-4 text-muted">ไม่พบสินค้าที่ตรงกับการค้นหา</li>');
                    }                                                                                                                                        
                }               
            }); 
        }
     
        function search(){
            if($("#h5-title").text() == "เลือกโกดัง(ออก)"){
                $.confirm({
                    title: 'เตือน',
                    content: 'กรุณาเลือกโกดัง',
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                        text: 'ตกลง',
                        btnClass: 'btn-regis',
                        action: function () {
                        }
                        }
                    }
                });  
                return 0;
            }
            $("#search-ctn").prop('hidden', false);
            $("#big-ctn").prop('hidden', true);
            $("#navs-bttm").prop('hidden', true);
            $("#col-back").attr('onclick', 'show()');            
        }

        function show(){
            $("#search-ctn").prop('hidden', true);
            $("#big-ctn").prop('hidden', false);
            $("#navs-bttm").prop('hidden', false);
            $("#col-back").attr('onclick', 'window.location = "index.html";');
            $('#myUL').empty();
            $('#search_prod').val("");
            var temp = $('#amount').val();           
            //$("#amount").focus().val("").val(temp);
        } 

        function set_default(){
			$('#barcode').val("");
			$('#name').val("");			
			$('#cost').val("");			
			$('#amount').val("1");		
			$('#name').focus();			
		}

        function resetExportAll() {
            $.confirm({
                title: 'ยืนยันล้างข้อมูลทั้งหมด',
                content: 'ต้องการล้างข้อมูลทั้งหมดในหน้านี้ (รวมถึงรายการเบิกออกทั้งหมดที่เพิ่มไว้) หรือไม่?',
                backgroundDismiss: true,
                buttons: {
                    confirm: {
                        text: 'ล้างข้อมูลทั้งหมด',
                        btnClass: 'btn-danger',
                        action: function() {
                            set_default();
                            prod_id = "";
                            img = "";
                            min = "";
                            bool = true;
                            $('#check-export').text('0');
                            localStorage.removeItem('arr_ex');
                            localStorage.removeItem('arr_prod_e');
                            $("#btn-folder").removeAttr('disabled');
                            $("#name").removeAttr('disabled');
                            $("#btn-addpic").removeAttr('disabled');
                            $("#h5-title").attr('onclick', 'showware();');
                            try {
                                window.history.replaceState({}, document.title, window.location.pathname);
                            } catch(e) {}
                        }
                    },
                    cancel: { text: 'ยกเลิก' }
                }
            });
        }

    </script>

<body>
    <!-- Loading -->
    <div class="overlay" hidden><div class="loading"></div></div> 

    <!-- Search ctn -->
    <div id="search-ctn" class="container justify-content-center" hidden>
        <div class="row mgem1o5" style="margin-top: 15px;">
            <div class="col-12 text-center">
                <input id="search_prod" type="search" class="form-control form-control-lg text-center" placeholder="ค้นหาสินค้า" autofocus data-index="1">
            </div>  
        </div>
        <div id="add_ctn" class="container" style="overflow-x: hidden !important; overflow-y: auto; height: calc(100vh - 140px) !important;">
            <ul id="myUL">
            </ul>            
        </div>
    </div>

    <!-- big container -->
