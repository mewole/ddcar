<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Home</title>
  <!-- Bootstrap Import -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
  <script type="text/javascript" src="js/jquery-ui.min.js"></script>
  <script type="text/javascript" src="js/jquery.easing.1.3.min.js"></script>
  <script type="text/javascript" src="js/config.js"></script>
  
  <script type="text/javascript" src="js/jquery-confirm.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.6/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
  <script defer src="https://use.fontawesome.com/releases/v5.0.8/js/all.js"></script>
  <script src="cordova.js"></script>
  <script type="text/javascript" src="js/scanqr.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.0/jquery-confirm.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.0/jquery-confirm.min.js"></script>
 
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/jquery-confirm.css">
  <link rel="stylesheet" href="css/loading.css">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css?family=Prompt" rel="stylesheet">

  <!-- DatePicker -->
  <link rel="stylesheet" href="css/duDatepicker.css">
  <script src="js/duDatepicker.js"></script>

  <style>
    hr{
      margin-top: 0;
    }  
    ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }
    .btn-default{
      outline: none !important;
      box-shadow: none !important;
    }
    #title{
      color: #666;
      letter-spacing: 1px;
      font-weight: bold;
    }  
  </style>

  <script>
    var start = start_d = start_s = 0;
    var bool = bool_d = bool_s = false;    
    $(document).ready(function(){
      if(localStorage.bell){
          $('.dot').prop('hidden',false);
      }  
      $('#datepicker-from').duDatepicker(({format: 'dd/mm/yy', theme: 'red', cancelBtn: true, maxDate: "today"})).on('datechanged', function(e){
        console.log(e.date);
        $("#date").text(e.date);
        if(e.date != null){
          e.date = new Date();
        }
        $("#datepicker-to").trigger('click');
      });

      $('#datepicker-to').duDatepicker(({format: 'dd/mm/yy', theme: 'red', cancelBtn: true, maxDate: "today"})).on('datechanged', function(e){
        console.log(e.date);
        $("#date").append(" - " + e.date);
        $("#date_row").prop('hidden', false);
        $("#search_row").prop('hidden', true);
        localStorage.myS = '';
        localStorage.myD = '';
        items = "";
        start_d = 0;
        bool_d = false;
        $("#myS").prop('hidden', true);
        $("#myUL").prop('hidden', true);
        $("#myD").prop('hidden', false);
        $("#myD").empty();
        $("#i-back").attr("onclick","showUL()");
        tempdate = ""
        no = 1
        search_date();
      });  
      get_bill();

      if(localStorage.myS){
        var retrievedObject = localStorage.getItem('myS');
        var data = JSON.parse(retrievedObject)
        items = data[0].html
        start_s = data[0].start_s
        show_search()
        $("#myS").prop('hidden', false);
        $("#myUL").prop('hidden', true);
        $("#myD").prop('hidden', true);        
        $("#i-back").attr("onclick","showUL()");
        $('#myS').append(items)
      }else if(localStorage.myD){
        var retrievedObject = localStorage.getItem('myD');
        var data = JSON.parse(retrievedObject)
        items = data[0].html
        start_d = data[0].start_d
        show_search()
        $("#myS").prop('hidden', true);
        $("#myUL").prop('hidden', true);
        $("#myD").prop('hidden', false);        
        $("#i-back").attr("onclick","showUL()");
        $('#myD').append(items)
      }  

      //scroll to bottom
      var total_height = $("#in-ctn").height();
      var temp_hight = $("#in-ctn").height();
      $("#in-ctn").scroll(function() {
        if($("#in-ctn").scrollTop() > total_height) {  

          //total_height = total_height + $("#in-ctn").scrollTop();
          total_height += temp_hight;

          if(!$("#myUL").prop('hidden')){
            if(bool){
              return 0;
            }
            get_bill();            
          }else if(!$("#myD").prop('hidden')){
            if(bool_d){
              return 0;
            }
            search_date();
          }else if(!$("#myS").prop('hidden')){
            if(bool_s){
              return 0;
            }
            get_bill_s();
          }
        }
      });
    });

    $(document).keydown(function(objEvent) {
      if (objEvent.keyCode == 13) {  //enter pressed
        objEvent.preventDefault();           
        search();        
      }         
    })

    function showUL(){
      localStorage.myS = '';
      localStorage.myD = '';
      $("#myS").prop('hidden', true);
      $("#myUL").prop('hidden', false);
      $("#myD").prop('hidden', true);
      // $("#search_row").prop('hidden', true);
      // $("#date_row").prop('hidden', true);
      $("#i-back").attr("onclick","window.location = 'index.html';");
      show_search();
    }

    var tempdate,no = 1
    function get_bill(){
      $.ajax({
        type: "POST",
        url:localStorage.pathServer + "php/get_bill.php",
        data: {'start': start},
        beforeSend: function(){
            $(".overlay").prop('hidden', false);
        },                       
        success: function(data){ 
          $(".overlay").prop('hidden', true);  
          var obj = jQuery.parseJSON(data);
          if(obj[0] == "last"){
            bool = true
          }
          $.each(obj, function(i, field){
            if(i > 0){
              var txt = field.date_time.split(" ");
              var txt2 = txt[0].split("-");
              var date = txt2[2] + "/" + txt2[1] + "/" + txt2[0].substr(2);
              if(tempdate != date){
                  tempdate = date
                  no = 1
              }
              $('#myUL').append('<li class="mgemo5"><div class="row" onclick="bill_info('+field.order_id+')">' +
                  '<div class="col-2 text-center no-pd">' +
                    '<p>'+no+'</p>' +
                  '</div>' +
                  '<div class="col-4 text-center no-pd">' +
                    '<p>'+field.order_number+'</p>' +
                  '</div>' +
                  '<div class="col-2 text-center no-pd">' +
                    '<p>'+date+'</p>' +
                  '</div>' +
                  '<div class="col-4 text-center no-pd">' +
                    '<p>'+field.cus_name+'</p>' +
                  '</div>' +
                '</div><hr></li>');
                no++   
            }                                                
          });                                         
        }               
      });
      start += 30;
    }
    
    function bill_info(arg){
      if(!$("#myS").prop('hidden')){        
        json = [];
        item = {}
        item["html"] = items;
        item["start_s"] = start_s;
        json.push(item);
        localStorage.setItem("myS",JSON.stringify(json));
      }else if(!$("#myD").prop('hidden')){       
        json = [];
        item = {}
        item["html"] = items;
        item["start_d"] = start_d;
        json.push(item);
        localStorage.setItem("myD",JSON.stringify(json));
      }
      
      window.location = 'bill_info.html?id='+arg;
    }

    function show_search(){
      if($("#search_row").is(':visible')){
        $("#search_row").prop('hidden', true);
        if(!$("#myD").prop('hidden')){
          $("#date_row").prop('hidden', false);
        }

         $("#row-title").css("margin-top", "4.5em");
         $("#title-hr").css("margin-top", "6.3em");
         $("#in-ctn").css("height", "calc(100vh - (4.5em + 120px))");
      }else{
        $("#search_row").prop('hidden', false);
        $("#date_row").prop('hidden', true);

        $("#row-title").css("margin-top", "8.5em");
        $("#title-hr").css("margin-top", "10.3em");
        $("#in-ctn").css("height", "calc(100vh - (8.9em + 120px))");
      }
    }
   
    var val;
    function search(){
      if($('#search_bill').val() == ""){
        return 0;
      }
      localStorage.myS = '';
      localStorage.myD = '';
      items = "";      
      $('#search_bill').blur();
      val = $('#search_bill').val();
      start_s = 0;
      bool_s = false;
      $("#myS").prop('hidden', false);
      $("#myUL").prop('hidden', true);
      $("#myD").prop('hidden', true);
      $("#myS").empty();
      $("#i-back").attr("onclick","showUL()");
      tempdate = ""
      no = 1
      get_bill_s();
    }
    
    var items = "";
    function get_bill_s(){
      $.ajax({
        type: "POST",
        url:localStorage.pathServer + "php/get_bill.php",
        data: {'start': start_s, 'value' : val},
        beforeSend: function(){
            $(".overlay").prop('hidden', false);
        },                       
        success: function(data){ 
          $(".overlay").prop('hidden', true);  
          var obj = jQuery.parseJSON(data);
          if(obj[0] == "last"){
            bool_s = true
          }
          $.each(obj, function(i, field){
            if(i > 0){
              var txt = field.date_time.split(" ");
              var txt2 = txt[0].split("-");
              var date = txt2[2] + "/" + txt2[1] + "/" + txt2[0].substr(2);
              if(tempdate != date){
                  tempdate = date
                  no = 1
              }
              items = items + '<li class="mgemo5"><div class="row" onclick="bill_info('+field.order_id+')">' +
                '<div class="col-2 text-center no-pd">' +
                    '<p>'+no+'</p>' +
                  '</div>' +
                  '<div class="col-4 text-center no-pd">' +
                    '<p>'+field.order_number+'</p>' +
                  '</div>' +
                  '<div class="col-2 text-center no-pd">' +
                    '<p>'+date+'</p>' +
                  '</div>' +
                  '<div class="col-4 text-center no-pd">' +
                    '<p>'+field.cus_name+'</p>' +
                  '</div>' +
                '</div><hr></li>'
                $('#myS').append('<li class="mgemo5"><div class="row" onclick="bill_info('+field.order_id+')">' +
                  '<div class="col-2 text-center no-pd">' +
                    '<p>'+no+'</p>' +
                  '</div>' +
                  '<div class="col-4 text-center no-pd">' +
                    '<p>'+field.order_number+'</p>' +
                  '</div>' +
                  '<div class="col-2 text-center no-pd">' +
                    '<p>'+date+'</p>' +
                  '</div>' +
                  '<div class="col-4 text-center no-pd">' +
                    '<p>'+field.cus_name+'</p>' +
                  '</div>' +
                '</div><hr></li>');
                no++
            }                                                
          });
          
        }               
      });
      start_s += 30;      
    }

    function search_date(){
      txt = $("#date").text().split("-");
      temp = txt[0].split("/");
      date =  "20" + temp[2] + "-" + temp[1] + "-" + temp[0];
      date = date.replace(/\s+/g, '');
      date = date + " 00:00:00";
      
      temp = txt[1].split("/");
      date_to =  "20" + temp[2] + "-" + temp[1] + "-" + temp[0];
      date_to = date_to.replace(/\s+/g, '');
      date_to = date_to + " 23:59:59";     

      $.ajax({
        type: "POST",
        url:localStorage.pathServer + "php/get_bill.php",         
        data:{'date' : date, 'date_to' : date_to ,'start' : start_d},
        beforeSend: function(){
          $(".overlay").prop('hidden', false);
        },                       
        success: function(data){ 
          $(".overlay").prop('hidden', true);  
          var obj = jQuery.parseJSON(data);
          if(obj[0] == "last"){
            bool_d = true;
          }                         
          $.each(obj, function(i, field){
            if(i > 0){
              var txt = field.date_time.split(" ");
              var txt2 = txt[0].split("-");
              var date = txt2[2] + "/" + txt2[1] + "/" + txt2[0].substr(2);
              if(tempdate != date){
                  tempdate = date
                  no = 1
              }
              items = items + '<li class="mgemo5"><div class="row" onclick="bill_info('+field.order_id+')">' +
                '<div class="col-2 text-center no-pd">' +
                    '<p>'+no+'</p>' +
                  '</div>' +
                  '<div class="col-4 text-center no-pd">' +
                    '<p>'+field.order_number+'</p>' +
                  '</div>' +
                  '<div class="col-2 text-center no-pd">' +
                    '<p>'+date+'</p>' +
                  '</div>' +
                  '<div class="col-4 text-center no-pd">' +
                    '<p>'+field.cus_name+'</p>' +
                  '</div>' +
                '</div><hr></li>'
              $('#myD').append('<li class="mgemo5"><div class="row" onclick="bill_info('+field.order_id+')">' +
                '<div class="col-2 text-center no-pd">' +
                    '<p>'+no+'</p>' +
                  '</div>' +
                  '<div class="col-4 text-center no-pd">' +
                    '<p>'+field.order_number+'</p>' +
                  '</div>' +
                  '<div class="col-2 text-center no-pd">' +
                    '<p>'+date+'</p>' +
                  '</div>' +
                  '<div class="col-4 text-center no-pd">' +
                    '<p>'+field.cus_name+'</p>' +
                  '</div>' +
                '</div><hr></li>');
                no++
            }                                                
          });                                          
        }               
      });
      start_d += 30;
    }
  </script>
</head>

<body>
  <!-- Loading -->
  <div class="overlay" hidden><div class="loading"></div></div>  

  <div id="big-ctn" class="container-fullwidth justify-content-center">
    <!-- Nav menu top -->
    <div id="top-navs" class="row navs align-items-center mgem1o5 fixed-top">
      <div id="i-back" class="col-2 text-center" onclick="window.location ='index.html';">
        <i  class="fas fa-angle-left"></i>
      </div>
      <div class="col-8 text-center">
        <h5 id="h5-title">รายการบิล</h5>
      </div>
      <div class="col-1 text-right" onclick="show_search();">
        <i class="fas fa-search" style="color: white; font-size: 120%; margin-top: 2px;"></i>
      </div>
    </div>

    <div id="date_row" class="row mgem1o5 fixed-top" style="margin-top: 4.5em;" hidden>
      <div class="col-12 text-center">
        <h5 id="date"></h5>
      </div>
    </div>

    <div id="search_row" class="row mgem1o5 fixed-top" style="margin-top: 4.5em; padding-left: 1.5em; padding-right: 1.5em;" hidden>
      <div class="col-9">
        <input id="search_bill" type="search" class="form-control form-control-lg text-center" placeholder="เลขที่ / ลูกค้า">
      </div> 
      <div class="col-3">
        <button id="datepicker-from" class="mbtn" style="height: 90%; margin-top: 2px;">
          <i class="far fa-calendar-alt"></i>
        </button>
        <button id="datepicker-to" hidden></button>
      </div> 
    </div>

    <div id="row-title" class="row fixed-top" style="margin-top: 4.5em;">
      <div id="title" class="col-2 text-center">ที่</div>
      <div id="title" class="col-4 text-center">เลขที่</div>
      <div id="title" class="col-2 text-center nopd">วันที่</div>
      <div id="title" class="col-4 text-center nopd">ลูกค้า</div> 
    </div><hr id="title-hr" class="mgem1" style="margin-top: 6.3em; width: 98%;">


    <div id="in-ctn" class="container-fullwidth" style="margin-top: 0!important; height: calc(100vh - (4.5em + 120px));">
      <ul id="myUL">

      </ul>
      <ul id="myD" hidden>

      </ul>
      <ul id="myS" hidden>

      </ul>
    </div>
  </div>     
  <!-- End big container -->

  <!-- Nav menu bottom -->
  <div id="btm-navs" class="row fixed-bottom navs">
    <div class="col-3 text-center" onclick="window.location ='index.html?menu=3';">
      <i id="i-home" class="fas fa-home menu"></i>
    </div>
    <div class="col-3 text-center" onclick="window.location = 'bell.html'">
      <div class="dot" hidden></div>
      <i id="i-bell" class="fas fa-bell menu"></i>
    </div>
    <div class="col-3 text-center" onclick="scan();">
      <i id="i-qrcode" class="fas fa-qrcode menu"></i>
    </div>
    <div class="col-3 text-center" onclick="window.location = 'other.html'">
      <i id="i-bars" class="fa fa-bars menu"></i>
    </div>
  </div>
  <!-- End Nav menu bottom -->
  <script>
    //Touch animation
    $(".mbtn").on("touchstart", function() {
      $(this).addClass('mbtn-touch');
    });
    $(".mbtn").on("touchend", function() {
      $(this).removeClass('mbtn-touch');
    });
    $(".btn-default").on("touchstart", function() {
      $(this).css('background-color', '#c43f3f');
      $(this).css('border-color:', '#c43f3f');
    });
    $(".btn-default").on("touchend", function() {
      $(this).css('background-color', '#da4646');
      $(this).css('border-color:', '#d63232');
    });
  </script>
</body>

</html>
