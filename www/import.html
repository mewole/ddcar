<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
    <title>นำสินค้าเข้า - DDCAR</title>
    <!-- Local Assets -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
    <script type="text/javascript" src="js/jquery-ui.min.js"></script>
    <script type="text/javascript" src="js/jquery.easing.1.3.min.js"></script>
    <script type="text/javascript" src="js/jquery-confirm.js"></script>
    <script type="text/javascript" src="js/popper.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.min.js"></script>
    <script defer src="js/fontawesome-all.js"></script>
    <script type="text/javascript" src="js/scanqr.js"></script>
    <script type="text/javascript" src="js/config.js"></script>
    <script type="text/javascript" src="js/capacitor-bridge.js"></script>    

    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/popup.css">
    <link rel="stylesheet" href="css/jquery-confirm.css">
    <link rel="stylesheet" href="css/loading.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css?family=Prompt" rel="stylesheet">

    <style>
        #title {
            color: #666666;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .no-pd{
            padding-right: 5px;
            padding-left: 5px;
        }
        .fade {
            animation-duration: 1.25s;
            animation-name: fade;
            animation-direction: alternate-reverse;
            animation-iteration-count: infinite;
        }
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }     
    
        @-webkit-keyframes fade {
            from {opacity: 0.55; } 
            to {opacity: 1;}
        }
        #search-ctn{
            overflow: hidden; overflow-x: hidden !important; height: 100%;
        }
    </style>

    <script>      
        var prod_id;       
        var cost_o; 
        var flag = 0; 
        var img,min;   
        var bool = true; 
        $(document).ready(function () { 
            url = new URL(window.location.href);
            prod_id = url.searchParams.get("product");

            if(localStorage.ware_id_im){
                $("#h5-title").removeClass('fade');  
                $("#h5-title").css('padding-left', '15%');
                $("#h5-title").removeClass('text-right');
                $("#h5-title").addClass('text-center');            
                $("#h5-title").text(localStorage.ware_name_im);
            }
            if(localStorage.arr_prod){
                var retrievedObject = localStorage.getItem('arr_prod');
                var arr_data = JSON.parse(retrievedObject);             
                $('#check-import').text(arr_data.length); 
                $("#h5-title").prop('onclick',"");      
            }          
            if(prod_id){
                get_prod(prod_id);
            } 
            if(localStorage.arr_prod_i){
                $("#btn-folder").attr('disabled',true);
                $("#name").attr('disabled',true);           
                $("#btn-addpic").attr('disabled',true);
                var retrievedObject = localStorage.getItem('arr_prod_i');
                var arr_data = JSON.parse(retrievedObject); 
                prod_id = arr_data[0].prod_id;            
                get_prod(prod_id);
            } 
            if(localStorage.bell){
                $('.dot').prop('hidden',false);
            }       
        });

        $(document).keydown(function(objEvent) {
            if (objEvent.keyCode == 13) {  //enter pressed
                objEvent.preventDefault();
                var $this = $(objEvent.target);
                var i_enter = parseFloat($this.attr('data-index'));                      
                if(i_enter == 1){
                    search_prod();
                }else if(i_enter == 6){
                    add_import();
                }else{
                    var temp = $('[data-index="' + (i_enter+1).toString() + '"]').val();                  
                    $('[data-index="' + (i_enter+1).toString() + '"]').focus().val("").val(temp);
                }                       
            }         
        })

        async function scanqr() {
            if ($("#h5-title").text() == "เลือกโกดัง/หน้าร้าน") {
                $.confirm({
                    title: 'เตือน',
                    content: 'กรุณาเลือกโกดัง/หน้าร้าน',
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                            text: 'ตกลง',
                            btnClass: 'btn-regis',
                            action: function () {}
                        }
                    }
                });  
                return 0;
            }
            const CapacitorBarcodeScanner = window.Capacitor?.Plugins?.CapacitorBarcodeScanner || window.CapacitorBarcodeScanner;
            try {
                // เรียกใช้ Capacitor Barcode Scanner
                const result = await CapacitorBarcodeScanner.scanBarcode({
                    hint: 0, // 0 หมายถึง QR_CODE (Html5QrcodeSupportedFormats.QR_CODE)
                    scanInstructions: "วางคิวอาโค้ดภายในสี่เหลี่ยมผืนผ้าที่ช่องมองภาพเพื่อแสกน"
                });

                // เช็กว่าสแกนสำเร็จและมีค่าส่งกลับมาหรือไม่
                if (result && result.ScanResult) {
                    var value = result.ScanResult; // ข้อความที่สแกนได้จาก QR Code
                    
                    var bool = true;
                    if (localStorage.arr_prod) {
                        var retrievedObject = localStorage.getItem('arr_prod');
                        var arr_data = JSON.parse(retrievedObject);
                        for (var b = 0; b < arr_data.length; b++) {
                            if (value == arr_data[b].qr) {
                                $.confirm({
                                    title: 'เตือน',
                                    content: 'มีการเพิ่มสินค้า ' + arr_data[b].name + ' กรุณาแก้ไขที่จำนวนของสินค้าที่ได้เพิ่มแล้ว',
                                    backgroundDismiss: true,
                                    buttons: {
                                        formSubmit: {
                                            text: 'ตกลง',
                                            btnClass: 'btn-regis',
                                            action: function () {}
                                        }
                                    }
                                });  
                                bool = false;                               
                                break;           
                            }
                        }                 
                    }

                    if (bool) {
                        $.ajax({
                            type: "POST",
                            url: localStorage.pathServer + "php/get_prod.php",    
                            data: { 'qr': value, 'ware_id': localStorage.ware_id_im, 'type': localStorage.ware_type_im },                     
                            beforeSend: function () {
                                $(".overlay").prop('hidden', false);
                            },             
                            success: function (data) {  
                                $(".overlay").prop('hidden', true);
                                var obj = jQuery.parseJSON(data);                                         
                                $.each(obj, function (i, field) {
                                    $('#name').val(obj[i].prod_name);
                                    $('#barcode').val(obj[i].prod_code); 
                                    prod_id = obj[i].prod_id;
                                    cost_o = obj[i].prod_cost;                       
                                    img = obj[i].img;
                                    min = obj[i].min_amount;  
                                    if (obj[i].prod_cost == 0 && obj[i].prod_price == 0 && obj[i].prod_pricesend == 0) {
                                        $('#cost').val("");
                                        $('#wholesale').val("");
                                        $('#retail').val("");  
                                    } else {
                                        $('#cost').val(cost_o);
                                        $('#wholesale').val(obj[i].prod_pricesend);
                                        $('#retail').val(obj[i].prod_price);                     
                                        flag = 1;
                                    }                        
                                }); 
                                show_prod();                                       
                            }               
                        });
                        get_place();    
                    }    

                    var temp = $('#prod-addr').val();
                    $("#prod-addr").focus().val("").val(temp);

                } else {
                    // กรณีผู้ใช้กดปิดหรือยกเลิกหน้าสแกน
                    // alert("The user has dismissed the scan");
                }

            } catch (error) {
                // จัดการกรณีเกิด Error หรือปฏิเสธการอนุญาตใช้งานกล้อง
                $.confirm({
                    title: 'พบข้อผิดพลาด',
                    content: 'กรุณากรอกข้อมูลให้ครบ หรือตรวจสอบการอนุญาตเข้าถึงกล้อง',
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                            text: 'ตกลง',
                            btnClass: 'btn-regis',
                            action: function () {}
                        }
                    }
                });
            }
        }

        arr_place = [];
        function get_place(){
            var dataStr;
			if(localStorage.ware_type_im == "โกดัง"){
				dataStr = {'prod_id' : prod_id,"ware_id":localStorage.ware_id_im};
			}else if(localStorage.ware_type_im == "หน้าร้าน"){
				dataStr = {'prod_id' : prod_id,"shop_id":localStorage.ware_id_im};
			}
            $.ajax({
                type: "POST",
                url:localStorage.pathServer + "php/get_place.php",    
                data: dataStr,
                success: function(data){                   
                    var obj = jQuery.parseJSON(data);                    
                    if(obj){                        
                        var txt = "";                                         
                        $.each(obj, function(i, field){
                            txt += field.place + " "; 
                            arr_place.push(field.place.toLowerCase());                                                         
                        });    
                        $('#prod-addr').attr("placeholder",txt);                       
                    }else{                        
                        $('#prod-addr').attr("placeholder",""); 
                    }                                                      
                }               
            });  
        }

        function get_prod(id){
            prod_id = id;
            bool = true;
            if(localStorage.arr_prod){
                var retrievedObject = localStorage.getItem('arr_prod');
                var arr_data = JSON.parse(retrievedObject);                 
                for(var b = 0; b < arr_data.length; b++){
                    if(prod_id == arr_data[b].prod_id){
                        $.confirm({
                            title: 'เตือน',
                            content: 'มีการเพิ่มสินค้า ' + arr_data[b].name + ' กรุณาแก้ไขที่จำนวนของสินค้าที่ได้เพิ่มแล้ว',
                            backgroundDismiss: true,
                            buttons: {
                                formSubmit: {
                                text: 'ตกลง',
                                btnClass: 'btn-regis',
                                action: function () {
                                }
                                }
                            }
                        });  
                        bool = false;                               
                        break;           
                    }
                }                 
            }
            if(bool){
                $.ajax({
                    type: "POST",
                    url:localStorage.pathServer + "php/get_prod.php",    
                    data:{'prod_id' : id,'ware_id' : localStorage.ware_id_im,'type' : localStorage.ware_type_im},
                    //async: false,                       
                    beforeSend: function(){
                        $(".overlay").prop('hidden', false);
                    },             
                    success: function(data){  
                        $(".overlay").prop('hidden', true);
                        var obj = jQuery.parseJSON(data);                                         
                        $.each(obj, function(i, field){
                            $('#name').val(obj[i].prod_name);
                            $('#barcode').val(obj[i].prod_code); 
                            cost_o = obj[i].prod_cost;                       
                            img = obj[i].img;
                            min = obj[i].min_amount;  
                            if(obj[i].prod_cost == 0 && obj[i].prod_price == 0 && obj[i].prod_pricesend == 0){
                                $('#cost').val("");
                                $('#wholesale').val("");
                                $('#retail').val("");  
                            }else{
                                $('#cost').val(cost_o);
                                $('#wholesale').val(obj[i].prod_pricesend);
                                $('#retail').val(obj[i].prod_price);                     
                                flag = 1;
                            }                        
                        }); 
                        show_prod();                                       
                    }               
                });
                get_place();    
            }else{
                show('dup','dup');
            }                   
        }

        var check =  0;
        var is_show = 0;
        var avg = 0;
        function cal_avg(type){
            if(flag == 1){
                if(type == "cost"){
                    $.ajax({
                        type: "POST",
                        url:localStorage.pathServer + "php/get_amt_prod.php",           
                        data: {prod:prod_id},               
                        beforeSend: function(){
                            $(".overlay").prop('hidden', false);
                        },             
                        success: function(data){  
                            $(".overlay").prop('hidden', true);                                                                    
                            var cost_n = $('#cost').val();
                            var amt_n = $('#amount').val();
                            var amt_o = data;

                            avg = (parseInt(cost_n*amt_n) + parseInt(cost_o*amt_o))/(parseInt(amt_n)+parseInt(amt_o));    
                            
                            $('#avg-rate').text(Math.round(avg));
                            if(is_show == 0){
                               show_avg(); 
                               is_show = 1;
                            }                       
                            check = 1;                              
                        }               
                    });            
                }else if(type == "amt" && check == 1){
                    $.ajax({
                        type: "POST",
                        url:localStorage.pathServer + "php/get_amt_prod.php",           
                        data: {prod:prod_id},               
                        beforeSend: function(){
                            $(".overlay").prop('hidden', false);
                        },             
                        success: function(data){  
                            $(".overlay").prop('hidden', true);                                         
                            var cost_n = $('#cost').val();
                            var amt_n = $('#amount').val();
                            var amt_o = data;

                            avg = (parseInt(cost_n*amt_n) + parseInt(cost_o*amt_o))/(parseInt(amt_n)+parseInt(amt_o));    
                            
                            $('#avg-rate').text(Math.round(avg)); 
                            if(is_show == 0){
                               show_avg(); 
                               is_show = 1;
                            }                                                         
                        }               
                    });            
                }
              
            }           
        }  

        function add_import(){
            var code = $('#barcode').val();
            var cost = $('#cost').val();
            var price_s =$('#wholesale').val();
            var price_w =$('#retail').val(); 
            var name =$('#name').val(); 
            var amt =$('#amount').val(); 
            if(!$('#prod-addr').prop('placeholder') && $('#prod-addr').val() == ""){ 
                $.confirm({
                  title: 'พบข้อผิดพลาด',
                  content: 'กรุณากรอกข้อมูลให้ครบ',
                  backgroundDismiss: true,
                  buttons: {
                    formSubmit: {
                      text: 'ตกลง',
                      btnClass: 'btn-regis',
                      action: function () {
                      }
                    }
                  }
                });                
                return 0;
            }            
            if(name != "" && amt != "" && code != "" && cost != "" && price_s != "" && price_w != "" && jQuery.inArray($('#prod-addr').val().toLowerCase(),arr_place) == -1 && $("#h5-title").text() != "เลือกโกดัง(เข้า)"){      
                var cost_to_update = cost;
                var need_update = false;
                if(flag == 0){
                    need_update = true;
                    cost_to_update = cost;
                }else if(flag == 1 && check == 1){
                    need_update = true;
                    cost_to_update = Math.round(avg);
                }
                flag = 0;
                check = 0;
                show(code,cost);

                if(need_update && prod_id){
                    $.ajax({
                        type: "POST",
                        url: localStorage.pathServer + "php/update_prod.php",
                        data: {prod: prod_id, cost: cost_to_update, price_s: price_s, price_w: price_w},
                        error: function(err){
                            console.warn("Background update_prod failed", err);
                        }
                    });
                }
            }else{
                $.confirm({
                  title: 'พบข้อผิดพลาด',
                  content: 'กรุณากรอกข้อมูลให้ครบ',
                  backgroundDismiss: true,
                  buttons: {
                    formSubmit: {
                      text: 'ตกลง',
                      btnClass: 'btn-regis',
                      action: function () {
                      }
                    }
                  }
                });
            }          
        }     
        
        function show(code,cost){
            if(code != 'dup'){
                if(localStorage.arr_prod){
                    var retrievedObject = localStorage.getItem('arr_prod');
                    var arr_data = JSON.parse(retrievedObject);               
                }else{
                    var arr_data = [];              
                }        
            
                item = {}            
                item ["qr"] =  code;
                item ["prod_id"] =  prod_id;
                item ["name"] =  $('#name').val();
                item ["cost"] =  cost;               
                item ["amt"] =  $('#amount').val();
                item ["img"] =  img; 
                item ["addr"] = $('#prod-addr').val();
                item ["min"] =  min;    

                arr_data.push(item); 
                localStorage.setItem('arr_prod', JSON.stringify(arr_data));         
            
                $('#check-import').text(arr_data.length);
                $("#h5-title").prop('onclick',""); 
            }
            $('#prod-addr').attr("placeholder","");
            $('#barcode').val("");
            $('#name').val("");
            $('#cost').val("");
            $('#wholesale').val("");
            $('#retail').val("");
            $('#amount').val("1");
            $('#prod-addr').val("")
            if(is_show == 1){
                show_avg(); 
                is_show = 0;
            }            
            $('#avg-rate').text("");
            if(localStorage.arr_prod_i){
                var retrievedObject = localStorage.getItem('arr_prod_i');
                var arr_data2 = JSON.parse(retrievedObject);
                arr_data2.splice(0,1); 
                localStorage.setItem('arr_prod_i', JSON.stringify(arr_data2));  
                if(arr_data2.length == 0){
                    localStorage.arr_prod_i = "";  
                }                                 
            }  
            if(localStorage.arr_prod_i){                    
                var retrievedObject = localStorage.getItem('arr_prod_i');
                var arr_data2 = JSON.parse(retrievedObject);                                   
                prod_id = arr_data2[0].prod_id;            
                get_prod(prod_id);            
            }else{                   
                $("#btn-folder").removeAttr('disabled'); 
                $("#name").removeAttr('disabled');          
                $("#btn-addpic").removeAttr('disabled');
            }                      
        }  

        function selectfolder() {
            if($("#h5-title").text() == "เลือกโกดัง/หน้าร้าน"){
                $.confirm({
                    title: 'เตือน',
                    content: 'กรุณาเลือกโกดัง/หน้าร้าน',
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                        text: 'ตกลง',
                        btnClass: 'btn-regis',
                        action: function () {
                        }
                        }
                    }
                });  
                return 0;
            }
            goto = "select_folder.html?from=import";
            
            window.location = goto;
        }     

        function report() {
            goto = "import_check.html";
            
            window.location = goto;                       
        }

        function show_avg(){
            var popup = document.getElementById("myPopup");
            popup.classList.toggle("show");
        }

        function setware(arg) {
            $("#h5-title").removeClass('fade');
            $("#h5-title").css('padding-left', '15%');
            $("#h5-title").removeClass('text-right');
            $("#h5-title").addClass('text-center');
            localStorage.ware_name_im = $("#li-ware-" + arg).text();
            $("#h5-title").text(localStorage.ware_name_im);           
            localStorage.ware_id_im = $("#id-ware-" + arg).text();
            localStorage.ware_type_im = $("#type-" + arg).text();
            document.elementFromPoint(0, 0).click();           
            get_place();
        }

        function showware(){
            $("style").append('.jconfirm .jconfirm-box{max-height: 420px;}');
            var text_html = "";
            $.ajax({
                type: "GET",
                url:localStorage.pathServer + "php/get_ware_shop.php",                            
                beforeSend: function(){
                    $(".overlay").prop('hidden', false);
                },             
                success: function(data){  
                $(".overlay").prop('hidden', true);
                var obj = jQuery.parseJSON(data); 
                if(obj){
                    $.each(obj, function(i, field){
                        if(obj[i][2] == "โกดัง"){ 
                            text_html = text_html + '<button id="li-ware-'+i+'" type="button" onclick="setware('+i+')" class="btn btn-choice">'+obj[i].ware_name+'</button>' +
                            '<span id="id-ware-'+i+'" hidden>'+obj[i].ware_id+'</span>'+
                            '<span id="type-'+i+'" hidden>โกดัง</span>';
                        }else if(obj[i][2] == "หน้าร้าน"){
                            text_html = text_html + '<button id="li-ware-'+i+'" type="button" onclick="setware('+i+')" class="btn btn-choice">'+obj[i].shop_name+'</button>' +
                            '<span id="id-ware-'+i+'" hidden>'+obj[i].shop_id+'</span>'+
                            '<span id="type-'+i+'" hidden>หน้าร้าน</span>';
                        }
                    }); 
                }else{
                    text_html = "กรุณาเพิ่มโกดังก่อนทำรายการ";  
                }                
                $.confirm({
                  title: 'โกดัง/หน้าร้าน',
                  content: '<hr style="width: 80%; margin-bottom: 0;">',
                  backgroundDismiss: true,
                  onOpenBefore: function () {
                    $(".jconfirm-buttons .btn-default").remove();
                    $(".jconfirm-buttons").append(text_html);         
                  },
                  onDestroy: function () {
                    $("style").append('.jconfirm .jconfirm-box{margin-bottom: 5%;}');
                    $("style").append('.jconfirm .jconfirm-box{max-height: 100%;}');
                  }              
                });                                       
                }               
            });
        }

        function search_prod(){
            var val = $('#search_prod').val();
            if(val == ""){
                return 0;
            }       
            $('#search_prod').blur();  
            $('#myUL').empty();
            $.ajax({
                type: "POST",
                url: localStorage.pathServer + "php/search_prod.php",
                data: {'phrase' : val},
                beforeSend: function(){
                    $(".overlay").prop('hidden', false);
                },             
                success: function(data){  
                    $(".overlay").prop('hidden', true);                             
                    var obj = jQuery.parseJSON(data);
                    if(obj){
                        $.each(obj, function(i, field){ 
                            $('#myUL').append('<li><div id="prod-1" class="row" onclick="get_prod('+field.prod_id+')">' +
                            '<div class="col-4 text-center p">'+field.prod_code+'</div>' +
                            '<div class="col-8 text-center p">'+field.prod_name+'</div>' +
                            '</div><hr></li>');        
                        }); 
                    }                                                                                                                                        
                }               
            }); 
        }

        function search(){
            if($("#h5-title").text() == "เลือกโกดัง/หน้าร้าน"){
                $.confirm({
                    title: 'เตือน',
                    content: 'กรุณาเลือกโกดัง/หน้าร้าน',
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                        text: 'ตกลง',
                        btnClass: 'btn-regis',
                        action: function () {
                        }
                        }
                    }
                });  
                return 0;
            }
            $("#search-ctn").prop('hidden', false);
            $("#big-ctn").prop('hidden', true);
            $("#navs-bttm").prop('hidden', true);
            $("#col-back").attr('onclick', 'show_prod()');              
        }

        function show_prod(){
            $("#search-ctn").prop('hidden', true);
            $("#big-ctn").prop('hidden', false);
            $("#navs-bttm").prop('hidden', false);
            $("#col-back").attr('onclick', 'window.location = "index.html";');
            $('#myUL').empty(); 
            var temp = $('#prod-addr').val();           
            //$("#prod-addr").focus().val("").val(temp);          
        }

    </script>
</head>

<body>
    <!-- Loading -->
    <div class="overlay" hidden><div class="loading"></div></div>

    <!-- Search ctn -->
    <div id="search-ctn" class="container justify-content-center" hidden>
        <div class="row mgem1o5" style="margin-top: 15px;">
            <div class="col-12 text-center">
                <input id="search_prod" type="search" class="form-control form-control-lg text-center" placeholder="ค้นหาสินค้า" autofocus data-index="1">
            </div>  
        </div>
