<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
    <title>แก้ไขสินค้า - DDCAR</title>
    <!-- Local Assets -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
    <script type="text/javascript" src="js/jquery-ui.min.js"></script>
    <script type="text/javascript" src="js/jquery.easing.1.3.min.js"></script>
    <script type="text/javascript" src="js/jquery-confirm.js"></script>
    <script type="text/javascript" src="js/popper.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.min.js"></script>
    <script defer src="js/fontawesome-all.js"></script>
    <script type="text/javascript" src="js/config.js"></script>
    <script type="text/javascript" src="js/capacitor-bridge.js"></script>

    <link rel="stylesheet" href="css/untitled.css">
    <link rel="stylesheet" href="css/svg-with-js.css">
    <link rel="stylesheet" href="css/index.css">   
    <link rel="stylesheet" href="css/jquery-confirm.css">
    <link rel="stylesheet" href="css/loading.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css?family=Prompt" rel="stylesheet">

    <style>
        .title {
            color: #515151;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .no-pd{
            padding-right: 5px;
            padding-left: 5px;
        }      
        #btn-addpic{
          width: 100%; 
          color: white; 
        }
    </style>

    <script>
        var img_o; 
        var flag = 0; 
        var prod_id,folder;
        $(document).ready(function () { 
            var userRole = localStorage.user_role || '';
            if (userRole !== 'แอดมิน' && userRole !== 'เจ้าของร้าน') {
                alert('คุณไม่มีสิทธิ์เข้าถึงหน้านี้ (เฉพาะแอดมินและเจ้าของร้านเท่านั้น)');
                window.history.back();
                return;
            }
            url = new URL(window.location.href);
            folder = url.searchParams.get("folder");
            prod_id = url.searchParams.get("prod_id");
            get_prod(prod_id);      
            if(localStorage.img){
                var image = document.getElementById('img');
                image.src =  localStorage.img;  
            }                    

            // บังคับภาษาอังกฤษตัวพิมพ์ใหญ่ และตัดช่องว่างทั้งหมดทันที
            $(document).on('input paste keyup', '#barcode', function() {
                var input = this;
                var upperVal = (input.value || '').toUpperCase().replace(/\s+/g, '');
                if (input.value !== upperVal) {
                    var start = input.selectionStart;
                    var end = input.selectionEnd;
                    input.value = upperVal;
                    if (start !== null) input.setSelectionRange(start, end);
                }
                var $this = $(this);
                if (upperVal.length > 0 && !/^[A-Z0-9\-]+$/.test(upperVal)) {
                    $this.addClass('sku-error');
                } else {
                    $this.removeClass('sku-error');
                }
            });
        });

        /**
         * ตรวจสอบความถูกต้องของรหัส SKU:
         * - บังคับภาษาอังกฤษตัวพิมพ์ใหญ่ (A-Z)
         * - ตัวเลข (0-9)
         * - เครื่องหมายขีด (-) เท่านั้น
         * - ห้ามมีสระ ภาษาไทย ช่องว่าง หรือสัญลักษณ์พิเศษอื่น
         */
        function validateSkuField($input, showAlert) {
            if (!$input || $input.length === 0) return true;
            var rawVal = $input.val() || '';
            var code = rawVal.toUpperCase().replace(/\s+/g, '');
            $input.val(code);

            if (!code) {
                $input.addClass('sku-error');
                if (showAlert) {
                    $input.focus();
                    $.confirm({
                        title: '<span class="text-danger"><i class="fa fa-exclamation-triangle mr-2"></i>กรุณาระบุรหัส SKU</span>',
                        content: 'ช่องรหัส SKU ต้องไม่เว้นว่าง กรุณากรอกรหัสสินค้าเป็นภาษาอังกฤษตัวพิมพ์ใหญ่และตัวเลข',
                        backgroundDismiss: true,
                        buttons: {
                            ok: {
                                text: 'ตกลง',
                                btnClass: 'btn-danger',
                                action: function() {
                                    setTimeout(function() { $input.focus(); }, 150);
                                }
                            }
                        }
                    });
                }
                return false;
            }

            var hasThai = /[\u0E00-\u0E7F]/.test(rawVal);
            var hasSpace = /\s/.test(rawVal);
            var isValid = /^[A-Z0-9\-]+$/.test(code);

            if (!isValid || hasThai || hasSpace) {
                $input.addClass('sku-error');
                if (showAlert) {
                    $input.focus();
                    var errorMsg = 'รหัส SKU มีอักขระที่ไม่อนุญาต';
                    if (hasThai) {
                        errorMsg = '<strong>ตรวจพบภาษาไทยหรือสระในช่อง SKU!</strong>';
                    } else if (hasSpace) {
                        errorMsg = '<strong>ตรวจพบช่องว่างในช่อง SKU!</strong>';
                    }
                    $.confirm({
                        title: '<span class="text-danger"><i class="fa fa-ban mr-2"></i>รหัส SKU ไม่ถูกต้อง</span>',
                        content: errorMsg + '<br><div class="mt-2 text-dark font-weight-bold">ข้อกำหนดรหัส SKU:</div>' +
                            '<ul class="text-left mt-1 mb-0" style="padding-left: 20px;">' +
                            '<li>อนุญาตเฉพาะภาษาอังกฤษตัวพิมพ์ใหญ่ (A-Z)</li>' +
                            '<li>ตัวเลข (0-9)</li>' +
                            '<li>เครื่องหมายขีด (-) เท่านั้น</li>' +
                            '<li class="text-danger font-weight-bold">ห้ามมีสระ ภาษาไทย ช่องว่าง หรือสัญลักษณ์พิเศษ</li>' +
                            '</ul>',
                        backgroundDismiss: true,
                        buttons: {
                            ok: {
                                text: 'แก้ไขรหัส SKU',
                                btnClass: 'btn-danger',
                                action: function() {
                                    setTimeout(function() { $input.focus(); }, 150);
                                }
                            }
                        }
                    });
                }
                return false;
            }

            $input.removeClass('sku-error');
            return true;
        }
        
        $(document).keydown(function(objEvent) {
            if (objEvent.keyCode == 13) {  //enter pressed
                objEvent.preventDefault();
                var $this = $(objEvent.target);
                var i_enter = parseFloat($this.attr('data-index'));                      
                if(i_enter == 6){
                    $this.blur();
                }else{
                    var temp = $('[data-index="' + (i_enter+1).toString() + '"]').val();                  
                    $('[data-index="' + (i_enter+1).toString() + '"]').focus().val("").val(temp);
                }                       
            }         
        })

        function get_prod(id){
            $.ajax({
                type: "POST",
                url:localStorage.pathServer + "php/get_prod.php",    
                data:{'prod_id' : id},                                  
                beforeSend: function(){
                    $(".overlay").prop('hidden', false);
                },             
                success: function(data){  
                    $(".overlay").prop('hidden', true);
                    var obj = jQuery.parseJSON(data);                                         
                    $.each(obj, function(i, field){
                        $('#name').val(obj[i].prod_name);                        
                        $('#barcode').val(obj[i].prod_code);
                        img_o = obj[i].img;
                        $('#img').attr('src',img_o);
                        $('#min').val(obj[i].min_amount);
                        if(obj[i].prod_cost == 0 && obj[i].prod_price == 0 && obj[i].prod_pricesend == 0){
                            $('#cost').val("");
                            $('#wholesale').val("");
                            $('#retail').val("");  
                        }else{
                            $('#cost').val(obj[i].prod_cost);
                            $('#wholesale').val(obj[i].prod_pricesend);
                            $('#retail').val(obj[i].prod_price);                       
                        }                        
                    });                                                     
                }               
            });
           
        }

        function addpic(){
            $.confirm({
                title: 'รูปภาพ',
                content: '<hr style="width: 80%; margin-bottom: 0;">',
                backgroundDismiss: true,
                buttons: {
                form1: {
                    text: 'ถ่ายรูป',
                    btnClass: 'btn-choice',
                    action: function () {
                        take_photo();
                    }
                },
                form2: {
                    text: 'อัลบั้ม',
                    btnClass: 'btn-choice',
                    action: function () {
                        upload_photo();
                    }
                }
                }
            });
        }

        function take_photo(){
            DDBridge.takePhoto(function(base64Data) {
                var image = document.getElementById('img');
                image.src = "data:image/jpeg;base64," + base64Data;
            }, function(errMsg) {
                $.confirm({
                    title: 'พบข้อผิดพลาด',
                    content: errMsg || 'ไม่สามารถถ่ายรูปได้',
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                            text: 'ตกลง',
                            btnClass: 'btn-regis',
                            action: function () {}
                        }
                    }
                });
            });
        }

        function upload_photo(){
            DDBridge.uploadPhoto(function(base64Data) {
                var image = document.getElementById('img');
                image.src = "data:image/jpeg;base64," + base64Data;
            }, function(errMsg) {
                $.confirm({
                    title: 'พบข้อผิดพลาด',
                    content: errMsg || 'ไม่สามารถเลือกรูปภาพได้',
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                            text: 'ตกลง',
                            btnClass: 'btn-regis',
                            action: function () {}
                        }
                    }
                });
            });
        }

        function save(){
            var $barcode = $('#barcode');
            if (!validateSkuField($barcode, true)) {
                return 0;
            }
            var code = $barcode.val();
            var cost = $('#cost').val() || '0';
            var price_s = $('#wholesale').val() || '0';
            var price_w = $('#retail').val() || '0';
            var name = $('#name').val() || '';
            var min = $('#min').val() || '0';  

            if(name.trim() === ""){      
                $('#name').focus();
                $.confirm({
                  title: 'ข้อมูลไม่ครบถ้วน',
                  content: 'กรุณาระบุชื่อสินค้า',
                  backgroundDismiss: true,
                  buttons: { ok: { text: 'ตกลง', btnClass: 'btn-dark' } }
                });
                return 0;
            }         
            var image = document.getElementById('img');       
            var fileURL = image.src;
            if(fileURL == img_o){
                fileURL = 1;
            }
            $.ajax({
                type: "POST",
                url: localStorage.pathServer + "php/rename_prod.php",           
                data: {'prod_id' : prod_id,
                    'name_prod' : name,
                    'code' : code,
                    'cost' : cost,
                    'price_w' : price_w,
                    'price_s' : price_s,
                    'img' : fileURL,
                    'min' : min},               
                beforeSend: function(){
                    $(".overlay").prop('hidden', false);
                },             
                success: function(data){
                $(".overlay").prop('hidden', true); 
                //alert(data);                              
                if(data == "success"){
                    $.confirm({
                        title: 'เสร็จสิ้น',
                        content: 'แก้ไขสินค้าเสร็จสิ้น',
                        backgroundDismiss: true,
                        buttons: {
                        formSubmit: {
                            text: 'ตกลง',
                            btnClass: 'btn-regis',
                            action: function () {
                                page_back();
                            }
                        }
                        }
                    });
                    page_back(); 
                }else if(data == "invalid_sku"){
                    validateSkuField($barcode, true);
                }else{
                    $.confirm({
                    title: 'พบข้อผิดพลาด',
                    content: 'ไม่สามารถบันทึกการแก้ไขได้ กรุณาลองใหม่อีกครั้ง',
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                        text: 'ตกลง',
                        btnClass: 'btn-regis',
                        action: function () {
                        }
                        }
                    }
                    });
                }
                }               
            });                  
        }     
        
        function page_back(){
            goto = "select_folder.html?from=add&folder="+folder;
            
            window.location = goto;
        }
       
        function show_pic(){
            localStorage.img = $('#img').attr('src');           
            goto = "show_pic.html?from=e&folder="+folder+"&prod_id="+prod_id;
            
            window.location = goto;
        }

    </script>
</head>

<body>
    <!-- Loading 
    <div class="overlay" hidden><div class="loading"></div></div> -->

    <!-- big container -->
    <div id="big-ctn" class="container justify-content-center">
        <!-- Nav menu top -->
        <div class="row navs align-items-center mgem1o5 fixed-top">
          <div class="col-2 text-center" onclick="page_back()">
            <i id="i-back" class="fas fa-angle-left"></i>
          </div>
          <div class="col-8 text-center">
            <h5 id="h5-title">แก้ไขสินค้า</h5>
          </div>
        </div>
        <div id="in-ctn" class="container-fullwidth" style="height: calc(100vh - 80px);"> 
            <div class="row justify-content-center mgem1">
              <div class="col-10 text-center">
                <!--<h5 id="name" class="title">ชื่อสินค้า</h5>-->
                <input id="name" type="text" class="w3-input" autofocus data-index="1">
              </div>
            </div>
            <div class="row mgem1">
                <div class="col-5 text-center">
                    <label for="barcode">รหัส SKU (A-Z, 0-9, -)</label>
                    <input id="barcode" type="text" class="w3-input" placeholder="ตัวพิมพ์ใหญ่ ตัวเลข และขีด -" data-index="2" autocomplete="off">
                </div>
                <div class="col-4 text-center">
                    <label for="cost" style="font-size: 110%;">ทุน</label>
                    <input id="cost" type="number" class="w3-input" data-index="3">
                </div>
                <div class="col-3 text-center">
                    <label for="min">ขั้นต่ำ</label>
                    <input id="min" type="text" class="w3-input" data-index="4">
                </div>
            </div>
            <div class="row mgem2">
                <div class="col-1"> </div>
                <div class="col-5 text-center">
                    <label for="wholesale" style="font-size: 110%;">ขายส่ง</label>
                    <input id="wholesale" type="number" class="w3-input" data-index="5">
                </div>
                <div class="col-5 text-center">
                    <label for="retail" style="font-size: 110%;">ขายปลีก</label>
                    <input id="retail" type="number" class="w3-input" data-index="6">
                </div>
                <div class="col-1"> </div>
            </div>
            <div id="row-img" class="row mgem2">
                <div class="col-12 text-center">
                 <img id="img" class="square" alt="" onclick="show_pic()" src="https://www.bzh.be/img.php?src=https://www.sortir-en-bretagne.fr/images/no-image.png&w=330&h=200&zc=1">
                </div>
            </div>
            <div class="row justify-content-center mgem1">
              <div class="col-8 text-center">
                <button id="btn-addpic" class="mbtn-green" onclick="addpic();">เพิ่มรูปภาพ</button>
              </div>
            </div>
            <div class="row justify-content-center mgem1o5">
                <div class="col-10 text-center">
                <button class="mbtn" onclick="save();">บันทึกแก้ไข</button>
                </div>
            </div>
        </div>
    </div>
    <!-- End big container -->
    <script>
      //Touch animation
      $(".mbtn").on("touchstart", function() {
        $(this).addClass('mbtn-touch');
      });
      $(".mbtn").on("touchend", function() {
        $(this).removeClass('mbtn-touch');
      });
    $(".mbtn-green").on("touchstart", function() {
    $(this).addClass('mbtn-green-touch');
    });
    $(".mbtn-green").on("touchend", function() {
    $(this).removeClass('mbtn-green-touch');
    });
    </script>
</body>

</html>
