<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
    <title>ขายสินค้า - DDCAR</title>
    <!-- Local Assets -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/svg-with-js.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/jquery-confirm.css">
    <link rel="stylesheet" href="css/loading.css">

    <script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
    <script type="text/javascript" src="js/jquery-ui.min.js"></script>
    <script type="text/javascript" src="js/jquery.easing.1.3.min.js"></script>
    <script type="text/javascript" src="js/jquery-confirm.js"></script>
    <script type="text/javascript" src="js/popper.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.min.js"></script>
    <script defer src="js/fontawesome-all.js"></script>
    <script type="text/javascript" src="js/onscan.min.js"></script>
    <script type="text/javascript" src="js/scanqr.js"></script>
    <script type="text/javascript" src="js/config.js"></script>
    <script type="text/javascript" src="js/capacitor-bridge.js"></script>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css?family=Prompt:400,600,700&display=swap" rel="stylesheet">

    <style>
        #title {
            color: #666666;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .pdlr {
            padding-left: 10%;
            padding-right: 10%;
        }
        
        #btn-addpic{
          width: 100%; 
          color: white; 
        }
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }  
        .fade {
            animation-duration: 1.25s;
            animation-name: fade;
            animation-direction: alternate-reverse;
            animation-iteration-count: infinite;
        }

        @-webkit-keyframes fade {
            from {opacity: 0.55; } 
            to {opacity: 1;}
        } 
         
        #search-ctn{
            overflow: hidden; overflow-x: hidden !important; height: 100%;
        }

    <script>
        var prod_id,img,cus_id,type,old_price,min;
        $(document).ready(function () {
            url = new URL(window.location.href);
            cus = url.searchParams.get("name");
            cus_id = url.searchParams.get("cus");
            type = url.searchParams.get("type");
            var addr = url.searchParams.get("addr");
            var tel = url.searchParams.get("tel");
            prod_id = url.searchParams.get("product");
            var ch = url.searchParams.get("ch");  

            if(localStorage.ware_id_s){
                $("#h5-title").removeClass('fade');                      
                $("#h5-title").text(localStorage.ware_name_s);
            }  
            if(cus){
                $("#cus").val(cus);
                localStorage.cus_name = cus;
                localStorage.cus_id = cus_id;
                localStorage.type = type;
                localStorage.cus_addr = addr;
                localStorage.cus_tel = tel;
                $("#name").removeAttr('disabled');
                $("#price").removeAttr('readonly');
                $("#amount").removeAttr('readonly');   
                $("#btn-folder").removeAttr('disabled');           
                $("#btn-addpic").removeAttr('disabled');
                $("#btn-addprod").removeAttr('disabled');
            }
            if(localStorage.cus_name){
                cus_id = localStorage.cus_id;
                type = localStorage.type;                
                $("#cus").val(localStorage.cus_name);              
                $("#name").removeAttr('disabled');
                $("#price").removeAttr('readonly');
                $("#amount").removeAttr('readonly');   
                $("#btn-folder").removeAttr('disabled');           
                $("#btn-addpic").removeAttr('disabled');
                $("#btn-addprod").removeAttr('disabled');
            }            
            if(localStorage.arr_sale){
                var retrievedObject = localStorage.getItem('arr_sale');
                var arr_data = JSON.parse(retrievedObject);             
                $('#check-sale').text(arr_data.length); 
                $("#cus").attr('disabled',true);  
                $("#h5-title").prop('onclick',"");     
            }
            if(prod_id){
              get_sale(prod_id);
            }
            if(localStorage.arr_prod_s){
                $("#btn-folder").attr('disabled',true);           
                $("#btn-addpic").attr('disabled',true);
                $("#name").attr('disabled',true);
                var retrievedObject = localStorage.getItem('arr_prod_s');
                var arr_data = JSON.parse(retrievedObject); 
                prod_id = arr_data[0].prod_id;            
                get_sale(prod_id);
            }
            if(ch){
                if(ch == "true"){
                    $('.dot').prop('hidden',false);
                }
            }  
            if(localStorage.bell){
                $('.dot').prop('hidden',false);
            }

            if (typeof onScan !== 'undefined') {
                try {
                    onScan.attachTo(document, {
                        suffixKeyCodes: [13],
                        onScan: function(sCode) {
                            if (sCode && sCode.trim() !== '') {
                                if (!$('#name').prop('disabled')) {
                                    $('#search_prod').val(sCode.trim());
                                    search_prod();
                                }
                            }
                        }
                    });
                } catch(e) {}
            }

            // Live autocomplete input listener (requires at least 2 characters)
            var saleSearchTimer = null;
            $('#search_prod').on('input', function() {
                var q = $(this).val().trim();
                if (saleSearchTimer) clearTimeout(saleSearchTimer);
                if (q.length >= 2) {
                    saleSearchTimer = setTimeout(function() {
                        search_prod_instant(q);
                    }, 350);
                } else {
                    $('#myUL').empty();
                }
            });
        });

        $(document).keydown(function(objEvent) {
            if (objEvent.keyCode == 13) {  //enter pressed
                objEvent.preventDefault();
                var $this = $(objEvent.target);
                var i_enter = parseFloat($this.attr('data-index'));                      
                if(i_enter == 1){
                    search_prod();
                }else if(i_enter == 3){
                    add_prod();
                }else{
                    var temp = $('[data-index="' + (i_enter+1).toString() + '"]').val();
                    $('[data-index="' + (i_enter+1).toString() + '"]').focus().val("").val(temp);
                }                       
            }         
        })

        var bool = true;
        function get_sale(id){
            prod_id = id;
            bool = true;
            if(localStorage.arr_sale){
                var retrievedObject = localStorage.getItem('arr_sale');
                var arr_data = JSON.parse(retrievedObject);                 
                for(var b = 0; b < arr_data.length; b++){
                    if(prod_id == arr_data[b].prod_id){
                        $.confirm({
                            title: 'เตือน',
                            content: 'มีการเพิ่มสินค้า ' + arr_data[b].name + ' กรุณาแก้ไขที่จำนวนของสินค้าที่ได้เพิ่มแล้ว',
                            backgroundDismiss: true,
                            buttons: {
                                formSubmit: {
                                    text: 'ตกลง',
                                    btnClass: 'btn-danger',
                                    action: function () {
                                        set_default();
                                    }
                                }
                            }
                        });  
                        bool = false;                               
                        break;           
                    }
                }                 
            }
            if(bool){
                $.ajax({
                    type: "POST",
                    url: localStorage.pathServer + "php/get_sale.php",    
                    data: {'prod_id' : id, 'cus_id': cus_id, 'ware_id': localStorage.ware_id_s, 'type': localStorage.ware_type},
                    beforeSend: function(){
                        $(".overlay").prop('hidden', false);
                    },             
                    success: function(data){  
                        $(".overlay").prop('hidden', true); 
                        var obj = window.safeParseJSON(data);
                        if (!obj || !Array.isArray(obj) || obj.length === 0) {
                            $.confirm({
                                title: 'ไม่พบข้อมูลสินค้า',
                                content: 'ไม่สามารถดึงข้อมูลสินค้านี้ได้ หรือสินค้าไม่มีในระบบ',
                                backgroundDismiss: true,
                                buttons: {
                                    formSubmit: {
                                        text: 'ตกลง',
                                        btnClass: 'btn-danger',
                                        action: function() {
                                            set_default();
                                        }
                                    }
                                }
                            });
                            show();
                            return;
                        }                                                           
                        $.each(obj, function(i, field){                           
                            if(obj[i][9]){
                                $('#price').val(obj[i][9]);  
                            }else{                                
                                if(type == "ขายปลีก"){
                                    $('#price').val(obj[i].prod_price);  
                                }else{
                                    $('#price').val(obj[i].prod_pricesend);  
                                }                                
                            }  
                            $('#name').val(obj[i].prod_name);
                            $('#barcode').val(obj[i].prod_code);                                                       
                            img = obj[i].img;   
                            old_price = $('#price').val();  
                            min = obj[i].min_amount;
                            if(min <= 0){
                                $.confirm({
                                    title: 'เตือน',
                                    content: 'สินค้าไม่มีใน' + $('#h5-title').text(),
                                    backgroundDismiss: true,
                                    buttons: {
                                        formSubmit: {
                                            text: 'ตกลง',
                                            btnClass: 'btn-danger',
                                            action: function () {
                                                set_default();
                                            }
                                        }
                                    }
                                });  
                                set_default();
                                if(localStorage.arr_prod_s){
                                    bool = false;
                                    add_prod();
                                }  
                            } else {
                                $("#btn-addprod").removeAttr('disabled');
                            }                                                                     
                        });
                        show();                                             
                    },
                    error: function(xhr, status, error) {
                        $(".overlay").prop('hidden', true);
                        $.confirm({
                            title: 'ข้อผิดพลาดการเชื่อมต่อ',
                            content: 'ไม่สามารถติดต่อเซิร์ฟเวอร์เพื่อดึงข้อมูลสินค้าได้ กรุณาลองใหม่อีกครั้ง',
                            backgroundDismiss: true,
                            buttons: {
                                formSubmit: {
                                    text: 'ตกลง',
                                    btnClass: 'btn-danger',
                                    action: function() {
                                        set_default();
                                    }
                                }
                            }
                        });
                        show();
                    }               
                });     
            }else{
                add_prod();
            }                   
        }

        function edit_amt(){
            var amount = parseInt($('#amount').val());      
            if(amount > parseInt(min)){
                $.confirm({
                    title: 'เตือน',
                    content: 'สินค้ามีจำนวนไม่พอใน' + $('#h5-title').text() + ' สินค้ามีจำนวน ' + min,
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                        text: 'ตกลง',
                        btnClass: 'btn-regis',
                        action: function () {
                        }
                        }
                    }
                });  
                $("#btn-addprod").attr('disabled',true);
            }else{
                $("#btn-addprod").attr('disabled',false);
            }   
        }   

        function showware(){
            $("style").append('.jconfirm .jconfirm-box{max-height: 420px;}');
            $.confirm({
              title: 'หน้าร้าน/โกดัง',
              content: '<hr style="width: 80%; margin-bottom: 0;">',
              backgroundDismiss: true,
              onOpenBefore: function () {
                $(".jconfirm-buttons .btn-default").remove();
                //ajax and apeend
                $.ajax({
                    type: "GET",
                    url:localStorage.pathServer + "php/get_ware_shop.php",     
                    beforeSend: function(){
                        $(".overlay").prop('hidden', false);
                    },                        
                    success: function(data){
                    $(".overlay").prop('hidden', true);  
                        var obj = jQuery.parseJSON(data);
                        if(obj){
                            $.each(obj, function(i, field){   
                                if(obj[i][2] == "โกดัง"){  
                                    $(".jconfirm-buttons").append('<button id="li-ware-'+i+'" type="button" onclick="setware('+i+')" class="btn btn-choice">'+obj[i].ware_name+'</button>' +
                                    '<span id="id-ware-'+i+'" hidden>'+obj[i].ware_id+'</span>' +
                                    '<span id="type-'+i+'" hidden>โกดัง</span>');                       
                                }else if(obj[i][2] == "หน้าร้าน"){ 
                                    $(".jconfirm-buttons").append('<button id="li-ware-'+i+'" type="button" onclick="setware('+i+')" class="btn btn-choice">'+obj[i].shop_name+'</button>' +
                                    '<span id="id-ware-'+i+'" hidden>'+obj[i].shop_id+'</span>' +
                                    '<span id="type-'+i+'" hidden>หน้าร้าน</span>');
                                }                    
                            });   
                        }else{
                            $(".jconfirm-buttons").append("กรุณาเพิ่มหน้าร้าน/โกดังก่อนทำรายการ");     
                        }                                                      
                    }               
                });               
              },
              onDestroy: function () {
                $("style").append('.jconfirm .jconfirm-box{margin-bottom: 5%;}');
                $("style").append('.jconfirm .jconfirm-box{max-height: 100%;}');
              }             
            });
        }

        function setware(arg) {
            $("#h5-title").removeClass('fade');
            localStorage.ware_name_s = $("#li-ware-" + arg).text();
            localStorage.ware_type = $("#type-" + arg).text();
            $("#h5-title").text(localStorage.ware_name_s);
            localStorage.ware_id_s = $("#id-ware-" + arg).text();  
            document.elementFromPoint(0, 0).click();
            if($('#name').val() != ""){
                $.ajax({
                    type: "POST",
                    url:localStorage.pathServer + "php/get_sale.php",    
                    data:{'prod_id' : prod_id,'cus_id':cus_id,'ware_id': localStorage.ware_id_s,'type':localStorage.ware_type},
                    //async: false,                       
                    beforeSend: function(){
                        $(".overlay").prop('hidden', false);
                    },             
                    success: function(data){  
                        $(".overlay").prop('hidden', true);
                        var obj = jQuery.parseJSON(data);                                         
                        $.each(obj, function(i, field){                      
                            min = obj[i].min_amount;
                            if(min == 0){
                                $.confirm({
                                    title: 'เตือน',
                                    content: 'สินค้าไม่มีใน' + $('#h5-title').text(),
                                    backgroundDismiss: true,
                                    buttons: {
                                        formSubmit: {
                                        text: 'ตกลง',
                                        btnClass: 'btn-regis',
                                        action: function () {
                                        }
                                        }
                                    }
                                });                            
                                if(localStorage.arr_prod_s){
                                    bool = false;
                                    add_prod();
                                }else{
                                    set_default();
                                }
                            }                              
                        });
                        show();                                        
                    }               
                });   
            }           
        }

        async function scanqr() {
            if ($("#h5-title").text() == "เลือกโกดัง/หน้าร้าน") {
                $.confirm({
                    title: 'เตือน',
                    content: 'กรุณาเลือกโกดัง/หน้าร้าน',
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                            text: 'ตกลง',
                            btnClass: 'btn-regis',
                            action: function () {}
                        }
                    }
                });  
                return 0;
            }
            const CapacitorBarcodeScanner = window.Capacitor?.Plugins?.CapacitorBarcodeScanner || window.CapacitorBarcodeScanner;
            try {
                // เรียกใช้ Capacitor Barcode Scanner hint: 17 (รับบาร์โค้ดทุกรูปแบบทั้ง 1D และ 2D)
                const result = await CapacitorBarcodeScanner.scanBarcode({
                    hint: 17,
                    scanInstructions: "วางบาร์โค้ดหรือคิวอาร์โค้ดให้อยู่ในกรอบเพื่อสแกน"
                });

                // เช็กว่ามีการสแกนและมีผลลัพธ์กลับมาหรือไม่
                if (result && result.ScanResult) {
                    var value = result.ScanResult; // ข้อความที่สแกนได้จาก QR Code
                    
                    var bool = true;
                    if (localStorage.arr_sale) {
                        var retrievedObject = localStorage.getItem('arr_sale');
                        var arr_data = JSON.parse(retrievedObject); 
                        for (var b = 0; b < arr_data.length; b++) {
                            if (value == arr_data[b].qr) {
                                $.confirm({
                                    title: 'เตือน',
                                    content: 'มีการเพิ่มสินค้า ' + arr_data[b].name + ' กรุณาแก้ไขที่จำนวนของสินค้าที่ได้เพิ่มแล้ว',
                                    backgroundDismiss: true,
                                    buttons: {
                                        formSubmit: {
                                            text: 'ตกลง',
                                            btnClass: 'btn-regis',
                                            action: function () {}
                                        }
                                    }
                                });  
                                bool = false;                               
                                break;           
                            }
                        }                 
                    } 

                    if (bool) {
                        $.ajax({
                            type: "POST",
                            url: localStorage.pathServer + "php/get_sale.php",                
                            data: {
                                'qr': value,
                                'cus_id': cus_id,
                                'ware_id': localStorage.ware_id_s,
                                'type': localStorage.ware_type
                            },             
                            beforeSend: function () {
                                $(".overlay").prop('hidden', false);
                            },             
                            success: function (data) {  
                                $(".overlay").prop('hidden', true);                             
                                var obj = jQuery.parseJSON(data); 
                                $.each(obj, function (i, field) {                                           
                                    if (obj[i][9]) {
                                        $('#price').val(obj[i][9]);  
                                    } else {                                
                                        if (type == "ขายปลีก") {
                                            $('#price').val(obj[i].prod_price);  
                                        } else {
                                            $('#price').val(obj[i].prod_pricesend);  
                                        }                                
                                    }  
                                    $('#name').val(obj[i].prod_name);
                                    $('#barcode').val(obj[i].prod_code);                                                       
                                    img = obj[i].img;   
                                    old_price = $('#price').val(); 
                                    prod_id = obj[i].prod_id;  
                                    min = obj[i].min_amount;
                                    if (min <= 0) {
                                        $.confirm({
                                            title: 'เตือน',
                                            content: 'สินค้าไม่มีใน' + $('#h5-title').text(),
                                            backgroundDismiss: true,
                                            buttons: {
                                                formSubmit: {
                                                    text: 'ตกลง',
                                                    btnClass: 'btn-regis',
                                                    action: function () {}
                                                }
                                            }
                                        });  
                                        set_default();                                                
                                    }    
                                });                                                                                        
                            }               
                        });
                        var temp = $('#price').val();
                        $("#price").focus().val("").val(temp);  
                    } else {
                        set_default();
                    }

                } else {
                    // กรณีผู้ใช้กดปิดหรือยกเลิกการสแกน
                    // alert("The user has dismissed the scan");
                }

            } catch (error) {
                // จัดการกรณีเกิด Error หรือปฏิเสธการขอ Permission กล้อง
                $.confirm({
                    title: 'พบข้อผิดพลาด',
                    content: 'กรุณากรอกข้อมูลให้ครบ หรือตรวจสอบการอนุญาตเข้าถึงกล้อง',
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                            text: 'ตกลง',
                            btnClass: 'btn-regis',
                            action: function () {}
                        }
                    }
                });
            }
        }

        function disactive(arg) {
            nav_menu = ['home', 'bell', 'qrcode', 'bars'];
            for (i = 0; i < 4; i++) {
                if (nav_menu[i] != arg) {
                    if ($("#i-" + nav_menu[i]).hasClass('active')) $("#i-" + nav_menu[i]).removeClass('active');
                }
            }
        }

        function menu(arg) {
            // Animate
            disactive(arg);
            $("#i-" + arg).fadeOut(100).fadeIn(100, function () {
                $("#i-" + arg).addClass('active');
            });
        }

        function add_prod(){
            if(bool){
                var code = $('#barcode').val();
                var price = $('#price').val();   
                var name = $('#name').val();    
                var amt = $('#amount').val();            
                if(name == "" || amt == "" || code == "" || price == ""){ 
                    $.confirm({
                    title: 'พบข้อผิดพลาด',
                    content: 'กรุณากรอกข้อมูลให้ครบ',
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                        text: 'ตกลง',
                        btnClass: 'btn-regis',
                        action: function () {
                        }
                        }
                    }
                    });
                    return 0;
                }                   
                if(localStorage.arr_sale){
                    var retrievedObject = localStorage.getItem('arr_sale');
                    var arr_data = JSON.parse(retrievedObject);               
                }else{
                    var arr_data = [];              
                }           
                item = {}            
                item ["qr"] =  code;
                item ["prod_id"] =  prod_id;
                item ["name"] =  name;
                item ["old_price"] =  old_price; 
                item ["price"] =  price;               
                item ["amt"] =  amt;
                item ["img"] =  img;   
                item ["min"] =  min;  

                arr_data.push(item); 
                localStorage.setItem('arr_sale', JSON.stringify(arr_data));         
            
                $('#check-sale').text(arr_data.length);
                $("#cus").attr('disabled',true);  
                $("#h5-title").prop('onclick',"");         
            }
            $('#barcode').val("");
            $('#name').val("");
            $('#price').val("");                
            $('#amount').val("1");  
            if(localStorage.arr_prod_s){
                var retrievedObject = localStorage.getItem('arr_prod_s');
                var arr_data2 = JSON.parse(retrievedObject);
                arr_data2.splice(0,1); 
                localStorage.setItem('arr_prod_s', JSON.stringify(arr_data2));  
                if(arr_data2.length == 0){
                    localStorage.arr_prod_s = "";  
                }                                 
            }  
            if(localStorage.arr_prod_s){                    
                var retrievedObject = localStorage.getItem('arr_prod_s');
                var arr_data2 = JSON.parse(retrievedObject);                                   
                prod_id = arr_data2[0].prod_id;            
                get_sale(prod_id);            
            }else{                   
                $("#btn-folder").removeAttr('disabled');           
                $("#btn-addpic").removeAttr('disabled');
                $("#name").removeAttr('disabled');
            } 
        }

        function selectfolder() {
            if($("#h5-title").text() == "เลือกโกดัง/หน้าร้าน"){
                $.confirm({
                    title: 'เตือน',
                    content: 'กรุณาเลือกโกดัง/หน้าร้าน',
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                        text: 'ตกลง',

                        action: function () {
                        }
                        }
                    }
                });  
                return 0;
            }
            goto = "select_folder.html?from=sale";
           
            window.location = goto;
        }

        function check(){
            if($("#check-sale").text() != "0"){
                goto = "sale_check.html";
                
                window.location = goto;
            }else{
                return 0;
            }
        }

        function search_prod(){
            var val = $('#search_prod').val().trim();
            if(val == "") return 0;
            $('#search_prod').blur();
            search_prod_instant(val);
        }

        function search_prod_instant(val){
            if(!val || val.trim() === ""){
                $('#myUL').empty();
                return;
            }       
            $.ajax({
                type: "POST",
                url: localStorage.pathServer + "php/search_prod.php",
                data: {'phrase' : val},
                cache: false,
                success: function(data){  
                    var obj = window.safeParseJSON(data);
                    $('#myUL').empty();
                    if(obj && obj.length > 0){
                        $.each(obj, function(i, field){ 
                            var codeDisplay = field.prod_code ? field.prod_code : '-';
                            var price = (type == "ส่ง" || type == "ขายส่ง") ? field.prod_pricesend : field.prod_price;
                            var priceDisplay = price ? (Number(price).toLocaleString() + ' ฿') : '';
                            $('#myUL').append(
                                '<li style="padding: 10px 4px; border-bottom: 1px solid #f1f5f9;">' +
                                  '<div class="row align-items-center" onclick="get_sale('+field.prod_id+')" style="cursor: pointer;">' +
                                    '<div class="col-4 text-center">' +
                                      '<span class="badge badge-light border" style="font-size: 0.85rem; font-weight: 700; color: #1e293b;">'+codeDisplay+'</span>' +
                                    '</div>' +
                                    '<div class="col-5 text-left">' +
                                      '<div style="font-weight: 600; color: #0f172a; font-size: 0.95rem;">'+field.prod_name+'</div>' +
                                    '</div>' +
                                    '<div class="col-3 text-right font-weight-bold text-danger" style="font-size: 0.9rem;">' +
                                      priceDisplay +
                                    '</div>' +
                                  '</div>' +
                                '</li>'
                            );        
                        }); 
                    } else {
                        $('#myUL').append('<li class="text-center p-4 text-muted">ไม่พบสินค้าที่ตรงกับการค้นหา</li>');
                    }                                                                                                                                        
                }               
            }); 
        }

        function select_cus(){
            //alert("select_cus");
        
            window.location = 'select_cus.html';
        }
       
        function search(){
            if($("#h5-title").text() == "เลือกโกดัง/หน้าร้าน"){
                $.confirm({
                    title: 'เตือน',
                    content: 'กรุณาเลือกโกดัง/หน้าร้าน',
                    backgroundDismiss: true,
                    buttons: {
                        formSubmit: {
                        text: 'ตกลง',
                        btnClass: 'btn-regis',
                        action: function () {
                        }
                        }
                    }
                });  
                return 0;
            }
            $("#search-ctn").prop('hidden', false);
            $("#big-ctn").prop('hidden', true);
            $("#navs-bttm").prop('hidden', true);
            $("#col-back").attr('onclick', 'show()');    
        }

        function show(){
            $("#search-ctn").prop('hidden', true);
            $("#big-ctn").prop('hidden', false);
            $("#navs-bttm").prop('hidden', false);
            $("#col-back").attr('onclick', 'window.location = "index.html";');
            $('#myUL').empty(); 
            $('#search_prod').val("");  
            var temp = $('#price').val();
            //$("#price").focus().val("").val(temp);         
        } 

        function set_default(){
            $('#barcode').val("");
            $('#name').val("");     
            $('#price').val("");                
            $('#amount').val("1");      
            $('#name').focus();
        }

        function resetForm(){
            $.confirm({
                title: 'ยืนยันล้างข้อมูลทั้งหมด',
                content: 'ต้องการล้างข้อมูลทั้งหมดในหน้านี้ (รวมถึงลูกค้า และรายการสินค้าทั้งหมดที่เลือกไว้) หรือไม่?',
                backgroundDismiss: true,
                buttons: {
                    confirm: {
                        text: 'ล้างข้อมูลทั้งหมด',
                        btnClass: 'btn-danger',
                        action: function() {
                            set_default();
                            prod_id = "";
                            old_price = "";
                            img = "";
                            min = 0;
                            bool = true;
                            cus_id = "";
                            type = "";
                            $('#cus').val('').removeAttr('disabled');
                            $('#check-sale').text('0');
                            localStorage.removeItem('cus_name');
                            localStorage.removeItem('cus_id');
                            localStorage.removeItem('type');
                            localStorage.removeItem('cus_addr');
                            localStorage.removeItem('cus_tel');
                            localStorage.removeItem('arr_prod_s');
                            localStorage.removeItem('arr_sale');
                            $("#name").attr('disabled', true);
                            $("#btn-folder").attr('disabled', true);
                            $("#btn-addpic").attr('disabled', true);
                            $("#btn-addprod").attr('disabled', true);
                            $("#h5-title").attr('onclick', 'showware();');
                            try {
                                window.history.replaceState({}, document.title, window.location.pathname);
                            } catch(e) {}
                        }
                    },
                    cancel: { text: 'ยกเลิก' }
                }
            });
        }

    </script>
</head>

<body>
    <!-- Loading -->
    <div class="overlay" hidden><div class="loading"></div></div>

    <!-- Search ctn -->
    <div id="search-ctn" class="container justify-content-center" hidden>
        <div class="row mgem1o5" style="margin-top: 15px;">
            <div class="col-12 text-center">
                <input id="search_prod" type="search" class="form-control form-control-lg text-center" placeholder="ค้นหาสินค้า" autofocus data-index="1">
            </div>  
        </div>
        <div id="add_ctn" class="container" style="overflow-x: hidden !important; overflow-y: auto; height: calc(100vh - 140px) !important;">
            <ul id="myUL">
            </ul>            
        </div>
    </div>

    <!-- Start big container -->
    <div id="big-ctn" class="container-fullwidth justify-content-center">
        <!-- Nav menu top -->
        <div class="row navs align-items-center fixed-top justify-content-center">
          <div id="col-back" class="col-2 text-center" onclick="window.location = 'index.html';">
            <i id="i-back" class="fas fa-angle-left"></i>
          </div>
          <div class="col-8 text-center">
            <h5 id="h5-title" class="fade" onclick="showware();">เลือกโกดัง/หน้าร้าน</h5>
          </div>
          <div class="col-2 text-right" onclick="check();" style="cursor: pointer;">
            <div id="check-sale" class="circle-text">0</div>
          </div>
        </div>

        <div id="in-ctn" class="container" style="padding: 16px 20px;">
            <div style="margin-bottom: 14px;">
                <label for="cus"><i class="fas fa-user text-danger" style="margin-right: 6px;"></i> เลือกลูกค้า</label>
                <input id="cus" type="text" class="w3-input" onclick="select_cus();" placeholder="แตะเพื่อเลือกรายชื่อลูกค้า..." readonly>
            </div>
            <div style="margin-bottom: 18px;">
                <label for="name"><i class="fas fa-box text-danger" style="margin-right: 6px;"></i> ชื่อสินค้า</label>
                <input disabled id="name" type="text" class="w3-input" onclick="search();" placeholder="แตะเพื่อค้นหาสินค้า...">
            </div>
            
            <!-- Detail Card -->
            <div class="card-sport" style="margin-bottom: 20px;">
                <div class="row align-items-center">
                    <div class="col-4 text-center" style="padding-right: 6px;">
                        <label for="barcode" style="font-size: 12px; margin-bottom: 4px;">รหัสสินค้า</label>
                        <input readonly id="barcode" type="text" class="w3-input" style="font-size: 14px; padding: 8px;">
                    </div>
                    <div class="col-4 text-center" style="padding-left: 6px; padding-right: 6px;">
                        <label for="price" style="font-size: 12px; margin-bottom: 4px;">ราคา (บาท)</label>
                        <input readonly id="price" type="number" class="w3-input" data-index="2" style="font-size: 15px; font-weight: 700; color: #da251c; padding: 8px;">
                    </div>
                    <div class="col-4 text-center" style="padding-left: 6px;">
                        <label for="amount" style="font-size: 12px; margin-bottom: 4px;">จำนวน</label>
                        <input readonly id="amount" onkeyup="edit_amt()" type="number" min="1" value="1" class="w3-input" data-index="3" style="font-size: 15px; font-weight: 700; padding: 8px;">
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="row align-items-center" style="margin-bottom: 14px;">
                <div class="col-5" style="padding-right: 6px;">
                    <button id="btn-addpic" class="mbtn" onclick="scanqr();" disabled style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">
                        <i class="fas fa-qrcode" style="margin-right: 6px;"></i> สแกน
                    </button>
                </div>
                <div class="col-7" style="padding-left: 6px;">
                    <button id="btn-folder" class="select_folder" onclick="selectfolder()" disabled>
                        <i class="fas fa-folder-open text-warning" style="margin-right: 6px;"></i> เลือกจากคลัง
                    </button>
                </div>
            </div>

            <div style="margin-bottom: 12px;">
                <button id="btn-addprod" class="mbtn" onclick="add_prod();" disabled style="min-height: 52px; font-size: 1.15rem;">
                    <i class="fas fa-cart-plus" style="margin-right: 8px;"></i> เพิ่มสินค้าลงรายการ
                </button>
            </div>

            <div>
                <button id="btn-reset" type="button" class="btn btn-outline-secondary btn-block" onclick="resetForm();" style="border-radius: 12px; font-weight: 600; padding: 10px; font-size: 0.95rem; border: 1.5px solid #cbd5e1; color: #475569;">
                    <i class="fas fa-redo-alt mr-1"></i> ล้างข้อมูลทั้งหมด (เริ่มบิลใหม่)
                </button>
            </div>
        </div>
    </div>
    <!-- End big container -->

    <!-- Nav menu bottom -->
    <div id="navs-bttm" class="fixed-bottom">
        <div class="nav-bottom-item" onclick="window.location = 'index.html';">
            <i id="i-home" class="fas fa-home menu"></i>
        </div>
        <div class="nav-bottom-item" onclick="window.location = 'bell.html';">
            <div class="dot" hidden></div>
            <i id="i-bell" class="fas fa-bell menu"></i>
        </div>
        <div class="nav-bottom-item" onclick="handleBottomScan();">
            <i id="i-qrcode" class="fas fa-qrcode menu"></i>
        </div>
        <div class="nav-bottom-item" onclick="window.location = 'other.html';">
            <i id="i-bars" class="fas fa-bars menu"></i>
        </div>
    </div>
    <!-- End Nav menu bottom -->

    <script>
    function handleBottomScan() {
        if (!$('#btn-addpic').prop('disabled')) {
            scanqr();
        } else {
            scan();
        }
    }       
    //Touch animation
    $(".mbtn").on("touchstart", function() {
      $(this).addClass('mbtn-touch');
    });
    $(".mbtn").on("touchend", function() {
      $(this).removeClass('mbtn-touch');
    });
    $(".mbtn-green").on("touchstart", function() {
      $(this).addClass('mbtn-green-touch');
    });
    $(".mbtn-green").on("touchend", function() {
      $(this).removeClass('mbtn-green-touch');
    });
    $(".select_folder").on("touchstart", function() {
      $(this).addClass('select_folder-touch');
    });
    $(".select_folder").on("touchend", function() {
      $(this).removeClass('select_folder-touch');
    });
    
    </script>
</body>

</html>
