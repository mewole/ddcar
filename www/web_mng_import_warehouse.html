  <script>
    var start = start_s = 0;
    var bool = bool_s = false;
    $(document).ready(function(){
      if(!localStorage.user_id){
				window.location = 'web_login.html';
			}
      get_import();

      window.addEventListener('scroll', () => { 
        // Calculate the scroll position 
        const scrollPosition = window.scrollY + window.innerHeight; 
        const documentHeight = document.documentElement.scrollHeight; 
    
        // Check if the user has scrolled to the bottom 
        if (scrollPosition >= documentHeight - 1) { 
          if(!$("#myUL").prop('hidden')){
              if(bool){
                return 0;
              }
              get_import();           
            }else if(!$("#myS").prop('hidden')){
              if(bool_s){
                return 0;
              }
              get_import_s();
            }
        } 
      });
        
    });
    
    $(document).keydown(function(objEvent) {
      if (objEvent.keyCode == 13) {  //enter pressed
        objEvent.preventDefault();           
        search();        
      }         
    })
    var tempdate,no = 1
    function get_import(){
      $.ajax({
        type: "POST",
        url:"php/get_import.php",
        data: {'start': start},       
        beforeSend: function(){
          EasyLoading.show({                           
						text: "กำลังโหลด"
					});
        },                       
        success: function(data){ 
          EasyLoading.hide();
          var obj = jQuery.parseJSON(data);
          if(obj[0] == "last"){
            bool = true
          }                        
          $.each(obj, function(i, field){
            if(i > 0){
              var txt = field.date_time.split(" ");
              var txt2 = txt[0].split("-");
              var date = txt2[2] + "/" + txt2[1] + "/" + txt2[0].substr(2);
              if(tempdate != date){
                  tempdate = date
                  no = 1
              }
              var supName = field.supplier_name || field.source_from;
              var sourceTxt = supName && supName.trim() !== ''
                ? '<span class="badge badge-primary font-weight-bold px-2 py-1" style="font-size: 0.88rem;"><i class="fas fa-store mr-1"></i>' + supName + '</span>'
                : '<span class="text-muted" style="font-size: 0.88rem;">-</span>';
              if (field.ref_invoice && field.ref_invoice.trim() !== '') {
                sourceTxt += '<div class="text-muted font-weight-normal mt-1" style="font-size: 0.8rem;"><i class="fas fa-file-invoice mr-1 text-success"></i>' + field.ref_invoice + '</div>';
              }

              $('#myUL').append('<li id="ipt-'+field.stock_id+'">' +
              '<div class="row justify-content-center ipt-even align-items-center" data-toggle="collapse" href="#detail-'+field.stock_id+'" role="button" aria-expanded="false" aria-controls="detail-'+field.stock_id+'" onclick="appendCollapse('+field.stock_id+');">'+
                  '<div class="col-1 text-center"><h5>'+no+'</h5></div>' +  
                  '<div class="col-3 text-center"><h5>'+field.stock_number+'</h5></div>' +
                  '<div class="col-3 text-center"><h5>'+date+'</h5></div>' +
                  '<div class="col-3 text-center"><h5>'+field.ware_name+'</h5></div>' +
                  '<div class="col-2 text-center"><h5>'+sourceTxt+'</h5></div>' +
              '</div>' +
            '</li>');
            no++   
            }                                               
          });                                          
        }               
      });
      start += 30;
    }   

    var val;
    function search(){
      if($('#input-search').val() == ""){
        return 0;
      }     
      val = $('#input-search').val()
      start_s = 0;
      bool_s = false;
      $("#myS").prop('hidden', false);
      $("#myUL").prop('hidden', true);     
      $("#myS").empty();
      tempdate = ""
      no = 1
      get_import_s();
    }

    function get_import_s(){
      $.ajax({
        type: "POST",
        url:"php/get_import.php",
        data: {'start': start_s, 'value' : val},
        beforeSend: function(){
          EasyLoading.show({                           
						text: "กำลังโหลด"
					});
        },

            bool_s = true
          }

              }

              $('#myS').append('<li id="ipts-'+field.stock_id+'">' +

                  '<div class="col-3 text-center"><h5>'+date+'</h5></div>' +

            no++

      start_s += 30;

    function delete_bill(im_id,ware_id){
      $.confirm({
        title: 'ลบรายการ',
        content: 'ต้องการลบรายการนี้หรือไม่?',
        backgroundDismiss: true,
        buttons: { 
          formSubmit: {
            text: 'ตกลง',
            btnClass: 'btn-danger',
            action: function () {
              // delete bill
              $.ajax({
                type: "POST",
                url:"php/delete_import.php",         
                data:{'imp_id' : im_id,'ware_id' : ware_id},
                beforeSend: function(){
                  EasyLoading.show({                           
                    text: "กำลังโหลด"
                  });
                },                       
                success: function(data){ 
                  EasyLoading.hide();
                  if(data == "success"){                    
                    $('#ipt-'+im_id).remove()
                    $('#ipts-'+im_id).remove()
                  }else{
                    $.confirm({
                      title: 'พบข้อผิดพลาด',
                      content: 'ลองอีกครั้ง',
                      backgroundDismiss: true,
                      buttons: {
                        formSubmit: {
                        text: 'ตกลง',
                        btnClass: 'btn-regis',
                        action: function () {
                        }
                        }
                      }
                    });
                  }                         
                }               
              });      
            }
          },ยกเลิก: function () {}, 
        }  
      });
    }

    function printWarehouseSlip(index){
      $.ajax({
        type: "POST",
        url: "php/get_import_info.php",
        data: {'imp_id': index},
        beforeSend: function(){
          EasyLoading.show({ text: "กำลังเตรียมพิมพ์บิล..." });
        },
        success: function(data){
          EasyLoading.hide();
          var obj = (typeof data === 'string') ? JSON.parse(data) : data;
          if(!obj || obj.length === 0) return;

          var dt = (obj[0].date_time || '').split(" ");
          var time = (dt[1] || '').substr(0, 5);
          var d = (dt[0] || '').split("-");
          var date = (d.length === 3) ? (d[2] + "/" + d[1] + "/" + d[0]) : dt[0];
          var firstRow = (obj && obj.length > 0) ? obj[0] : {};
          var sup = (firstRow.supplier_name || firstRow.source_from || '-');
          var ref = obj[0].ref_invoice ? obj[0].ref_invoice : '';
          var wareName = obj[0].ware_name || 'โกดัง';
          var canViewCost = (localStorage.user_role === "แอดมิน" || localStorage.user_role === "เจ้าของร้าน");

          var totalQty = 0;
          var totalCost = 0;
          var rowsHtml = '';

          $.each(obj, function(i, item){
            var qty = parseInt(item.amount) || 0;
            var cost = parseFloat(item.stock_cost) || 0;
            totalQty += qty;
            totalCost += (qty * cost);
            var skuText = item.supplier_sku && item.supplier_sku.trim() !== '' ? ('<br><span style="font-size: 10px; color: #555;">[SKU: ' + item.supplier_sku + ']</span>') : '';
            var codeText = item.prod_code ? ('<span style="font-size: 10px; color: #333;">(' + item.prod_code + ') </span>') : '';

            rowsHtml += "<tr>" +
              "<td style='text-align: center; vertical-align: top; padding: 4px 0;'>" + (i + 1) + "</td>" +
              "<td style='text-align: left; vertical-align: top; padding: 4px 4px;'>" + codeText + item.prod_name + skuText + "</td>" +
              "<td style='text-align: right; vertical-align: top; padding: 4px 0; font-weight: bold;'>" + qty + "</td>" +
              (canViewCost ? ("<td style='text-align: right; vertical-align: top; padding: 4px 0;'>" + cost.toLocaleString('th-TH', {minimumFractionDigits: 2}) + "</td>") : "") +
            "</tr>";
          });

          var billHtml = "<!DOCTYPE html><html><head><meta charset='utf-8'>" +
            "<title>ใบรายการนำเข้าสินค้าโกดัง - " + obj[0].stock_number + "</title>" +
