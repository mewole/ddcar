  <script>
    var bill_id,pay,dis,get,ware_id_o,type_o,total,credit_id,credit_id_new;
    arr = [];
    $(document).ready(function(){
      url = new URL(window.location.href);
      bill_id = url.searchParams.get("id"); 

      $.ajax({
        type: "POST",
        url:localStorage.pathServer + "php/get_bill_info.php",    
        data:{'bill_id' : bill_id},                            
        beforeSend: function(){
            $(".overlay").prop('hidden', false);
        },             
        success: function(data){  
          $(".overlay").prop('hidden', true);
          var obj = jQuery.parseJSON(data); 
          $('#h5-title').text(obj[0].order_number);
          if(obj[0].type == "โกดัง"){
            $('#warehouse').text(obj[0][19].ware_name);           
          }else if(obj[0].type == "หน้าร้าน"){
            $('#warehouse').text(obj[0][19].shop_name);           
          }          
          $('#cus').text(obj[0].cus_name + " ");
          $("#cus").append('<span id="type">'+obj[0].payment_type+'</span>');
          //$("#type").text(obj[0].payment_type);
          var txt = obj[0].date_time.split(" ");
          var txt2 = txt[0].split("-");
          var date = txt2[2] + "/" + txt2[1] + "/" + txt2[0].substr(2) + " " + txt[1].substr(0,5);
          $('#date').text(date);
          
          type_o = obj[0].type;
          type = obj[0].type;
          ware_id_o = obj[0].branch_id;
          ware_id = obj[0].branch_id;
          pay = obj[0].payment_type;
          dis = obj[0].total_discount;
          get = obj[0].get_price;
          total = obj[0].total_price;
          credit_id = obj[0].credit_id;
          credit_id_new = obj[0].credit_id;
          $.each(obj, function(i, field){
            $('#in-ctn').append('<div id="prod-'+field.item_id+'" class="row mgemo5">' +              
              '<div class="col-1 text-center">' +
                '<p id="amt-'+field.item_id+'" class="amount">'+field.prod_amount+'</p>' +
              '</div>' +
              '<div class="col-7 text-center nopd">' +
                '<p id="name-'+field.item_id+'" class="hover-prod-preview" data-prod-id="'+field.prod_id+'" data-prod-code="'+(field.prod_code||'')+'">'+field.prod_name+'</p>' +
                '</div>' +
                '<div class="col-2 text-center">' +
                  '<p id="price-'+field.item_id+'">'+field.prod_price+'</p>' +
                '</div>' +
                  '<div class="col-2 text-center nopd">' +
                    '<p id="total-'+field.item_id+'">'+field.prod_price*field.prod_amount+'</p>' +
                  '</div>' +
              '</div>');
            arr.push(field.prod_amount);
          });

          $('#in-ctn').append('<div class="row"><hr style="margin-top: 1em;">'+
              '<div class="col-3 text-center" style="padding-left: 0;"><h6 class="bold">หมายเหตุ</h6></div>'+
              '<div class="col-9 text-center" style="padding-right: 0;"><h7 id="ment" class="bold"></h7></div>'+
            '</div>'+
            '<div class="row">'+
              '<div class="col-6 text-center" style="padding-left: 0;"><h5 class="bold">รวม</h5></div>'+
              '<div class="col-6 text-center" style="padding-right: 0;"><h5 id="sum" class="bold"></h5></div>'+
            '</div>'+
            '<div class="row">'+
              '<div class="col-6 text-center" style="padding-left: 0;"><h5 class="bold">ลด</h5></div>'+
              '<div class="col-6 text-center" style="padding-right: 0;"><h5 id="discount" class="bold"></h5></div>'+
            '</div>'+
            '<div class="row">'+
              '<div class="col-6 text-center" style="padding-left: 0;"><h5 class="bold">สุทธิ</h5></div>'+
              '<div class="col-6 text-center" style="padding-right: 0;"><h5 id="total" class="bold"></h5></div>'+
            '</div>'+
            '<div class="row">'+
              '<div class="col-5 text-right"><h5 class="bold">รับ / ทอน</h5></div>'+
              '<div class="col-5 text-center" style="padding-right: 0;"><h5 id="get" class="bold"></h5></div>'+
              '<div class="col-2 text-center" style="padding-right: 0;"><h5 id="chng" class="bold"></h5></div>'+
            '</div>'+
            '<hr style="margin-top: 1em;">'+
            '<div id="btm-row" class="row" style="margin-bottom: 4.5em;">'+
            '<div class="col-12 text-center">'+
                '<h5 id="user">ชื่อผู้บันทึก</h5>'+
            '</div>'+
          '</div>'); 
          
          $('#sum').text(obj[0].sum_price);
          $('#discount').text(obj[0].total_discount);
          $('#total').text(obj[0].total_price);
          $('#get').text(obj[0].get_price);
          $('#chng').text(obj[0].chng);
          $('#ment').text(obj[0].comment);
          $('#user').text("ผู้ทำรายการ: " + obj[0].user_name);                                             
        }               
      });
    });   

    function disactive(arg) {
        nav_menu = ['home', 'print', 'edit', 'del'];
        
        if($("#warehouse").hasClass('underline')) {
          $(".i-del").attr('hidden', true);
          $(".amount").removeClass('underline');
          $("#discount").removeClass('underline');
          $("#type").removeClass('underline');
          $("#get").removeClass('underline');
          $("#warehouse").removeClass('underline');
          $("#warehouse").attr('onclick', '');
          $("#discount").attr('onclick', '');
          $("#type").attr('onclick', '');
          $("#get").attr('onclick', '');
          $("#i-save").attr('onclick', '');
          $("#i-save").css('color', "#e57f7f");
          // if has 3 prod then index = 3
          for(i = 1; i <= 3; i++){ $("#amt-"+i).attr('onclick', ''); }
        }


        for (i = 0; i < 4; i++) {
            if (nav_menu[i] != arg) {
                if ($("#i-" + nav_menu[i]).hasClass('active')) $("#i-" + nav_menu[i]).removeClass('active');
            }
        }
    }

    function menu(arg) {
    	// Animate
        disactive(arg);
        if($("#i-"+arg).hasClass('active')){
            //console.log("i-"+arg+"hasClass('active')");
            $("#i-"+arg).removeClass('active');
          }else{
            $("#i-" + arg).fadeOut(150).fadeIn(100, function() {
              $("#i-" + arg).addClass('active');
            });
        }
        if (arg == "add") {
            //goto = "sale.html";            
        } else if(arg == "edit"){
            // show edit all
            if ($("#warehouse").hasClass('underline')) {
              $(".i-del").attr('hidden', true);
              $(".amount").removeClass('underline');
              $("#discount").removeClass('underline');
              $("#type").removeClass('underline');
              $("#get").removeClass('underline');
              $("#warehouse").removeClass('underline');
              $("#warehouse").attr('onclick', '');
              $("#discount").attr('onclick', '');
              $("#type").attr('onclick', '');
              $("#get").attr('onclick', '');
              $("#i-save").attr('onclick', '');
              $("#i-save").css('color', "#e57f7f");
              // if has 3 prod then index = 3
              for(i = 1; i <= 3; i++){ $("#amt-"+i).attr('onclick', ''); }
            } else {
              $(".i-del").attr('hidden', true);
              $(".amount").addClass('underline');
              $("#discount").addClass('underline');
              $("#get").addClass('underline');
              $("#type").addClass('underline');
              $("#warehouse").addClass('underline');           
              $("#warehouse").attr('onclick', 'edit_warehouse()');    
              $("#discount").attr('onclick', 'edit_discount()');
              $("#type").attr('onclick', 'edit_type()');
              $("#get").attr('onclick', 'edit_get()');
              $("#i-save").attr('onclick', 'save()');
              $("#i-save").css('color', "#fff");
              for(i = 1; i <= 3; i++){ $("#amt-"+i).attr('onclick', 'edit_amount('+i+')'); }
            }
        } else if (arg == "del") {
            // show trash all 
            $("style").append(".jconfirm .jconfirm-box{margin-bottom: 5%;}");
            $.confirm({
                title: 'ลบรายการ',
                content: 'ต้องการลบบิล '+$("#h5-title").text()+' หรือไม่',
                backgroundDismiss: true,
                buttons: { 
                  formSubmit: {
                    text: 'ตกลง',
                    btnClass: 'btn-danger',
                    action: function () {
                      // delete bill
                      $.ajax({
                        type: "POST",
                        url:localStorage.pathServer + "php/delete_bill.php",         
                        data:{'bill_id' : bill_id,'b_id' : ware_id_o,'type' : type_o,'pay' : pay,'total' : total,'credit_id': credit_id},
                        beforeSend: function(){
                          $(".overlay").prop('hidden', false);
                        },                       
                        success: function(data){ 
                          $(".overlay").prop('hidden', true);                     
                          if(data == "success"){
                            window.location = 'manage_bill.html';
                          }else{
                            $.confirm({
                              title: 'พบข้อผิดพลาด',
                              content: 'ลองอีกครั้ง',
                              backgroundDismiss: true,
                              buttons: {
                                formSubmit: {
                                text: 'ตกลง',
                                btnClass: 'btn-regis',
                                action: function () {
                                }
                                }
                              }
                            });
                          }                         
                        }               
                      });      
                    }
                  },ยกเลิก: function () {}, 
                }  
            });
        }else if (arg == "print"){
          $("style").append('.jconfirm .jconfirm-box{max-height: 420px;}');
            var text_html = "";
            button1 = '<button type="button" onclick="printA4('+bill_id+')" class="btn btn-choice">ใบรายการขาย(A4)</button>';
            button2 = '<button type="button" onclick="printRecap('+bill_id+')" class="btn btn-choice">ใบเสร็จ</button>';

            text_html = button1 + button2;

              $.confirm({
                title: 'เลือกรูปแบบการพิมพ์',
                content: '<hr style="width: 80%; margin-bottom: 0;">',
                backgroundDismiss: true,
                onOpenBefore: function () {
                $(".jconfirm-buttons .btn-default").remove();
                $(".jconfirm-buttons").append(text_html);
                },
                onDestroy: function () {
                $("style").append('.jconfirm .jconfirm-box{margin-bottom: 5%;}');
                $("style").append('.jconfirm .jconfirm-box{max-height: 100%;}');

                disactive(print);
                }              
              });                                       
        }
    } 

    function edit_amount(arg){
    	$("style").append(".jconfirm .jconfirm-box{margin-bottom:60%;}");
    	$.confirm({
        title: $("#name-"+arg).text(),
        content: '<div class="row" style="margin-top: 2%; margin-bottom: 2%;"><div class="col-12 text-center" style="font-size: 110%; font-weight: bold;">จำนวน</div></div><div class="row"><div class="col-3"></div><div class="col-6 text-center"><input id="edt-amt" type="number" class="input-cf" value="'+$("#amt-"+arg).text()+'"></div><div class="col-3"></div></div>',
        backgroundDismiss: true,
        onContentReady: function () {
          var temp = $('#edt-amt').val();
          $("#edt-amt").focus().val("").val(temp);
        },
        buttons: {
          formSubmit: {
            text: 'ตกลง',
            btnClass: 'btn-danger',
            action: function () {
              var amt = $('#edt-amt').val();
              if(amt > $("#amt-"+arg).text()){
                return 0;
              }
              var sum = $('#sum').text();
              var sum_o = $('#price-'+arg).text()*$("#amt-"+arg).text();
              var sum_n = $('#price-'+arg).text()*amt;
              //var sumsum = (sum-sum_o)+sum_n;
              var total_amt = $("#amt-"+arg).text() - amt
              var sumsum = (sum-sum_n);
              var total =sumsum-$('#discount').text();
              $('#total-'+arg).text(sum_n);
              $('#sum').text(sumsum);
              $('#total').text(total);
              $('#chng').text($('#get').text()-total);
              $("#amt-"+arg).text(total_amt);              
            }
          },ยกเลิก: function () {
              //$(".jconfirm .jconfirm-box").css('margin-bottom', '5%');
            }
        }
      });
    }

    function edit_discount(){
      $("style").append(".jconfirm .jconfirm-box{margin-bottom:60%;}");
      $.confirm({
        title: "ลด",
        content: '<div class="row"><div class="col-3"></div><div class="col-6 text-center"><input id="edt-disc" type="number" class="input-cf" value="'+$("#discount").text()+'"></div><div class="col-3"></div></div>',
        backgroundDismiss: true,
        onContentReady: function () {
          var temp = $('#edt-disc').val();
          $("#edt-disc").focus().val("").val(temp);
        },
        buttons: {
          formSubmit: {
            text: 'ตกลง',
            btnClass: 'btn-danger',
            action: function () {
              var disc = $('#edt-disc').val();
              if(disc == $("#discount").text()){
                return 0;
              }
              var sum = $('#sum').text();
              if(sum-disc < 0){
                $.confirm({
                  title: 'พบข้อผิดพลาด',
                  content: 'เงินสุทธิห้ามต่ำกว่า 0',
                  backgroundDismiss: true,
                  buttons: {
                      formSubmit: {
                      text: 'ตกลง',
                      btnClass: 'btn-regis',
                      action: function () {
                      }
                      }
                  }
                });
                return 0;
              }
              $('#total').text(sum-disc);
              $('#chng').text($('#get').text()- $('#total').text());
              $("#discount").text(disc);
            }
          },ยกเลิก: function () {
              //$(".jconfirm .jconfirm-box").css('margin-bottom', '5%');
            }
          }              
      });
    }

    function edit_get(){
      $("style").append(".jconfirm .jconfirm-box{margin-bottom:60%;}");
      $.confirm({
        title: "รับ",
        content: '<div class="row"><div class="col-3"></div><div class="col-6 text-center"><input id="edt-get" type="number" class="input-cf" value="'+$("#get").text()+'"></div><div class="col-3"></div></div>',
        backgroundDismiss: true,
        onContentReady: function () {
          var temp = $('#edt-get').val();
          $("#edt-get").focus().val("").val(temp);
        },
        buttons: {
          formSubmit: {
            text: 'ตกลง',
            btnClass: 'btn-danger',
            action: function () {
              var gett = $('#edt-get').val();
              if(gett == $("#get").text()){
                return 0;
              }
              var total = $('#total').text();
              if(gett-total < 0){
                $.confirm({
                  title: 'พบข้อผิดพลาด',
                  content: 'เงินทอนห้ามต่ำกว่า 0',
                  backgroundDismiss: true,
                  buttons: {
                      formSubmit: {
                      text: 'ตกลง',
                      btnClass: 'btn-regis',
                      action: function () {
                      }
                      }
                  }
                });
                return 0;
              }
              $('#chng').text(gett-total);
              $("#get").text(gett);
            }
          },ยกเลิก: function () {
              //$(".jconfirm .jconfirm-box").css('margin-bottom', '5%');
            }
        }
      });
    }

    function edit_type(){
      $.confirm({
        title: 'การชำระเงิน',
        content: '<hr style="width: 80%; margin-bottom: 0;">',
        backgroundDismiss: true,
        buttons: {
          form1: {
            text: 'เงินสด',
            btnClass: 'btn-choice',
            action: function () {
              credit_id_new = 0;                       
              $('#type').text('เงินสด');
            }
          },
          form2: {
            text: 'เครดิต (30)',
            btnClass: 'btn-choice',
            action: function () {
              credit_id_new = credit_id;
              $('#type').text('เครดิต (30)');
            }
          },
          form3: {
            text: 'เครดิต (60)',
            btnClass: 'btn-choice',
            action: function () {
              credit_id_new = credit_id;
              $('#type').text('เครดิต (60)');
            }
          },
          form4: {
            text: 'เครดิต (90)',
            btnClass: 'btn-choice',
            action: function () {
              credit_id_new = credit_id;
              $('#type').text('เครดิต (90)');
            }
          }
        }
      });
    }

    function edit_warehouse(){
      $("style").append('.jconfirm .jconfirm-box{max-height: 420px;}');
        $.confirm({
          title: 'หน้าร้าน/โกดัง',
          content: '<hr style="width: 80%; margin-bottom: 0;">',
          backgroundDismiss: true,
          onOpenBefore: function () {
            $(".jconfirm-buttons .btn-default").remove();
            //ajax and apeend
            $.ajax({
              type: "GET",
              url:localStorage.pathServer + "php/get_ware_shop.php",     
              beforeSend: function(){
                  $(".overlay").prop('hidden', false);
              },                        
              success: function(data){
              $(".overlay").prop('hidden', true);  
                  var obj = jQuery.parseJSON(data);
                  if(obj){
                      $.each(obj, function(i, field){   
                          if(obj[i][2] == "โกดัง"){  
                              $(".jconfirm-buttons").append('<button id="li-ware-'+i+'" type="button" onclick="setware('+i+')" class="btn btn-choice">'+obj[i].ware_name+'</button>' +
                              '<span id="id-ware-'+i+'" hidden>'+obj[i].ware_id+'</span>' +
                              '<span id="type-'+i+'" hidden>โกดัง</span>');                       
                          }else if(obj[i][2] == "หน้าร้าน"){ 
                              $(".jconfirm-buttons").append('<button id="li-ware-'+i+'" type="button" onclick="setware('+i+')" class="btn btn-choice">'+obj[i].shop_name+'</button>' +
                              '<span id="id-ware-'+i+'" hidden>'+obj[i].shop_id+'</span>' +
                              '<span id="type-'+i+'" hidden>หน้าร้าน</span>');
                          }                    
                      });   
                  }else{
                      $(".jconfirm-buttons").append("กรุณาเพิ่มหน้าร้าน/โกดังก่อนทำรายการ");     
                  }                                                      
              }               
            });                    
          },
          onDestroy: function () {
            $("style").append('.jconfirm .jconfirm-box{margin-bottom: 5%;}');
            $("style").append('.jconfirm .jconfirm-box{max-height: 100%;}');
          }             
        });
    }

    var ware_id,type;
    function setware(arg) {
      ware = $("#li-ware-" + arg).text();
      type = $("#type-" + arg).text();
      $("#warehouse").text(ware);
      ware_id = $("#id-ware-" + arg).text();  
      document.elementFromPoint(0, 0).click();        
    }

    function save(){
      arr_data = [];
      var f = false;      
      if(pay == $('#type').text() && dis == $('#discount').text() && get == $('#get').text() && 
      ware_id == ware_id_o && type == type_o){
        f = true;       
      }     
      var ch = 0;
      for(var i = 0;i < arr.length;i++){       
        if($("#amt-"+(i+1)).text() == arr[i]){
          ch++;
          item = {}            
          item ["item_id"] = i+1;
          item ["amt"] =  $("#amt-"+(i+1)).text();
          item ["ch"] = 0;
          arr_data.push(item);
        }else{
          item = {}            
          item ["item_id"] = i+1;
          item ["amt"] =  $("#amt-"+(i+1)).text();
          item ["ch"] = 1;
          arr_data.push(item);
        }        
      }        
      if(ch == arr.length && f){
        return 0;
      }
      if($('#total').text() < 0 || $('#chng').text() < 0){
        $.confirm({
          title: 'พบข้อผิดพลาด',
          content: 'เงินสุทธิหรือเงินทอนห้ามต่ำกว่า 0',
          backgroundDismiss: true,
          buttons: {
              formSubmit: {
              text: 'ตกลง',
              btnClass: 'btn-regis',
              action: function () {
              }
              }
          }
        });
        return 0;
      }
      var json_string = JSON.stringify(arr_data); 
      var dataString =  "JSON=" + json_string + "&bill_id=" + bill_id + "&pay=" + $('#type').text() + "&sum=" + $('#sum').text()
      + "&dis=" + $('#discount').text() + "&total=" + $('#total').text() + "&get=" + $('#get').text() + "&chng=" + $('#chng').text()
      + "&b_id=" + ware_id + "&type=" + type + "&credit_id=" + credit_id_new;
      //alert(dataString);
      $.ajax({
        type: "POST",
        url:localStorage.pathServer + "php/rename_bill.php",         
        data: dataString,
        beforeSend: function(){
          $(".overlay").prop('hidden', false);
        },                       
        success: function(data){ 
          $(".overlay").prop('hidden', true);                     
          if(data == "success"){                    
            location.reload();
          }else{
            $.confirm({
              title: 'พบข้อผิดพลาด',
              content: 'ลองอีกครั้ง',
              backgroundDismiss: true,
              buttons: {
                  formSubmit: {
                  text: 'ตกลง',
                  btnClass: 'btn-regis',
                  action: function () {
                  }
                  }
              }
            });
          }                         
        }               
      });
    }

    function printA4(index){
      arr_a4 = [];		 
      var contentP = ""    
      var texta4 = "";
      var c = 1;
      $.ajax({
          type: "POST",
          url:localStorage.pathServer + "php/get_bill_info4print.php",    
          data:{'bill_id' : index},
          async:false,                            
          beforeSend: function(){
