	<script>
		arr_prod = [];
	var num_prod = 0,from,p = 0,last_node = 0,order_by="ASC",order_code="ASC",order_name="ASC";
  	$(document).ready(function() {
		if(!localStorage.user_id){
			window.location = 'web_login.html';
		} 
		localStorage.stack_folder = "";
		url = new URL(window.location.href);		
		from = url.searchParams.get("from");

		// Context banner when navigating from POS, stock, etc.
		if (from) {
			var fromMeta = {

				'sale': { name: 'ขายสินค้า (POS)', url: 'web_sale.html', icon: 'fa-shopping-cart' },

			$('#context-banner').html(

				'</div>' +
				'<a href="' + meta.url + '" class="btn-context-back">' +
					'<i class="fas fa-chevron-left mr-1"></i> ย้อนกลับไป' + meta.name +
				'</a>'

		// Real-time Brand quick search filter
		$(document).on('input', '#brand-filter', function() {
			var q = $(this).val().toLowerCase().trim();

		$.ajax({
			type: "POST",
			url:"php/get_folder.php",
			crossDomain: true,
			data: {'parent' : "car"},  
			beforeSend: function(){
				EasyLoading.show({                           
						text: "กำลังโหลด"                            
					});			
			},             
			success: function(data){  
				EasyLoading.hide();			          
				var obj;
				try {
					obj = (typeof data === "object") ? data : jQuery.parseJSON(data);
				} catch(e) {
					console.error("Parse JSON error in brand load:", e, data);
					obj = null;
				}
				if(obj && obj.length > 0){
					if(obj[obj.length - 1] === "last node"){
						obj.pop();
					}
					obj.sort(function(a, b) {
						var titleA = (a && a.title) ? String(a.title).trim() : "";
						var titleB = (b && b.title) ? String(b.title).trim() : "";
						return titleA.localeCompare(titleB, 'en', { numeric: true, sensitivity: 'base' });
					});
					$.each(obj, function(i, field){

		var target_folder = url.searchParams.get("folder");

	function next(){

		  $.confirm({
			  title: 'แจ้งเตือน',
			  content: 'กรุณาเลือกสินค้าอย่างน้อย 1 รายการก่อนดำเนินการต่อ',

				  }
			  }
		  });

	  }
	  json = [];
      for(var i = 0 ; i < arr_prod.length ; i++){
        if(arr_prod[i].prod_id != 0){
            item = {}
            item["prod_id"] = arr_prod[i].prod_id;  
			item["name"] = arr_prod[i].name;  
			item["img"] = arr_prod[i].img;          
            json.push(item);               
        }
      }		
      if(from == "import"){
          localStorage.setItem('arr_prod_i', JSON.stringify(json)); 
          window.location = "web_import.html";
        }else if(from == "export"){
          localStorage.setItem('arr_prod_e', JSON.stringify(json)); 
          window.location = "web_export.html";
        }else if(from == "sale"){
          localStorage.setItem('arr_prod_s', JSON.stringify(json)); 
          window.location = "web_sale.html";
        }else if(from == "stock"){
          localStorage.setItem('arr_prod_st', JSON.stringify(json)); 
          window.location = "web_stock.html";
        }else if(from == "qr"){
          localStorage.setItem('arr_prod_qr', JSON.stringify(json)); 
          window.location = "web_qrprint.html";
        }else if(from == "transfer"){
          localStorage.setItem('arr_prod_tr', JSON.stringify(json));

	var parent;
	function showsub(arg,arg2,order_wat){
		parent = arg;		
		console.log(arg);
		if(arg2){		
			$(".prod-title").empty();
			localStorage.stack_folder = "";
			$('.prod-title').append(
				'<div id="st">' +
					'<span id="i-back" onclick="page_back();" title="ย้อนกลับ" hidden><i class="fas fa-angle-left"></i></span>' +
				'</div>' +
				'<div class="d-flex align-items-center ml-auto">' +
					'<i id="i-prod-add" class="fas fa-plus-circle" title="เพิ่มรายการ/สินค้า" onclick="addprod()"></i>' +
					'<i class="fas fa-pen" title="แก้ไขรายการ" onclick="editprod();"></i>' +
					'<i class="fas fa-trash" title="ลบรายการ" onclick="removeprod();"></i>' +
				'</div>'
			);

			$('.brand').removeClass('active-brand');
			$('.brand').filter(function() {
				return $(this).text().trim() === String(arg).trim();
			}).addClass('active-brand');

			$('#prod-empty-state').hide();
			$('#col-prod').prop('hidden', false);
			$('.prod-title').show();
			$('#append-prod').show();
		}
		if(localStorage.stack_folder){
			var retrievedObject = localStorage.getItem('stack_folder');
			var arr_data = JSON.parse(retrievedObject); 			
			$('#i-back').prop('hidden',false);
			if(arr_data.length == 0){
				var arr_data = [];    
				$('#i-back').prop('hidden',true); 
			} 
		}else{
			var arr_data = [];    
			$('#i-back').prop('hidden',true);   
		}
		arr_data.push(arg); 
		localStorage.setItem('stack_folder', JSON.stringify(arr_data));		
		$("#append-prod").empty();

		var safeId = String(arg).replace(/"/g, '&quot;');
		var safeArg = String(arg).replace(/'/g, "\\'").replace(/"/g, "&quot;");
		$('#st').append('<span id="'+safeId+'" onclick="page_back(\''+safeArg+'\')"><i class="fas fa-folder mr-1 text-warning"></i>'+arg+'</span>');		
		p = 0;
		$.ajax({
			type: "POST",
			url:"php/get_folder_web.php",
			crossDomain: true,
			data: {'parent' : arg,
							'order_by' : order_by},  
			beforeSend: function(){
				EasyLoading.show({                           
						text: "กำลังโหลด"                            
					});			
			},             
			success: function(data){  
				EasyLoading.hide();
				$('#col-prod').prop('hidden',false);				
				if(data != "last node"){					
					var obj;
					try {
						obj = (typeof data === "object") ? data : jQuery.parseJSON(data);
					} catch(e) {
						console.error("Parse JSON error:", e, data);
						obj = null;
					}
					if(!obj || obj.length === 0){
						last_node = 2;
						return;
					}
					var isLastNode = (obj[obj.length-1] === "last node");
					if(isLastNode){
						obj.pop();
						var escapedParent = String(parent || '').replace(/'/g, "\\'").replace(/"/g, "&quot;");
						$("#append-prod").append(
							'<div id="head-prod">' +
								'<span style="width: 32px;"></span>' +
								'<a onclick="sort_prod(\''+escapedParent+'\',\'code\')"><i class="fas fa-sort text-muted mr-1"></i>รหัสสินค้า</a>' +
								'<span style="margin: 0 16px;"></span>' +
								'<a onclick="sort_prod(\''+escapedParent+'\',\'name\')"><i class="fas fa-sort text-muted mr-1"></i>ชื่อสินค้า</a>' +
								'<span class="ml-auto text-muted d-none d-sm-inline" style="font-size: 0.8rem; font-weight: normal;"><i class="fas fa-info-circle mr-1"></i>คลิกเพื่อเลือก / ชี้เพื่อดูรูป</span>' +
							'</div>'
						);
						if(order_wat == "code"){
							if(order_code == "ASC"){
								obj.sort(function(a,b) {
									var codeA = (a && a.prod_code) ? String(a.prod_code) : "";
									var codeB = (b && b.prod_code) ? String(b.prod_code) : "";
									return codeA.localeCompare(codeB, undefined, { numeric: true });
								});
								order_code="DESC";
							}else if(order_code == "DESC"){
								obj.sort(function(a,b) {
									var codeA = (a && a.prod_code) ? String(a.prod_code) : "";
									var codeB = (b && b.prod_code) ? String(b.prod_code) : "";
									return codeB.localeCompare(codeA, undefined, { numeric: true });
								});
								order_code="ASC";
							}							
						}else if(order_wat == "name"){
							if(order_name == "ASC"){
								obj.sort(function(a,b) {
									var nameA = (a && a.prod_name) ? String(a.prod_name) : "";
									var nameB = (b && b.prod_name) ? String(b.prod_name) : "";
									return nameA.localeCompare(nameB, 'th', { numeric: true, sensitivity: 'base' });
								});
								order_name="DESC";
							}else if(order_name == "DESC"){
								obj.sort(function(a,b) {
									var nameA = (a && a.prod_name) ? String(a.prod_name) : "";
									var nameB = (b && b.prod_name) ? String(b.prod_name) : "";
									return nameB.localeCompare(nameA, 'th', { numeric: true, sensitivity: 'base' });
								});
								order_name="ASC";
							}			
						}else{
							obj.sort(function(a,b) {
								var codeA = (a && a.prod_code) ? String(a.prod_code) : "";
								var codeB = (b && b.prod_code) ? String(b.prod_code) : "";
								return codeA.localeCompare(codeB, undefined, { numeric: true });
							});
							order_code="DESC";
						}
						
						$.each(obj, function(i, field){					
							var cls = (i % 2 === 0) ? "prod-odd" : "prod-even";
							text_html = '<h5 id="prod-'+p+'" class="'+cls+'" rel="popover" data-img="'+obj[i].img+'" onclick="choose('+p+')"><span id="id-'+p+'" hidden>'+obj[i].prod_id+'</span><input type="checkbox"><span id="span-code-'+p+'">'+obj[i].prod_code+'</span><span id="span-name-'+p+'">'+obj[i].prod_name+'</span><i class="fas fa-trash i-trash" hidden></i><i class="fas fa-pen i-edit" hidden></i><i class="fas fa-map-marker-alt i-modal" title="ที่อยู่สินค้า (โกดัง/หน้าร้าน)" data-toggle="modal" data-target="#detailModal" onclick="hideclick('+p+');"></i></h5>';
							$("#append-prod").append(text_html + "<script>" +
								"$('#prod-"+p+"[rel=popover]').popover({" +
								"html: true," +
								"trigger: 'hover'," +
								"placement: 'left'," +
								"content: function(){" +
								"return '<img src='+$(this).data('img')+'>';}" +
								"});" +
							"</" + "script>");
							p++;
						});  
						last_node = 1;
					}else{
						order_code="ASC";
						order_name="ASC";
						// Sort subfolders alphabetically with support for English & Thai
						obj.sort(function(a, b) {
							var titleA = (a && a.title) ? String(a.title).trim() : "";
							var titleB = (b && b.title) ? String(b.title).trim() : "";
							var res = titleA.localeCompare(titleB, 'en', { numeric: true, sensitivity: 'base' });
							return (order_by === "DESC") ? -res : res;
						});
						$.each(obj, function(i, field){
							var escapedTitle = String(obj[i].title || '').replace(/'/g, "\\'").replace(/"/g, "&quot;");
							var cls = (i % 2 === 0) ? "prod-odd list" : "prod-even list";
							text_html = '<h5 class="'+cls+'" data-title="'+escapedTitle+'" onclick="showsub(\''+escapedTitle+'\')"><i class="fas fa-folder"></i><span>'+ obj[i].title +'</span><i class="fas fa-chevron-right ml-auto text-muted" style="font-size: 0.8rem;"></i><i class="fas fa-trash i-trash" hidden></i><i class="fas fa-pen i-edit" hidden></i></h5>';
							$("#append-prod").append(text_html);							
						});  
						last_node = 0;             
					}
				}else{				
					last_node = 2;
				}			          
								                          
			}               
		});
	}

	function choose(arg2){
		arg = $('#prod-'+arg2).find('input[type=checkbox]');
		name = $('#span-name-'+arg2).text();
		prod_id = $('#id-'+arg2).text();
		img = $('#prod-'+arg2).data('img');		
		check = arg.prop('checked');	
		isenable = !arg.is(":disabled");
		if(check == false && isenable){			
			var ch = false;
			for(var i = 0 ; i < arr_prod.length ; i++){
				if(arr_prod[i].prod_id == prod_id){
					// arr_prod[i].prod_id = 0;
					alert("เลือกไปแล้ว");
					ch = true;
					break;
				}
			}
			if(!ch){         
				arg.prop('checked', true); 
				$('#prod-'+arg2).addClass('is-checked');
				item = {};   
				item ["arg"] = arg2;        
				item ["prod_id"] = prod_id; 
				item ["name"] = name;   
				item ["img"] = img;        
				arr_prod.push(item); 
				num_prod++;				
				$('#btn-next').html('<i class="fas fa-check-circle mr-1"></i> ยืนยันเลือกสินค้า ('+num_prod+')');
				$('#lbl-count').text(num_prod);           
			}
		}else if(isenable){
			arg.prop('checked', false);
			$('#prod-'+arg2).removeClass('is-checked');
			for(var i = 0 ; i < arr_prod.length ; i++){
				if(arr_prod[i].prod_id == prod_id){
					arr_prod[i].prod_id = 0;
					break;
				}
			} 
			num_prod--;
			$('#btn-next').html('<i class="fas fa-check-circle mr-1"></i> ยืนยันเลือกสินค้า ('+num_prod+')');
			$('#lbl-count').text(num_prod);
		}
	}

	function sort_prod(arg,type){
		var retrievedObject = localStorage.getItem('stack_folder');
		var arr_data = retrievedObject ? JSON.parse(retrievedObject) : []; 	
		if(arr_data.length > 0){
			var element = document.getElementById(arr_data[arr_data.length-1]);
			if(element) $(element).remove();				
			arr_data.splice(arr_data.length-1,1);
			localStorage.setItem('stack_folder', JSON.stringify(arr_data));		
		}
		showsub(arg,"",type);
	}

	function page_back(arg){
		var retrievedObject = localStorage.getItem('stack_folder');
		var arr_data = retrievedObject ? JSON.parse(retrievedObject) : []; 
		if(arg){
			for(var i = 1 ; i <= arr_data.length ; i++){
				var element = document.getElementById(arr_data[arr_data.length-i]);
				if(element) $(element).remove();				
				if(arr_data[arr_data.length-i] == arg){
					if(i == 1){
						if(order_by == "ASC"){
							order_by = "DESC";
						}else if(order_by == "DESC"){
							order_by = "ASC";
						}						
					}
					arr_data.splice(arr_data.length-i,i);
					break;
				}				
			}			
			localStorage.setItem('stack_folder', JSON.stringify(arr_data));  
			showsub(arg);
		}else{
			if(arr_data.length >= 2){
				for(var i = 1 ; i <= 2 ; i++){	
					var element = document.getElementById(arr_data[arr_data.length-i]);
					if(element) $(element).remove();
				}
				var data = arr_data[arr_data.length-2];		
				arr_data.splice(arr_data.length-2,2);
				localStorage.setItem('stack_folder', JSON.stringify(arr_data));  
				showsub(data);	
			}
		}
			
	}

  	function removebrand(arg){
  		//Clear
  			$(".brand").removeClass('editbrand');
  			addbrandcancle();

					// Take image from top left corner to bottom right corner and draw the image
					// on canvas to completely fill into.
					ctx.drawImage(this, 0, 0, tempImg.width, tempImg.height, 0, 0, width, height);

					b64 = canvas.toDataURL("image/jpeg");				
					//console.log(b64)
				};			
			}	
			setTimeout(function() {
				$.ajax({
					type: "POST",
					url:"php/rename_prod_web.php",

						'img' : b64},

						EasyLoading.show({                           
							text: "กำลังโหลด"                            
						});

					success: function(data){
						EasyLoading.hide();					                          
						if(data == "success"){
							$("#newprod-"+arg).remove();
							$("#span-name-"+arg).text(name);
							$("#span-code-"+arg).text(barcode);
							if(b64){
								$('#prod-'+arg).data('img', b64);
							}							
							$("#prod-"+arg).prop('hidden', false);						
						}else{
							$.confirm({
							title: 'พบข้อผิดพลาด',
							content: 'ลองอีกครั้ง',
							backgroundDismiss: true,
							buttons: {
								formSubmit: {
								text: 'ตกลง',
								btnClass: 'btn-regis',
								action: function () {
								}
								}
							}
							});
						}
					}               
				});
			}, 1000);		
			
		}		
  	}

  	function editprodcancle(old_name,code,arg){		  
		  if(last_node == 0){
			$("#editprod").remove();
			$(".invis").data('title', old_name);
			var safeOld = String(old_name).replace(/'/g, "\\'").replace(/"/g, "&quot;");
			$(".invis").attr('onclick', 'showsub(\'' + safeOld + '\')');
			$(".invis").text(old_name);
			$(".invis").prepend('<i class="fas fa-folder"></i>');
			$(".invis").append('<i class="fas fa-trash i-trash" hidden></i><i class="fas fa-pen i-edit"></i>');
			$(".invis").prop('hidden', false);
			$(".list").removeClass('invis');
		  }else if(last_node == 1){
			$("#newprod-"+arg).remove();
			$("#span-name-"+arg).text(old_name);
			$("#span-code-"+arg).text(code);		
			$("#prod-"+arg).prop('hidden', false);
		  } 
  	}

  	function editprod(){
  		if($(".i-edit").is(":visible")){
  			$(".i-edit").prop('hidden', true);
  			$("input[type='checkbox']").prop('disabled', false);
  			for(var j = 0; j < p; j++){
  			  	$("#prod-"+j).attr('onclick', 'choose('+j+')');
			}
			$(".list").each(function(){
				var t = $(this).data('title') || $(this).text().trim();
				var safeT = String(t).replace(/'/g, "\\'").replace(/"/g, "&quot;");
				$(this).attr('onclick', 'showsub(\'' + safeT + '\')');
			});
  			return 0;
  		}
  		$("input[type='checkbox']").prop('disabled', true);
  		$(".i-edit").prop('hidden', false);
  		for(var i = 0; i < p; i++){
  			$("#prod-"+i).attr('onclick', 'editspcfprod('+i+')');
		}
		$(".list").attr('onclick', 'editspcfprod($(this))');
  	}

	function readURL() {
		var input = document.getElementById("fileSelect");
      	if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
          $('#fileSelect').data('img', e.target.result);
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

	function select_img(){
		console.log("select")	
		readURL(); //set data-img of ch

		$('#fileSelect[rel=popover]').popover({
			html: true,
			trigger: 'hover',
			placement: 'right',
			content: function() {
			return '<img src=' + $(this).data('img') + '>';
			}
		});		  
	}

	var hide_func, hide_index;
	function hideclick(arg){
		hide_index = arg;
		hide_func = $("#prod-"+arg).attr("onclick");
		$("#prod-"+arg).attr("onclick", "");

		$('#ware').empty();
		$('#shop').empty();
		$.ajax({
			type: "GET",
			url:"php/get_ware_shop.php",                            
			beforeSend: function(){
				EasyLoading.show({                           
					text: "กำลังโหลด"                            
				});
			},             
			success: function(data){  
				EasyLoading.hide();
				var obj = jQuery.parseJSON(data); 
				if(obj){
					$.each(obj, function(i, field){							
						if(obj[i][2] == "โกดัง"){  						
							$('#ware').append('<a class="dropdown-item" href="#" onclick="setware('+field.ware_id+',\''+field.ware_name+'\','+arg+')">'+field.ware_name+'</a>');
						}else if(obj[i][2] == "หน้าร้าน"){ 						
							$('#shop').append('<a class="dropdown-item" href="#" onclick="setshop('+field.shop_id+',\''+field.shop_name+'\','+arg+')">'+field.shop_name+'</a>');
						}										
					}); 
				}
			}               
		}); 
	}

	var iw = 0;
	var is = 0;
	var ware_id;
	var shop_id;
	function setware(id,name,arg){
		$('#btn-ware').text(name);
		prod_id = $('#id-'+arg).text();
		ware_id = id;
		
		$('#addr-ware').empty();
		$('#input-addr-ware').empty();
		$.ajax({
			type: "POST",
			url:"php/get_place.php",
			data: {'prod_id':prod_id,'ware_id':id},                            
			beforeSend: function(){
				EasyLoading.show({                           
					text: "กำลังโหลด"                            
				});
			},             
			success: function(data){  
				EasyLoading.hide();
				var obj = jQuery.parseJSON(data); 
				if(obj.length > 0){
					$.each(obj, function(i, field){							
						$('#addr-ware').append('<div id="ware-shop-'+i+'" class="col-4 text-center">'+field.place+'</div>');
						$('#input-addr-ware').append('<div id="ware-'+i+'" class="col-4 input-group-append align-items-end">'+
							'<input id="input-ware-'+i+'" type="text" class="form-control form-control-sm" style="margin-right: 2px;">'+
							'<button onclick="removeplace('+i+','+prod_id+','+id+',\'ware\')" type="button" class="btn btn-sm btn-danger" style="height: 40%; margin-bottom: 8%;"><i class="fas fa-times-circle"></i></button>'+
						'</div>');
					iw = i+1;
					}); 
				}
			}               
		}); 
	}

	function setshop(id,name,arg){
		$('#btn-shop').text(name);
		prod_id = $('#id-'+arg).text();	
		shop_id = id;	

		$('#addr-shop').empty();
		$('#input-addr-shop').empty();
		$.ajax({
			type: "POST",
			url:"php/get_place.php",
			data: {'prod_id':prod_id,'shop_id':id},                            
			beforeSend: function(){
				EasyLoading.show({                           
					text: "กำลังโหลด"                            
				});
			},             
			success: function(data){  
				EasyLoading.hide();
				var obj = jQuery.parseJSON(data); 
				if(obj.length > 0){
					$.each(obj, function(i, field){							
						$('#addr-shop').append('<div id="name-shop-'+i+'" class="col-4 text-center">'+field.place+'</div>');
						$('#input-addr-shop').append('<div id="shop-'+i+'" class="col-4 input-group-append align-items-end">'+
							'<input id="input-shop-'+i+'" type="text" class="form-control form-control-sm" style="margin-right: 2px;">'+
							'<button onclick="removeplace('+i+','+prod_id+','+id+',\'shop\')" type="button" class="btn btn-sm btn-danger" style="height: 40%; margin-bottom: 8%;"><i class="fas fa-times-circle"></i></button>'+
						'</div>');
					is = i+1;							
					}); 
				}
			}               
		}); 
	}

	function removeplace(index,prod_id,id,type){
		if(type == "ware"){
			datastr = {'prod_id':prod_id,'ware_id':id};
		}else if(type == "shop"){
			datastr = {'prod_id':prod_id,'shop_id':id};
		}
		
		$.confirm({
		icon: 'fa fa-warning',
			title: 'ลบ',
			content: 'ต้องการลบออกจากรายการใช่หรือไม่!',
			buttons: {
				danger: {
					btnClass: 'btn-danger',
					text: 'ลบ',
					action: function () {	
						$.ajax({
							type: "POST",
							url:"php/delete_place.php",           
							data: datastr,               
							beforeSend: function(){
								EasyLoading.show({                           
									text: "กำลังโหลด"                            
								});	
							},             
							success: function(data){  
								EasyLoading.hide();                           
								if(data == "success"){
									if(type == "ware"){
										$("#name-ware-"+index).remove();
										$("#ware-"+index).remove();		
									}else if(type == "shop"){
										$("#name-shop-"+index).remove();
										$("#shop-"+index).remove();			
									}														
								}else{
									$.confirm({
										title: 'พบข้อผิดพลาด',
										content: 'ลองอีกครั้ง',
										backgroundDismiss: true,
										buttons: {
										formSubmit: {
											text: 'ตกลง',
											btnClass: 'btn-regis',
											action: function () {
											}
										}
										}
									});
								}                               
							}               
						});									
					}
				},
				ยกเลิก: function () {},
			}
		});
	}

	function showclick(){
		$("#prod-"+hide_index).attr("onclick", hide_func);
		hide_func = "";

		arr = [];
		for(var i = 0 ; i < iw ; i++){
			addr_ware = $('#input-ware-'+i).val()
			if(addr_ware != ""){
				item = {};                 
				item ["prod_id"] = $('#id-'+hide_index).text();                  
				item ["id"] =  ware_id;       
				item ["addr"] =  addr_ware;    
				item ["type"] =  "ware";      

				arr.push(item); 
			}			
		}
		for(var j = 0 ; j < is ; j++){
			addr_shop = $('#input-shop-'+j).val()
			if(addr_shop != ""){
				item = {};                 
				item ["prod_id"] = $('#id-'+hide_index).text();                  
				item ["id"] =  shop_id;       
				item ["addr"] =  addr_shop;    
				item ["type"] =  "shop";      

				arr.push(item); 
			}			
		}
		jsonstr = JSON.stringify(arr);
		$.ajax({
			type: "POST",
			url:"php/rename_place.php",           
			data: {'JSON' : jsonstr},               
			beforeSend: function(){
				EasyLoading.show({                           
					text: "กำลังโหลด"                            
				});
			},             
			success: function(data){ 
				EasyLoading.hide();       
				if(data == "success"){					                    
				
				}else{
					$.confirm({
						title: 'พบข้อผิดพลาด',
						content: 'ลองอีกครั้ง',
						backgroundDismiss: true,
						buttons: {
						formSubmit: {
							text: 'ตกลง',
							btnClass: 'btn-regis',
							action: function () {
							}
						}
						}
					});
				}  
			}               
		});  

		$('#btn-ware').text("เลือกโกดัง");
		$('#btn-shop').text("เลือกหน้าร้าน");
		$('#addr-ware').empty();
		$('#input-addr-ware').empty();
		$('#addr-shop').empty();
		$('#input-addr-shop').empty();
		iw = 0;
		is = 0;
	}

	$(document).on("hidden.bs.modal", '#detailModal', function() {	
		$("#prod-"+hide_index).attr("onclick", hide_func);
		hide_func = "";

		$('#btn-ware').text("เลือกโกดัง");
		$('#btn-shop').text("เลือกหน้าร้าน");
		$('#addr-ware').empty();
		$('#input-addr-ware').empty();
		$('#addr-shop').empty();
		$('#input-addr-shop').empty();
		iw = 0;
		is = 0;
	});

  </script>
</head>

							<div class="dropdown">
								<button class="btn btn-sm btn-outline-dark dropdown-toggle" type="button" id="btn-shop" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
