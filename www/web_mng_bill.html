    <style>
    body{color: var(--text-primary);}
    .bill-odd, .bill-even{
      padding-top: 14px; padding-bottom: 14px; color: var(--text-primary); margin-bottom: 8px; cursor: pointer;

      letter-spacing: 2px;

      list-style-type: none;

  <script>
    var start = start_s = 0;
    var bool = bool_s = false;    
    $(document).ready(function(){
      if(!localStorage.user_id){
				window.location = 'web_login.html';
			}      
      get_bill();    

      window.addEventListener('scroll', () => { 
        // Calculate the scroll position 
        const scrollPosition = window.scrollY + window.innerHeight; 
        const documentHeight = document.documentElement.scrollHeight; 
    
        // Check if the user has scrolled to the bottom
        //console.log(scrollPosition)
        //console.log(documentHeight)
        if (scrollPosition >= documentHeight - 1) { 
          if(!$("#myUL").prop('hidden')){
              if(bool){
                return 0;
              }
              get_bill();            
            }else if(!$("#myS").prop('hidden')){
              if(bool_s){
                return 0;
              }
              get_bill_s();
            }
        } 
      }); 
      
    });


    $(document).keydown(function(objEvent) {
      if (objEvent.keyCode == 13) {  // enter pressed
        if (!$(objEvent.target).is('#in-amt, #in-price, textarea')) {
          objEvent.preventDefault();        
          search();       
        }
      }         
    });

    var val_bill_prod = "";
    var val_cus = "";
    function search(){
      var bill_prod = ($('#input-search-bill-prod').val() || '').trim();
      var cus = ($('#input-search-cus').val() || '').trim();

      if(bill_prod === "" && cus === ""){
        reset_search();
        return;
      }

      val_bill_prod = bill_prod;
      val_cus = cus;
      start_s = 0;
      bool_s = false;
      $("#myS").prop('hidden', false);
      $("#myUL").prop('hidden', true);     
      $("#myS").empty();
      tempdate = "";
      no = 1;
      get_bill_s();
    }

    function reset_search(){
      $('#input-search-bill-prod').val('');
      $('#input-search-cus').val('');
      val_bill_prod = "";
      val_cus = "";
      start_s = 0;
      bool_s = false;
      $("#myS").empty();
      $("#myS").prop('hidden', true);
      $("#myUL").prop('hidden', false);
    }

    var tempdate,no = 1
    function get_bill(){
      console.log(start)
      $.ajax({
        type: "POST",
        url:"php/get_bill.php",
        data: {'start': start},
        beforeSend: function(){
          EasyLoading.show({                           
						text: "กำลังโหลด"
					});
        },                       
        success: function(data){ 
          EasyLoading.hide();
          var obj = jQuery.parseJSON(data);
          if(obj[0] == "last"){
            bool = true
          }
          $.each(obj, function(i, field){
            if(i > 0){
              var txt = field.date_time.split(" ");
              var txt2 = txt[0].split("-");
              var date = txt2[2] + "/" + txt2[1] + "/" + txt2[0].substr(2);
              if(tempdate != date){
                  tempdate = date
                  no = 1
              }
              $('#myUL').append(' <li id="bill-'+field.order_id+'">' +
                    '<div class="row justify-content-center bill-even" data-toggle="collapse" href="#detail-'+field.order_id+'" role="button" aria-expanded="false" aria-controls="detail-'+field.order_id+'" onclick="appendCollapse('+field.order_id+');">' +
                        '<div class="col-2 text-center"><h5>'+no+'</h5></div>' +  
                        '<div class="col-4 text-center"><h5>'+field.order_number+'</h5></div>' +
                        '<div class="col-2 text-center"><h5>'+date+'</h5></div>' +
                        '<div class="col-4 text-center"><h5>'+field.cus_name+'</h5></div>' +
                    '</div>' +
                '</li>');
                no++
            }                                                
          });                                         
        }               
      });
      start += 30;
    }

    function get_bill_s(){
      console.log(start_s);
      $.ajax({
        type: "POST",
        url: "php/get_bill.php",
        data: {
          'start': start_s, 
          'bill_prod': val_bill_prod,
          'cus_name': val_cus
        },
        beforeSend: function(){
          EasyLoading.show({                           
            text: "กำลังโหลด"
          });
        },                       
        success: function(data){ 
          EasyLoading.hide();
          var obj = jQuery.parseJSON(data);
          if(!obj || obj.length === 0 || obj[0] == "last"){
            bool_s = true;
          }
          if(start_s === 0 && (!obj || obj.length <= 1)){
            $('#myS').html('<li class="text-center py-5 text-muted" style="list-style:none;">' +
              '<i class="fas fa-search fa-3x mb-3 text-secondary" style="opacity: 0.4;"></i>' +
              '<h5 class="text-muted font-weight-bold">ไม่พบรายการบิลที่ตรงกับการค้นหา</h5>' +
              '<p class="small text-muted mb-0">ลองตรวจสอบเลขที่บิล, ชื่อสินค้า หรือชื่อลูกค้าอีกครั้ง</p>' +
            '</li>');
            return;
          }
          $.each(obj, function(i, field){
            if(i > 0){
              var txt = field.date_time.split(" ");
              var txt2 = txt[0].split("-");
              var date = txt2[2] + "/" + txt2[1] + "/" + txt2[0].substr(2);
              if(tempdate != date){
                  tempdate = date;
                  no = 1;
              }
              $('#myS').append(' <li id="bills-'+field.order_id+'">' +
                    '<div class="row justify-content-center bill-even" data-toggle="collapse" href="#details-'+field.order_id+'" role="button" aria-expanded="false" aria-controls="details-'+field.order_id+'" onclick="appendCollapses('+field.order_id+');">' +
                        '<div class="col-2 text-center"><h5>'+no+'</h5></div>' +  
                        '<div class="col-4 text-center"><h5>'+field.order_number+'</h5></div>' +
                        '<div class="col-2 text-center"><h5>'+date+'</h5></div>' +
                        '<div class="col-4 text-center"><h5>'+field.cus_name+'</h5></div>' +
                    '</div>' +
                '</li>');
              no++;
            }                                                
          });                                         
        }               
      });
      start_s += 30;
    }

    function init_restore(bill_id,prod_id,price,total_amt,b_id,type,pay,c_id,price){
      $("#btn-ok").attr('onclick','restore('+bill_id+','+prod_id+','+price+','+total_amt+','+b_id+',\''+type+'\',\''+pay+'\','+c_id+','+price+')')
    }

    function restore(bill_id,prod_id,price,total_amt,b_id,type,pay,c_id,price){
      amt = $("#in-amt").val()
      if(total_amt < amt || amt == ""){
        $.confirm({
            title: 'แจ้งเตือน',
            content: 'จำนวนคืนสินค้าเกินจำนวนสินค้าทั้งหมดหรือไม่ได้กรอกจำนวนคืนสินค้า',
            backgroundDismiss: true,
            buttons: {
                formSubmit: {
                text: 'ตกลง',
                btnClass: 'btn-danger',
                action: function () {
                }
                }
            }
        });
        return 0;
      }
      dis = parseInt(price) * amt     
      $.ajax({
        type: "POST",
        url:"php/restore_product.php",    
        data:{'bill_id' : bill_id , 'prod_id' : prod_id , 'sum' : dis , 'b_id' : b_id , 'type' : type , 'pay' : pay , 'credit_id': c_id , 'amt' : amt},              
        beforeSend: function(){
          EasyLoading.show({                           
            text: "กำลังโหลด"
          });
        },             
        success: function(data){  
          EasyLoading.hide();
          if(data != "fail"){
            amt_prod = parseInt($("#amt-"+prod_id).text()) - amt
            itemsum = amt_prod * price
            sum = parseInt($("#sum-"+bill_id).html()) - dis
            total = parseInt($("#total-"+bill_id).html()) - dis

            $("#amt-"+prod_id).text(amt_prod)
            $("#sum-"+bill_id).html(sum)
            $("#total-"+bill_id).html(total)
            $("#itemsum-"+prod_id).text(itemsum)
            $("#reModal").modal('hide');
          }else{
            $.confirm({
                title: 'พบข้อผิดพลาด',
                content: 'ลองอีกครั้ง',
                backgroundDismiss: true,
                buttons: {
                    formSubmit: {
                    text: 'ตกลง',
                    btnClass: 'btn-regis',
                    action: function () {
                    }
                    }
                }
            });
          }
        }               
      });
    }

    function delete_bill(bill_id, b_id, type, pay, total, c_id){
      if(localStorage.user_role !== "แอดมิน" && localStorage.user_role !== "เจ้าของร้าน"){
        alert("คุณไม่มีสิทธิ์ยกเลิกบิล (เฉพาะแอดมินและเจ้าของร้านเท่านั้น)");
        return;
      }
      $.confirm({
        title: 'ลบรายการ',
        content: 'ต้องการลบบิลนี้หรือไม่?'+
                '<form action="" class="formName">' +
                '<div class="form-group">' +
                '<label>*หมายเหตุในการลบ</label>' +
                '<input type="text" placeholder="หมายเหตุ" class="remark form-control" required />' +
                '</div>' +
                '</form>',
        backgroundDismiss: true,
        buttons: { 
          formSubmit: {
            text: 'ตกลง',
            btnClass: 'btn-danger',
            action: function () {
              // delete bill
              var remark = this.$content.find('.remark').val();
              $.ajax({
                type: "POST",
                url:"php/delete_bill.php",         
                data:{'bill_id' : bill_id , 'b_id' : b_id , 'type' : type , 'pay' : pay , 'total' : total , 'credit_id': c_id , 'remark': remark , 'u_id' : localStorage.user_id},
                beforeSend: function(){
                  EasyLoading.show({                           
                    text: "กำลังโหลด"
                  });
                },                       
                success: function(data){ 
                  EasyLoading.hide();
                  if(data == "success"){                    
                    $('#bill-'+bill_id).remove()
                    $('#bills-'+bill_id).remove()
                  }else{
                    $.confirm({
                      title: 'พบข้อผิดพลาด',
                      content: 'ลองอีกครั้ง',
                      backgroundDismiss: true,
                      buttons: {
                        formSubmit: {
                        text: 'ตกลง',
                        btnClass: 'btn-regis',
                        action: function () {
                        }
                        }
                      }
                    });
                  }                         
                }               
              });      
            }
          },ยกเลิก: function () {}, 
        }  
    });
    }
    
    var last_collapse_index = 0;

    function appendCollapse(index){
      if($("#detail-"+index).length){
        if(last_collapse_index){          
          $("div").closest("#detail-"+last_collapse_index).collapse('hide');
        }

        $("#btn-a4").attr('onclick', 'printA4('+index+')');
        $("#btn-recep").attr('onclick', 'printRecep('+index+')');        

        if(last_collapse_index != index){
          last_collapse_index = index;
        }
      }else{
        
        if(last_collapse_index){
          $("div").closest("#detail-"+last_collapse_index).collapse('hide');
        }
        var text = ""        
        $.ajax({
          type: "POST",
          url:"php/get_bill_info4print.php",    
          data:{'bill_id' : index},
          async:false,                            
          beforeSend: function(){
            EasyLoading.show({                           
              text: "กำลังโหลด"
            });
          },             
          success: function(data){  
            EasyLoading.hide();
            var obj = jQuery.parseJSON(data);
            text = text + '<div class="collapse" id="detail-'+index+'">'+
            '<div class="card card-body">'+
              '<div class="row justify-content-center">'+
                  '<h3 style="text-decoration: underline;">รายการ</h3>'+
              '</div>'            
            $.each(obj, function(i, field){
              sum = field.prod_price*field.prod_amount
              text = text + 
              '<div id="item-'+field.prod_id+'" class="row justify-content-center">'+
                '<div class="col-1 text-center items">'+(i+1)+'</div>'+
                '<div id="amt-'+field.prod_id+'" class="col-1 text-center items">'+field.prod_amount+'</div>'+
                '<div class="col-6 text-center items"><span class="hover-prod-preview" data-prod-id="'+field.prod_id+'" data-prod-code="'+(field.prod_code||'')+'">'+field.prod_name+'</span></div>'+
                '<div class="col-1 text-center items">'+field.prod_price+'</div>'+
                '<div id="itemsum-'+field.prod_id+'" class="col-1 text-center items">'+sum+'</div>'+
                '<div class="col-2 text-center items">'+
                  '<button onclick="init_restore('+index+','+field.prod_id+','+field.prod_price+','+field.prod_amount+','+obj[0].branch_id+',\''+obj[0].type+'\',\''+obj[0].payment_type+'\','+obj[0].credit_id+','+field.prod_price+')" class="btn btn-info" data-toggle="modal" data-target="#reModal" style="color: white;">คืนสินค้า</button>'+
                '</div>'+
              '</div>'
            });
            text = text + 
            '<hr style="width: 50%; margin: auto; margin-top: 1em;">'+
            '<div class="row" style="margin-top: 1em;">'+
                '<div class="col-4 text-right"><h5>หมายเหตุ</h5></div>'+
                '<div class="col-4 text-right">'+obj[0].comment+'<h6></h6></div>'+
            '</div>'+
            '<div class="row">'+
                '<div class="col-4 text-right"><h4>รวม</h4></div>'+
                '<div class="col-4 text-right"><h4 id="sum-'+index+'">'+obj[0].sum_price+'</h4></div>'+
            '</div>'+
            '<div class="row">'+
                '<div class="col-4 text-right"><h4>ลด</h4></div>'+
                '<div class="col-4 text-right"><h4>'+obj[0].total_discount+'</h4></div>'+
            '</div>'+
            '<div class="row">'+
                '<div class="col-4 text-right"><h4>สุทธิ</h4></div>'+
                '<div class="col-4 text-right"><h4 id="total-'+index+'">'+obj[0].total_price+'</h4></div>'+
            '</div>'+
            '<div class="row">'+
                '<div class="col-4 text-right"><h4>รับ / ทอน</h4></div>'+
                '<div class="col-4 text-right"><h4>'+obj[0].get_price+'</h4></div>'+
                '<div class="col-4 text-center"><h4>'+obj[0].chng+'</h4></div>'+
            '</div>'+
            '<div class="row justify-content-center" style="margin-top: 1em;">'+
                '<div class="col-4 text-right">'+
                  '<button class="btn btn-lg btn-warning" data-toggle="modal" data-target="#printModal" style="color: white;">พิมพ์รายการ  <i class="fas fa-print"></i></button>'+
                '</div>'+
                ((localStorage.user_role === "แอดมิน" || localStorage.user_role === "เจ้าของร้าน") ? '<div class="col-4 text-left"><button class="btn btn-lg btn-danger" style="color: white;" onclick="delete_bill('+index+','+obj[0].branch_id+',\''+obj[0].type+'\',\''+obj[0].payment_type+'\','+obj[0].total_price+','+obj[0].credit_id+')">ลบรายการ <i class="fas fa-trash"></i></button></div>' : '')+
            '</div>'+
          '</div>'+
        '</div>';
        }               
        });       
       
        $("#bill-"+index).append(text);
        $("#btn-a4").attr('onclick', 'printA4('+index+')');
        $("#btn-recep").attr('onclick', 'printRecep('+index+')');       

        if(last_collapse_index != index){
          last_collapse_index = index;
        } 
      }
      $('html, body').animate({
            scrollTop: $("#bill-"+index).offset().top
        }, 1100);
    }

        function printRecep(index){
      $.ajax({
          type: "POST",
          url:"php/get_bill_info4print.php",    
          data:{'bill_id' : index},
          async:false,                            
          beforeSend: function(){
            EasyLoading.show({                           
              text: "กำลังโหลด"
            });
          },             
          success: function(data){  
            EasyLoading.hide();
            var obj = jQuery.parseJSON(data);
            if (!obj || obj.length === 0) return;
            var dt = (obj[0].date_time || '').split(" ");
            var time = dt[1] || '';
            var d = (dt[0] || '').split("-");
            var date = (d.length === 3) ? (d[2] + "/" + d[1] + "/" + d[0]) : dt[0];

            var netVal = parseFloat(obj[0].sum_price) || 0;
            var disVal = parseFloat(obj[0].total_discount) || 0;
            var finalVal = parseFloat(obj[0].total_price) || 0;
            var getVal = parseFloat(obj[0].get_price) || 0;
            var chngVal = parseFloat(obj[0].chng) || 0;
            var totalQty = 0;

            var shopName = 'DD MOTOR SPORT';
            var shopAddr = 'B-24, B-28 อาคารศรีวรจักร ถ.หลวงป้อมปราบศัตรูพ่าย';
            var shopTel = 'โทร. 02-2265280, 02-2222437';

            var billHtml = "<!DOCTYPE html><html><head><meta charset='utf-8'>" +
                "<title>ใบเสร็จรับเงิน - " + obj[0].order_number + "</title>" +
                "<link href='https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Maitree:wght@400;600&display=swap' rel='stylesheet'>" +
                "<style>" +
                "* { box-sizing: border-box; margin: 0; padding: 0; } " +
                "@page { size: 80mm auto; margin: 0mm; } " +
                "@media print { " +
                "  html, body { width: 100% !important; min-width: 0 !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; } " +
                "  @page { size: 80mm auto; margin: 0mm; } " +
                "} " +
                "body { font-family: 'Prompt', 'Maitree', Tahoma, 'Segoe UI', sans-serif; font-size: 13px; line-height: 1.35; color: #000 !important; background: #fff; width: 100%; } " +
                ".bill-wrap { width: 72mm; margin: 0 auto; padding: 4mm 2mm; } " +
                ".text-center { text-align: center; } .text-left { text-align: left; } .text-right { text-align: right; } " +
                ".font-bold { font-weight: bold; } " +
                ".line-dashed { border-top: 1px dashed #000; margin: 6px 0; } " +
                ".row-info { display: flex; margin-bottom: 3px; font-size: 12px; } " +
                ".row-info .lbl { width: 72px; font-weight: bold; text-align: right; padding-right: 6px; flex-shrink: 0; } " +
                ".row-info .val { flex-grow: 1; text-align: left; word-break: break-word; } " +
                "table.items-table { width: 100%; border-collapse: collapse; margin: 6px 0; } " +
                "table.items-table th { border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 4px 0; font-size: 12px; font-weight: bold; } " +
                "table.items-table td { padding: 4px 0; font-size: 12px; vertical-align: top; } " +
                ".row-summary { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; } " +
                ".row-summary.total { font-size: 14px; font-weight: bold; margin-top: 3px; } " +
                ".footer-box { margin-top: 12px; text-align: center; font-size: 11px; line-height: 1.6; } " +
                "</style></head><body>" +
                "<div class='bill-wrap'>" +
                "<div class='text-center font-bold' style='font-size: 16px;'>" + shopName + "</div>" +
                "<div class='text-center' style='font-size: 11px;'>" + shopAddr + "</div>" +
                "<div class='text-center' style='font-size: 11px;'>" + shopTel + "</div>" +

                "<div class='row-info'><div class='lbl'>เลขที่บิล :</div><div class='val font-bold'>" + obj[0].order_number + "</div></div>" +
                "<div class='row-info'><div class='lbl'>วันที่ :</div><div class='val'>" + date + " " + time + "</div></div>" +
                "<div class='row-info'><div class='lbl'>ลูกค้า :</div><div class='val font-bold'>" + (obj[0].cus_name || '-') + "</div></div>" +
                "<div class='row-info'><div class='lbl'>การชำระ :</div><div class='val'>" + (obj[0].payment_type || 'เงินสด') + "</div></div>" +
                "<div class='row-info'><div class='lbl'>พนักงาน :</div><div class='val'>" + (obj[0].user_name || '-') + "</div></div>";

            if (obj[0].comment && obj[0].comment.trim()) {
                billHtml += "<div class='row-info'><div class='lbl'>หมายเหตุ :</div><div class='val'>" + obj[0].comment.trim() + "</div></div>";
            }

            billHtml += "<table class='items-table'><thead><tr>" +
                "<th style='width: 10%; text-align: center;'>#</th>" +
                "<th style='width: 52%; text-align: left;'>รายการ</th>" +
                "<th style='width: 14%; text-align: center;'>จำนวน</th>" +
                "<th style='width: 24%; text-align: right;'>รวม (฿)</th>" +
                "</tr></thead><tbody>";

            $.each(obj, function (i, field) {
                var itQty = parseFloat(field.prod_amount) || 1;
                var itPrice = parseFloat(field.prod_price) || 0;
                var itTotal = itQty * itPrice;
                totalQty += itQty;
                var itCode = (field.prod_code || field.qr) ? '<div style="font-size: 10px; color: #475569;">' + (field.prod_code || field.qr) + '</div>' : '';
                var itSubPrice = itQty > 1 ? '<div style="font-size: 10px; color: #64748b;">(@ ' + itPrice.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ')</div>' : '';

                billHtml += "<tr>" +
                    "<td style='text-align: center; vertical-align: top;'>" + (i + 1) + "</td>" +
                    "<td style='text-align: left; word-break: break-word; vertical-align: top;'>" + field.prod_name + itCode + itSubPrice + "</td>" +
                    "<td style='text-align: center; vertical-align: top;'>" + itQty + "</td>" +
                    "<td style='text-align: right; vertical-align: top; font-weight: bold;'>" + itTotal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + "</td>" +
                    "</tr>";
            });

            billHtml += "</tbody></table>" +
                "<div class='line-dashed'></div>" +
                "<div class='row-summary'><span>รวมเงิน (" + totalQty + " ชิ้น) :</span><span>" + netVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " บาท</span></div>";

            if (disVal > 0) {
                billHtml += "<div class='row-summary'><span>ส่วนลด :</span><span>-" + disVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " บาท</span></div>";
            }

            billHtml += "<div class='row-summary total'><span>ยอดสุทธิ :</span><span style='font-size: 15px;'>" + finalVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " บาท</span></div>";

            if (obj[0].payment_type === 'เงินสด' || getVal > 0) {
                billHtml += "<div class='line-dashed' style='margin: 4px 0;'></div>" +
                    "<div class='row-summary'><span>รับเงิน :</span><span>" + getVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " บาท</span></div>" +
                    "<div class='row-summary font-bold'><span>เงินทอน :</span><span>" + chngVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " บาท</span></div>";
            }

            billHtml += "<div class='line-dashed'></div>" +
                "<div class='footer-box'>" +
                "<div class='font-bold'>ขอบคุณที่ใช้บริการ</div>" +
                "<div style='font-size: 10px; color: #475569; margin-top: 2px;'>สินค้าซื้อแล้วกรุณาตรวจสอบความถูกต้อง</div>" +
                "</div>" +
                "</div>" +
                "<script>" +
                "window.onload = function() { window.focus(); setTimeout(function() { window.print(); }, 250); };" +
                "window.addEventListener('afterprint', function() { try { if (window.opener) window.opener.focus(); } catch(e){} setTimeout(function() { window.close(); }, 50); });" +
                "<\/script>" +
                "</body></html>";

            var WinPrint = window.open('', '', 'width=450,height=600');
            if (WinPrint) {
                WinPrint.document.open();
                WinPrint.document.write(billHtml);
                WinPrint.document.close();
                WinPrint.focus();
                setTimeout(function () {
                    try {
                        WinPrint.print();
                        WinPrint.close();
                    } catch(e){}
                }, 350);
            }
          }               
      });
    }
