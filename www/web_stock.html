  <script>
		$(document).ready(function () {
			if(!localStorage.user_id){
				window.location = 'web_login.html';
      		}else if(localStorage.user_role == 'ดูคลังสินค้า'){
				$('a[name="a-menu"]').click(false);
			}
			if(localStorage.arr_prod_st){
				$("#main-ctn").prop('hidden', true);
				$("#detail-ctn").prop('hidden', false);
				var retrievedObject = localStorage.getItem('arr_prod_st');
				var arr_data = JSON.parse(retrievedObject); 
				for(var i = 0 ; i < arr_data.length ; i++){
					prod_id = arr_data[i].prod_id;	
					name = arr_data[i].name;
					img = arr_data[i].img;				       
					get_amt(prod_id,name,img);
				}	
				localStorage.arr_prod_st = "";			
			}

			// รีเซ็ตค่าใน EditModal ทุกครั้งที่ปิด modal
			$('#EditModal').on('hidden.bs.modal', function () {
				$("#name-prod").val("");
				$("#code-prod").val("");
				$("#fileSelect").val("");
				$('#fileSelect[rel=popover]').popover('dispose');
			});

			// Delegated click handler สำหรับปุ่มแก้ไขและลบสินค้า (รองรับชื่อสินค้าที่มีเครื่องหมายคำพูด " หรือ ' ได้ 100%)
			$(document).off('click', '.btn-edit-prod').on('click', '.btn-edit-prod', function(e) {
				var pid = $(this).data('prod-id');
				var pname = $(this).data('prod-name');
				var pcode = $(this).data('prod-code');
				edit_prod(pid, pname, pcode);
			});

			$(document).off('click', '.btn-delete-prod').on('click', '.btn-delete-prod', function(e) {
				var pid = $(this).data('prod-id');
				var pname = $(this).data('prod-name');
				delete_prod(pid, pname);
			});
		});

		$(document).keydown(function(objEvent) {
			if (objEvent.keyCode == 13) {  //enter pressed
				objEvent.preventDefault();
				var $this = $(objEvent.target);
				var i_enter = parseFloat($this.attr('data-index'));                      
				if(i_enter == 1){
						show();
				}        
			}         
		})

  		function reposition(){
  		$("#main-ctn").css('margin-top', '15%');
  		$("#row-folder").prop('hidden', false);
  		$("#back i").prop('hidden', true);
  		$('hr').prop('hidden', false);
  		$("#input-search").val("");
			$("#detail-ctn").prop('hidden', true);
			$("#main-ctn").prop('hidden', false);
			$('#append-ctn').empty();
			localStorage.arr_prod_st = "";
  	}

		function render_folder_badge(folder_path, folder_chain){
			if(!folder_path || folder_path.trim() === ""){
				return '<div class="folder-path-wrap empty text-muted" title="ยังไม่ได้จัดหมวดหมู่สินค้า">' +
					   '<i class="fas fa-folder mr-1 text-secondary"></i>' +
					   '<span class="folder-path-item text-muted">ไม่ได้ระบุโฟลเดอร์</span>' +
					   '</div>';
			}

			var chain = (folder_chain && folder_chain.length > 0) 
				? folder_chain 
				: folder_path.split('>').map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0; });

			if(chain.length === 0){
				return '<div class="folder-path-wrap empty text-muted">' +
					   '<i class="fas fa-folder mr-1 text-secondary"></i>' +
					   '<span class="folder-path-item text-muted">ไม่ได้ระบุโฟลเดอร์</span>' +
					   '</div>';
			}

			var html = '<div class="folder-path-wrap" title="โฟลเดอร์/หมวดหมู่สินค้า">';
			html += '<i class="fas fa-folder-open text-warning mr-2"></i>';

			var lastIndex = chain.length - 1;
			var targetFolder = chain[lastIndex];

			for(var idx = 0; idx < chain.length; idx++){
				var isLeaf = (idx === lastIndex);
				if(isLeaf){
					html += '<a href="web_folder.html?from=stock&folder=' + encodeURIComponent(targetFolder) + '" class="folder-link" title="คลิกเพื่อเปิดโฟลเดอร์ \'' + targetFolder + '\' ในหน้าหมวดหมู่">' +
							'<span class="folder-path-item leaf"><i class="fas fa-folder mr-1"></i>' + chain[idx] + '</span>' +
							'</a>';
				} else {
					html += '<span class="folder-path-item">' + chain[idx] + '</span>';
					html += '<i class="fas fa-angle-right folder-path-sep"></i>';
				}
			}

			html += '</div>';
			return html;
		}

		function show(){
			$('#append-ctn').empty();
			var val = $('#input-search').val();
			if(val == ""){
				return 0;
			}    
  			
  			$("#detail-ctn").prop('hidden', false);
  						 
			$.ajax({
				type: "POST",
				url: "php/search_prod.php",
				data: {'phrase' : val},
				//async: false,
				beforeSend: function(){
					EasyLoading.show({                           
						text: "กำลังโหลด"                            
					});		
				},             
				success: function(data){  
					EasyLoading.hide();
					var obj = jQuery.parseJSON(data);										
					if(obj.length > 0){
						$.each(obj, function(i, field){ 
							get_amt(field.prod_id, field.prod_name, field.img, field.prod_code, field.folder_path, field.folder_chain);       
						}); 
					}else{					
						$('#append-ctn').append('<p class="display">ไม่พบสินค้า</p>');
					}                                                                                                                                      
				}               
      		}); 
  		}

		function get_amt(prod_id,name,img,code,folder_path,folder_chain){
			code = code || "";
			folder_path = folder_path || "";
			var namedq = name ? name.replace(/"/g, '\\"') : "";	
			var addr;
			$.ajax({
				type: "POST",
				url: "php/check_amt_prod.php",                
				data: {'prod_id': prod_id},    
				async: false,
				beforeSend: function(){
					EasyLoading.show({                           
						text: "กำลังโหลด"                            
					});		
				},                   
				success: function(data){
					EasyLoading.hide();				
					var msg = "";		                      
					var obj = jQuery.parseJSON(data); 	
					console.log(obj);
					// หากไม่มี folder_path ส่งเข้ามา ให้ลองดึงจากผลลัพธ์ของ check_amt_prod.php
					if(!folder_path && obj && obj.length > 0 && obj[0].folder_path){
						folder_path = obj[0].folder_path;
						folder_chain = obj[0].folder_chain;
					}
					if(!code && obj && obj.length > 0 && obj[0].prod_code){
						code = obj[0].prod_code;
					}

					var msg_price = "";					
					if(obj != "" && obj.length > 0){                
						$.each(obj, function(i, field){            				
							var id = obj[i].id;
							var price = obj[i].prod_price;
							var pricesend = obj[i].prod_pricesend;
							var cost = obj[i].prod_cost;
							var datastr;
							var placeType = obj[i].type || obj[i].place_type || obj[i][9] || obj[i][8] || obj[i][0];
							if(placeType == "ware"){
								datastr = {'prod_id':prod_id,'ware_id':id};
							}else{
								datastr = {'prod_id':prod_id,'shop_id':id};
							}
							addr = "";
							$.ajax({
								type: "POST",
								url: "php/get_place.php",
								data: datastr,
								async: false,
								beforeSend: function(){
									EasyLoading.show({                           
										text: "กำลังโหลด"                            
									});		
								},             
								success: function(data){  
									EasyLoading.hide();
									var obj2 = jQuery.parseJSON(data);								
									$.each(obj2, function(i, field){ 
										addr = addr + field.place + ",";
									}); 
								}               
							});	
							var addr_clean = addr ? addr.replace(/,+$/, '').replace(/,/g, ', ') : '';
							var place_label = addr_clean 
								? '<span class="text-primary font-weight-bold"><i class="fas fa-map-marker-alt text-danger mr-1"></i>' + addr_clean + '</span>'
								: '<span class="text-muted" style="font-size: 0.88rem;">(ไม่ระบุตำแหน่ง)</span>';
							var type_label = (placeType == "ware") ? "โกดัง" : "หน้าร้าน";
							if (obj[i].ware_name) { type_label = obj[i].ware_name; }
							else if (obj[i].shop_name) { type_label = obj[i].shop_name; }
							else if (obj[i][0] && obj[i][0] !== "ware" && obj[i][0] !== "shop") { type_label = obj[i][0]; }

							msg = msg + '<div class="inforow row justify-content-center align-items-center my-1">'+
											'<span class="badge badge-light border text-dark px-2 py-1 mr-1 font-weight-bold">'+type_label+'</span>'+
											'<span class="font-weight-bold text-dark">: '+obj[i].amount+' ชิ้น</span>'+
											'<span class="text-muted mx-2">|</span>'+
											place_label +
										'</div>';												
						});	
						if(localStorage.user_role != "แอดมิน" && localStorage.user_role != "เจ้าของร้าน"){
							msg_price = '<p class="m-0">ส่ง : '+obj[0].prod_pricesend+'  ปลีก : '+obj[0].prod_price+'</p>';
						}else{
							msg_price = '<p class="m-0">ทุน : '+obj[0].prod_cost+'  ส่ง : '+obj[0].prod_pricesend+'  ปลีก : '+obj[0].prod_price+'</p>';
						}
					}else{
						msg = '<div class="inforow row justify-content-center">'+
								'<p class="text-muted">ไม่มีสินค้าในโกดัง/หน้าร้าน</p>'+
							  '</div>';
						msg_price = '';
					}

					var folder_html = render_folder_badge(folder_path, folder_chain);
					var code_html = code 
						? '<span class="prod-code-badge"><i class="fas fa-barcode mr-1"></i><span class="code-text">' + code + '</span></span>'
						: '';
					var img_html = (img == "") 
						? '<div class="prod-img-wrap"><img id="img-'+prod_id+'" src="img/no_img.png" alt="pic"></div>'
						: '<div class="prod-img-wrap"><img id="img-'+prod_id+'" class="thumbnails" src="'+img+'" alt="pic"></div>';

					var $card = $(
						'<div id="div-'+prod_id+'" class="jumbotron text-center jumbo-center position-relative">' +
							'<div class="d-flex justify-content-between align-items-center mb-2">' +
								'<div class="prod-code-container">' + code_html + '</div>' +
								'<div>' +
									'<i id="i-'+prod_id+'" class="fas fa-pen text-primary btn-edit-prod" data-toggle="modal" data-target="#EditModal" style="cursor: pointer; margin-right: 15px;" title="แก้ไขสินค้า"></i>' +
									'<i id="trash-'+prod_id+'" class="fas fa-trash text-danger btn-delete-prod" style="cursor: pointer;" title="ลบสินค้า"></i>' +
								'</div>' +
							'</div>' +
							'<div class="folder-path-container">' + folder_html + '</div>' +
							'<p id="p-'+prod_id+'" class="display prod-title-name"></p>' +
							msg_price +
							' <hr class="jumbohr">' +
							img_html +
							msg +
						'</div>'
					);

					// กำหนดชื่อสินค้าแบบ safe text ป้องกัน quote หลุดและ XSS
					$card.find('#p-' + prod_id).text(name);

					// แนบข้อมูลลงใน jQuery .data() เพื่อรองรับชื่อสินค้าที่มีเครื่องหมายคำพูด (") เช่น 4" หรือ (') ได้ 100%
					$card.find('#i-' + prod_id)
						.data('prod-id', prod_id)
						.data('prod-name', name)
						.data('prod-code', code);

					$card.find('#trash-' + prod_id)
						.data('prod-id', prod_id)
						.data('prod-name', name);

					$('#append-ctn').append($card);
				}               
			});
			set_fullImage();
   		}
		
		function set_fullImage(){
			$('img.thumbnails').fullscreenimage({
				scale: 2 // magnify by 2 times when mouse moves over full screen image (set to 1 to disable)
			});
		}		

		function edit_prod(prod_id, name, code){
			$("#fileSelect").val("");
			$('#fileSelect[rel=popover]').popover('dispose');
			$("#name-prod").val(name || "");
			$("#code-prod").val(code || "");
			$("#save-edit").off('click').on('click', function() {
				save_edit(prod_id);
			});
		}

		function delete_prod(prod_id, name){
			$.confirm({
				icon: 'fa fa-warning',
				title: 'คุณต้องการลบ ' + (name || 'สินค้านี้'),
				content: 'ต้องการลบรายการสินค้านี้หรือไม่!',
				buttons: {
					danger: {
						btnClass: 'btn-danger',
						text: 'ลบ',
						action: function () {							
							$.ajax({
								type: "POST",
								url:"php/delete_prod.php",
								data: {'title' : prod_id},               
								beforeSend: function(){
									EasyLoading.show({                           
										text: "กำลังโหลด"                            
									});	
								},             
								success: function(data){  
									EasyLoading.hide();                          
									if(data == "success"){
										$('#div-'+prod_id).remove();
									}else{
										$.confirm({
											title: 'พบข้อผิดพลาด',
											content: 'ลองอีกครั้ง',
											backgroundDismiss: true,
											buttons: {
												formSubmit: {
													text: 'ตกลง',
													btnClass: 'btn-regis',
													action: function () {}
												}
											}
										});
									}           
								}               
							});									
						}
					},
					ยกเลิก: function () {},
				}
			});
		}

		function save_edit(prod_id){
			var name = $("#name-prod").val();
			var code = $("#code-prod").val();			
			// from an input element
			var input = document.getElementById("fileSelect");
        	var file = input.files[0];	
			var b64;		
			if (file != undefined) {
				var tempImg = new Image();
				tempImg.src = $("#fileSelect").data('img');
				tempImg.onload = function() {				

					var MAX_WIDTH = 960;
					var MAX_HEIGHT = 960;
					var width = tempImg.width;
					var height = tempImg.height;

					if (width > height) {
						if (width > MAX_WIDTH) {
							height *= MAX_WIDTH / width;
							width = MAX_WIDTH;
						}
					} else {
						if (height > MAX_HEIGHT) {
							width *= MAX_HEIGHT / height;
							height = MAX_HEIGHT;
						}
					}			

					// Create canvas of required size.
					var canvas = document.createElement('canvas');
					canvas.width = width;
					canvas.height = height;

					var ctx = canvas.getContext("2d");
					ctx.drawImage(this, 0, 0, tempImg.width, tempImg.height, 0, 0, width, height);

					b64 = canvas.toDataURL("image/jpeg");				
					console.log(b64);
				};			
			}
			setTimeout(function() {
				$.ajax({
					type: "POST",
					url:"php/rename_prod_web.php",
					data: {'prod_id' : prod_id,
						'name_prod' : name,
						'code' : code,
						'img' : b64},
					beforeSend: function(){
						EasyLoading.show({                           
							text: "กำลังโหลด"                            
						});
					},             
					success: function(data){
						EasyLoading.hide();					                          
						if(data == "success"){
							// อัปเดต .data() บนปุ่มแก้ไขและลบให้มีค่าใหม่เสมอ
							var $i = $("#i-" + prod_id);
							$i.data('prod-name', name);
							$i.data('prod-code', code);
							$("#trash-" + prod_id).data('prod-name', name);
							$("#p-" + prod_id).text(name);

							// อัปเดตรหัสสินค้าบนการ์ด
							var $codeBadge = $("#div-" + prod_id).find('.prod-code-badge');
							if (code) {
								if ($codeBadge.length) {
									$codeBadge.find('.code-text').text(code);
								} else {
									$("#div-" + prod_id).find('.prod-code-container').html('<span class="prod-code-badge"><i class="fas fa-barcode mr-1"></i><span class="code-text">' + code + '</span></span>');
								}
							} else {
								$codeBadge.remove();
							}

							if(b64){
								$('#img-' + prod_id).attr('src', b64);
							}			
						}else{
							$.confirm({
								title: 'พบข้อผิดพลาด',
								content: 'ลองอีกครั้ง',
								backgroundDismiss: true,
								buttons: {
									formSubmit: {
										text: 'ตกลง',
										btnClass: 'btn-regis',
										action: function () {}
									}
								}
							});
						}
					}               
				});
			}, 1000);	
		}

		function readURL() {
			var input = document.getElementById("fileSelect");
			if (input.files && input.files[0]) {
			var reader = new FileReader();
			reader.onload = function(e) {
			$('#fileSelect').data('img', e.target.result);
			}
			reader.readAsDataURL(input.files[0]);
		}
		}

		function select_img(){
			console.log("select")	
			readURL(); //set data-img of ch

			$('#fileSelect[rel=popover]').popover({
				html: true,
				trigger: 'hover',
				placement: 'right',
				content: function() {
				return '<img src=' + $(this).data('img') + '>';
				}
			});		  
		}

  		function detailback(){
	  	$("#detail-ctn").prop('hidden', true);
	  	$("#main-ctn").prop('hidden', false);
  	}

		function select_folder(){
			window.location = 'web_folder.html?from=stock';
		}	
	

		function logout(){
			localStorage.clear();
		}
