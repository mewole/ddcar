                    type: "GET",

                    beforeSend: function(){
                        $(".overlay").prop('hidden', false);
                    },

                    $(".overlay").prop('hidden', true);

                            $.each(obj, function(i, field){

              onDestroy: function () {
                $("style").append('.jconfirm .jconfirm-box{margin-bottom: 5%;}');

            });
        }

        function edit_discount(){
          var dis = $('#dis').val(); 
          var net = $('#net').val();         
          $('#total').val(net - dis);
          var pay = $('#pay').val();
          if(pay == "เงินสด"){
            var get = $('#get').val();
            var total = $('#total').val();        
            if(get - total < 0){           
                $('#chng').val("");
            }else{
                $('#chng').val(get - total);
            }    
          }         
        }

        function get_money(){
          var get = $('#get').val();
          var total = $('#total').val();
          if(get - total < 0){
            $('#chng').val("");
          }else{
            $('#chng').val(get - total);
          }
        }
