<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
    <title>ตรวจสอบรายการขาย - DDCAR</title>
    <!-- Local Assets -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/svg-with-js.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/jquery-confirm.css">

    <script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
    <script type="text/javascript" src="js/jquery-ui.min.js"></script>
    <script type="text/javascript" src="js/jquery.easing.1.3.min.js"></script>
    <script type="text/javascript" src="js/jquery-confirm.js"></script>
    <script type="text/javascript" src="js/popper.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.min.js"></script>
    <script defer src="js/fontawesome-all.js"></script>
    <script type="text/javascript" src="js/config.js"></script>
    <script type="text/javascript" src="js/capacitor-bridge.js"></script>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css?family=Prompt" rel="stylesheet">

    <style>
        #title {
            color: #666666;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .no-pd {
            padding-right: 0px;
            padding-left: 0px;
            font-size: 120%;
        }

        hr {
            margin-top: 0;
        }

        .i-del, .i-edit{
            color: #666666;
        }

        .collapse{
            margin-top: 1%; 
            background: #fafafa; 
            padding-top: 5%; 
            padding-bottom: 5%;
            border-radius: 1%;
        }
    </style>

    <script>
        arr_data = [];  
        $(document).ready(function () { 
            $("#cus-title").text(localStorage.cus_name || "ลูกค้าทั่วไป");
            var retrievedObject = localStorage.getItem('arr_sale');
            arr_data = retrievedObject ? JSON.parse(retrievedObject) : [];
            var sum = 0;
            for(var i = 0 ; i < arr_data.length ; i ++){                              
                var sum_prod = arr_data[i].price*arr_data[i].amt;
                sum += parseInt(sum_prod);
                $('#in-ctn').append("<div id='prod-"+i+"' class='row'>" +
                    "<span id='id-prod-"+i+"' hidden>"+arr_data[i].prod_id+"</span>" +
                    "<div class='col-1 text-right no-pd'>" +
                        "<i id='i-del-"+i+"' class='fa fa-trash-alt i-del' onclick='del_prod("+i+");' hidden></i>" +
                        "<i id='i-edit-"+i+"' class='fa fa-edit i-edit' onclick='edit_prod("+i+");' hidden></i>" +
                    "</div>" +
                    "<div id='name-"+i+"' class='col-6 text-center no-pd' onclick='collapse("+i+");'>"+arr_data[i].name+"</div>" +
                    "<div id='price-"+i+"' class='col-3 text-center no-pd' onclick='collapse("+i+");'>"+arr_data[i].price+"</div>" +
                    "<span>x</span>" +
                    "<div id='amount-"+i+"' class='col-1 text-center no-pd' onclick='collapse("+i+");'>"+arr_data[i].amt+"</div>" +
                "</div>" +                
                "<div id='collapse-"+i+"' class='container collapse' onclick='collapse("+i+");'>" +
                    "<div class='row'>" +
                        "<div class='col-12 text-center'>" +
                            "<img id='img' src='"+arr_data[i].img+"' alt='' onclick='show_pic()' class='collapse-square'>" +
                        "</div>" +
                    "</div>" +
                    "<div class='row' style='margin-bottom: 2em; margin-top: 2em;'>" +
                        "<div class='col-2'></div>" +
                        "<div class='col-4 text-center no-pd'>รหัส : </div>" +
                        "<div class='col-4 text-center no-pd'>"+arr_data[i].qr+"</div>" +
                        "<div class='col-2'></div>" +
                    "</div>" +
                    "<div class='row' style='margin-bottom: 2em;'>" +
                        "<div class='col-2'></div>" +
                        "<div class='col-4 text-center no-pd'>รวม : </div>" +
                        "<div id='sum-"+i+"' class='col-4 text-center no-pd'>"+sum_prod+"</div>" +
                        "<div class='col-2'></div>" +
                    "</div>" +
                    "<!--<div class='row'>" +
                        "<div class='col-2'></div>" +
                        "<div class='col-4 text-center no-pd'>คงเหลือ : </div>" +
                        "<div class='col-4 text-center no-pd'>15</div>" +
                        "<div class='col-2'></div>" +
                    "</div>-->" +
                "</div><hr id='hr-"+i+"' style='margin-top: 2em;'>");                    
            }            
            $("#net").text(sum.toLocaleString()); // 50000 -> 50,000;    
        });

        $(document).keydown(function(objEvent) {
            if (objEvent.keyCode == 13) {  //enter pressed
                objEvent.preventDefault();
                var $this = $(objEvent.target);
                var i_enter = parseFloat($this.attr('data-index'));                      
                if(i_enter == 2){
                    
                }else{
                    var temp = $('[data-index="' + (i_enter+1).toString() + '"]').val();                  
                    $('[data-index="' + (i_enter+1).toString() + '"]').focus().val("").val(temp);
                }                       
            }         
        })

        function disactive(arg) {
            nav_menu = ['home', 'add', 'edit', 'del'];
            for (i = 0; i < 4; i++) {
                if (nav_menu[i] != arg) {
                    if ($("#i-" + nav_menu[i]).hasClass('active')) $("#i-" + nav_menu[i]).removeClass('active');
                }
            }
        }

        function menu(arg) {
            // Animate
            disactive(arg);
            if($("#i-"+arg).hasClass('active')){
                console.log("i-"+arg+"hasClass('active')");
                $("#i-"+arg).removeClass('active');
            }else{
                $("#i-" + arg).fadeOut(150).fadeIn(100, function() {
                  $("#i-" + arg).addClass('active');
                });
            }

            if (arg == "add") {
                goto = "sale.html";
                
                window.location = goto;
            } else if(arg == "edit"){
                // show edit all
                if ($(".i-edit").is(":visible")) {
                  $(".i-del").attr('hidden', true);
                  $(".i-edit").attr('hidden', true);
                  disac("edit");
                } else {
                  $(".i-del").attr('hidden', true);
                  $(".i-edit").attr('hidden', false);
                }
            } else if (arg == "del") {
                // show trash all 
                if($(".i-del").is(":visible")){
                  $(".i-edit").attr('hidden', true);
                  $(".i-del").attr('hidden', true);
                  disac("del");
                }else{
                  $(".i-edit").attr('hidden', true);
                  $(".i-del").attr('hidden', false);
                }
            }
        }
       
        function edit_prod(arg) {
            var amt_old = $("#amount-" + arg).text();
            var price_old = $('#price-'+arg).text();
            var sum_old = amt_old*price_old;   
            var name = $("#name-"+arg).text();
            $("style").append(".jconfirm .jconfirm-box{margin-bottom:60%;}");
            $.confirm({
              title: name,
              content: '<div class="row" style="margin-top: 2%; margin-bottom: 2%;"><div class="col-1"></div><div class="col-5 text-center" style="font-size: 110%; font-weight: bold;">ราคา</div><div class="col-1"></div><div class="col-4 text-center" style="font-size: 110%; font-weight: bold;">จำนวน</div><div class="col-1"></div></div><div class="row"><div class="col-1"></div><div class="col-5 text-center"><input id="edt-price" type="number" class="input-cf" placeholder="" value="'+$("#price-"+arg).text()+'" data-index="1"></div><div class="col-1">x</div><div class="col-4 text-center"><input id="edt-amt" type="number" class="input-cf" placeholder="" value="'+$("#amount-"+arg).text()+'" data-index="2"></div><div class="col-1"></div></div>',
              backgroundDismiss: true,
              onContentReady: function () {
                var temp = $('#edt-price').val();
                $("#edt-price").focus().val("").val(temp);
            },
              buttons: {
                formSubmit: {
                  text: 'ตกลง',
                  btnClass: 'btn-danger',
                  action: function () {
                    if(parseInt($("#edt-amt").val()) > parseInt(arr_data[arg].min)){
                        $.confirm({
                            title: 'เตือน',
                            content: 'สินค้ามีจำนวนไม่พอใน' + localStorage.ware_name_s + ' สินค้ามีจำนวน ' + arr_data[arg].min,
                            backgroundDismiss: true,
                            buttons: {
                                formSubmit: {
                                text: 'ตกลง',
                                btnClass: 'btn-regis',
                                action: function () {
                                }
                                }
                            }
                        }); 
                        $("#edt-amt").val(arr_data[arg].min);	 
                        return 0;
                    }	
                    var price = $("#edt-price").val();   
                    var amt = $("#edt-amt").val();
                    arr_data[arg].amt = amt;  
                    arr_data[arg].price = price;  
                    localStorage.setItem('arr_sale', JSON.stringify(arr_data));   
                    var net = $("#net").html(); 
                    var sum = parseFloat(net.replace(/,/g, ''));
                    var new_net = (sum-sum_old)+(amt*price);
                    $("#net").text(new_net.toLocaleString());                    
                    $("#price-"+arg).text(price); 
                    $("#amount-"+arg).text(amt);
                    $("#sum-"+arg).text(price*amt);                   
                  }
                },
                ยกเลิก: function () {
                    //$(".jconfirm .jconfirm-box").css('margin-bottom', '5%');
                },
              }
            }); 
        }

        function del_prod(arg){
            name = $("#name-"+arg).text();
            $("style").append('.jconfirm .jconfirm-box{margin-bottom: 5%;}');
            $.confirm({
                title: 'ลบรายการ',
                content: 'ต้องการลบ '+name+' หรือไม่',
                backgroundDismiss: true,
                buttons: {  
                  formSubmit: {
                    text: 'ตกลง',
                    btnClass: 'btn-danger',
                    action: function () {
                        var price = $('#price-'+arg).text();   
                        var amt = $('#amount-'+arg).text();
                        var net = $("#net").html();           
                        var sum = parseFloat(net.replace(/,/g, ''))-(price*amt);          
                        $("#net").text(sum.toLocaleString());   
                        $('#prod-'+arg).remove();   
                        $('#collapse-'+arg).remove();   
                        $('#hr-'+arg).remove();                     
                        arrange(arg);
                    }
                  },ยกเลิก: function () {}
                }  
            });          
        }

        function arrange(arg){
            arr_data.splice(arg,1);       
            for(var i = arg+1; i <= arr_data.length; i++){
                $("#prod-"+i).prop('id', 'prod-'+(i-1));
                $("#id-prod-"+i).prop('id', 'id-prod-'+(i-1));
                $("#i-del-"+i).attr('onclick', "del_prod("+(i-1)+")");          
                $("#i-edit-"+i).attr('onclick', "edit_prod("+(i-1)+")");             
                $("#i-del-"+i).prop('id', 'i-del-'+(i-1));
                $("#i-edit-"+i).prop('id', 'i-edit-'+(i-1));     
                $("#name-"+i).attr('onclick', "collapse("+(i-1)+")");   
                $("#amount-"+i).attr('onclick', "collapse("+(i-1)+")");     
                $("#price-"+i).attr('onclick', "collapse("+(i-1)+")");     
                $("#collapse-"+i).attr('onclick', "collapse("+(i-1)+")");            
                $("#price-"+i).prop('id', 'price-'+(i-1));
                $("#amount-"+i).prop('id', 'amount-'+(i-1));                 
                $("#name-"+i).prop('id', 'name-'+(i-1));
                $("#collapse-"+i).prop('id', 'collapse-'+(i-1));
                $("#sum-"+i).prop('id', 'sum-'+(i-1));         
                $("#hr-"+i).prop('id', 'hr-'+(i-1));      
            } 
            localStorage.setItem('arr_sale', JSON.stringify(arr_data));   
            if(arr_data.length == 0){                
                localStorage.arr_sale = "";
            }        
        }
        
        function collapse(arg){
            // 4 is num of prod
            for (i = 0; i < 4; i++) {
                if (i != arg && $("#collapse-" + i).is(":visible")) {
                    $("#collapse-" + i).slideToggle('collapse');
                }
            }
            /*if(arg == 1){
                $("#collapse-"+arg).slideToggle('collapse', function(){
                    var body = $("body, html");
                    var top = $("#ctn-btm").offset().top/7;
                    body.animate({scrollTop :top}, 300);
                });
            }else if(arg == 2){
                $("#collapse-"+arg).slideToggle('collapse', function(){
                    var body = $("body, html");
                    var top = $("#ctn-btm").offset().top/4;
                    body.animate({scrollTop :top}, 600);
                });
            }else if(arg >= 3){
                $("#collapse-"+arg).slideToggle('collapse', function(){
                    var body = $("body, html");
                    var top = $("#ctn-btm").offset().top;
                    body.animate({scrollTop :top}, 1400);
                });
            }*/
            $("#collapse-"+arg).slideToggle('collapse');
        }
      
        function next(){
            if(arr_data.length == 0){
                return 0;
            }         
            localStorage.net =  parseFloat($("#net").html().replace(/,/g, '')); 
            //localStorage.dis =  $('#discount').text();           
            
            window.location = 'sale_info.html';
        }

        function clearAll(){
            // เคลียค่าทั้งหมดและกลับไปหน้า sale เพื่อเริ่มบิลใหม่
            localStorage.cus_name = "";
            localStorage.cus_id = "";
            localStorage.type = "";
            localStorage.arr_sale = "";
            localStorage.net =  "";
            localStorage.arr_prod_s =  "";
            localStorage.cus_addr = "";
            localStorage.cus_tel = "";    
            localStorage.ware_name_s =  "";
            localStorage.ware_id_s = "";
            localStorage.ware_type = "";    
            
            window.location = 'sale.html';
        }
        
        function show_pic(){
            localStorage.img = $('#img').attr('src');           
            goto = "show_pic.html";
            
            window.location = goto;
        }

    </script>
</head>

<body>
    <!-- big container -->
    <div id="big-ctn" class="container-fullwidth justify-content-center">
        <!-- Nav menu top -->
        <div class="row navs align-items-center fixed-top justify-content-center">
          <div id="col-back" class="col-2 text-center" onclick="window.location = 'sale.html';">
            <i id="i-back" class="fas fa-angle-left"></i>
          </div>
          <div class="col-8 text-center">
            <h5 id="h5-title">ตรวจสอบรายการขาย</h5>
          </div>
          <div class="col-2 text-center"></div>
        </div>     
        <div class="sub-header-fixed text-center" style="font-weight: 700; color: #1e293b; font-size: 15px;">
            <i class="fas fa-user text-danger" style="margin-right: 6px;"></i> <span id="cus-title">ลูกค้าทั่วไป</span>
        </div>
        <div id="in-ctn" class="container sub-header-content" style="padding-bottom: 120px !important;">
            <!-- Show --> 
        </div>    
    </div>
    <!-- End big container -->

    <div id="ctn-btm" class="fixed-bottom" style="background: #ffffff; padding: 12px 16px max(12px, var(--safe-bottom)); border-top: 1px solid var(--dd-border); box-shadow: 0 -4px 16px rgba(0,0,0,0.06); height: auto !important; display: block !important;">
        <div class="row align-items-center" style="margin-bottom: 10px;">
            <div class="col-6 text-left" style="font-weight: 700; font-size: 15px; color: #64748b;">
                ยอดรวมสุทธิ
            </div>
            <div class="col-6 text-right" style="font-weight: 800; font-size: 1.35rem; color: #da251c;">
                ฿ <span id="net">0</span>
            </div>
        </div>
        <div class="row">
            <div class="col-4" style="padding-right: 6px;">
                <button class="mbtn-cancle" onclick="clearAll();">ยกเลิก</button>
            </div>
            <div class="col-8" style="padding-left: 6px;">
                <button class="mbtn" onclick="next()">ต่อไป <i class="fas fa-arrow-right" style="margin-left: 6px;"></i></button>
            </div>
        </div>
    </div>
    <script>
        //Touch animation
        $(".mbtn").on("touchstart", function() {
          $(this).addClass('mbtn-touch');
        });
        $(".mbtn").on("touchend", function() {
          $(this).removeClass('mbtn-touch');
        });
        $(".mbtn-cancle").on("touchstart", function() {
          $(this).addClass('mbtn-cancle-touch');
        });
        $(".mbtn-cancle").on("touchend", function() {
          $(this).removeClass('mbtn-cancle-touch');
        });
    </script>
</body>

</html>
